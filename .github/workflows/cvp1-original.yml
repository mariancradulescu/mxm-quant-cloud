name: CVP1 original context continuation multi-asset research
on:
  pull_request:
    paths:
      - 'research/cvp1_original.py'
      - 'research/test_cvp1_native.py'
      - 'research/CVP1_FROZEN_CONTEXT_CONTINUATION_20261117.md'
      - 'src/Mxm.Replay/Cvp1NativeStudy.cs'
      - 'src/Mxm.Core/NativeCausalExitResearch.cs'
      - 'src/Mxm.Core/NativeContextValueResearch.cs'
      - '.github/workflows/cvp1-original.yml'
  push:
    branches: [main]
    paths:
      - 'ops/cvp1-original-once.txt'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Mxm.Replay -c Release
      - run: python -m py_compile research/cvp1_original.py
      - run: python -m unittest research.test_cvp1_native -v
      - run: dotnet run --project tests/Mxm.Checks -c Release
      - name: Verify protocol predates implementation
        run: |
          git fetch --depth=1 origin dc958c847533fc49fbe55520dfd2948a6e7c946b
          git show dc958c847533fc49fbe55520dfd2948a6e7c946b:research/CVP1_FROZEN_CONTEXT_CONTINUATION_20261117.md > /tmp/cvp1-frozen.md
          cmp /tmp/cvp1-frozen.md research/CVP1_FROZEN_CONTEXT_CONTINUATION_20261117.md
  custody-recipient:
    needs: verify
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' &&
      github.run_attempt == '1' &&
      github.event.head_commit.message == 'OWNER_CVP1_ORIGINAL_CONTEXT_CONTINUATION_ONCE'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Derive existing run-bound public recipient
        run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cvp1-custody-recipient-public
          path: new-recipient-output/
          if-no-files-found: error
          retention-days: 30
  original-pepperstone-development:
    needs: custody-recipient
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-existing-oauth-read-only
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cvp1-custody-recipient-public
          path: new-recipient-output
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Mxm.Replay -c Release
      - name: Collect original Pepperstone data and evaluate the shared C# book
        run: python -m research.cvp1_original
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cvp1-original-pepperstone-encrypted-source
          path: cvp1-encrypted/
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cvp1-original-lifecycle-public-receipt
          path: cvp1-public/
          if-no-files-found: error
          retention-days: 90
