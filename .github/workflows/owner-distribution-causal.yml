name: OWNER closed-context peer causality correction
on:
  pull_request:
    paths: ['src/Mxm.PathResearch/**','research/owner_distribution_path.py','research/owner_distribution_causal.py','research/test_distribution_peer_causality.py','research/distribution_path_causal_2.json','.github/workflows/owner-distribution-causal.yml']
  push:
    branches: [main]
    paths: ['research/distribution_path_causal_2.json']
permissions:
  contents: read
  actions: read
jobs:
  technical:
    runs-on: ubuntu-24.04
    outputs:
      new_study: ${{ steps.scope.outputs.new_study }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = push ] && git diff --diff-filter=A --name-only "$BEFORE" "$GITHUB_SHA" | grep -Fxq research/distribution_path_causal_2.json; then
            echo 'new_study=true' >> "$GITHUB_OUTPUT"
          else
            echo 'new_study=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.owner_distribution_causal check
      - run: python -m py_compile research/owner_distribution_path.py research/owner_path_distribution_economic.py
      - run: dotnet build src/Mxm.PathResearch -c Release
      - run: dotnet build src/Mxm.Replay -c Release
      - run: dotnet build src/Mxm.Cloud -c Release
      - run: dotnet run --project tests/Mxm.Checks -c Release
      - run: python -m unittest research.test_distribution_path_input research.test_distribution_peer_causality -v
  annual:
    needs: technical
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'mariancradulescu' && github.run_attempt == 1 && needs.technical.outputs.new_study == 'true'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.PathResearch -c Release
      - run: python -m research.owner_distribution_causal annual --work "$RUNNER_TEMP/annual-private"
        env:
          GH_TOKEN: ${{ github.token }}
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: annual-causal-peer-distribution
          path: distribution-path-report/
          retention-days: 90
          if-no-files-found: warn
