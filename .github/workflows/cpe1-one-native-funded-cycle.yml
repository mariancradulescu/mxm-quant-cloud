name: CPE1 ONE native complete funded economic-cycle exposed original
on:
  pull_request:
    paths:
      - 'research/CPE1_FROZEN_CAUSAL_FINANCED_PAYOFF_CYCLE_20261124.md'
      - 'src/Mxm.Core/NativeUnifiedPortfolioEngine.cs'
      - 'src/Mxm.Core/NativeUnifiedPortfolioEngine.Economic.cs'
      - 'src/Mxm.Core/NativeSimulatedCloseLifecycle.cs'
      - 'src/Mxm.Replay/Cpe1OriginalIntegratedRunner.cs'
      - 'src/Mxm.Replay/Program.cs'
      - 'research/cpe1_one_integrated_original_execute.py'
      - 'tests/Mxm.Checks/Cpe1IntegratedEconomicChecks.cs'
      - 'tests/Mxm.Checks/Program.cs'
      - '.github/workflows/cpe1-one-native-funded-cycle.yml'
  push:
    branches: [main]
    paths:
      - 'ops/cpe1-one-original-exposed-economics-20261124.txt'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      authorized: ${{ steps.owner.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Exact same funded Core + Replay compiles without custody
        run: dotnet build src/Mxm.Replay -c Release
      - name: Existing common Core lifecycle plus CPE1 SOURCE/Pending/Held/protective close tests
        run: dotnet run --project tests/Mxm.Checks -c Release
      - name: Protected Python source-only bridge compiles with no network
        run: python -m py_compile research/cpe1_one_integrated_original_execute.py
      - name: Freeze first, BEFORE prospective implementation and scoring
        shell: bash
        run: |
          git fetch --depth=1 origin 3d38ee366b5de285b5a928478fa46616093d6b94
          git show 3d38ee366b5de285b5a928478fa46616093d6b94:research/CPE1_FROZEN_CAUSAL_FINANCED_PAYOFF_CYCLE_20261124.md > /tmp/CPE1_ORIGINAL_PROTOCOL
          cmp -s /tmp/CPE1_ORIGINAL_PROTOCOL research/CPE1_FROZEN_CAUSAL_FINANCED_PAYOFF_CYCLE_20261124.md
      - name: Only exact OWNER/main marker first-addition commits enable one original
        shell: bash
        id: owner
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          subject=OWNER_CPE1_ONE_EXPOSED_CSHARP_FINANCED_ECONOMICS_20261124
          marker=ops/cpe1-one-original-exposed-economics-20261124.txt
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "$subject" &&
                "$(git diff-tree --no-commit-id --name-status -r HEAD)" == $'A\t'"$marker" &&
                -z "$(git log -1 --format=%H HEAD^ -- "$marker")" &&
                -f "$marker" ]] &&
              cmp -s "$marker" <(printf '%s\n' "$subject"); then
            echo 'authorized=true' >> "$GITHUB_OUTPUT"
          fi
  bdp1-source-only-preflight:
    needs: verify
    # OWNER-authorized source readback only, restricted to this same-repo PR.
    # Existing environment protections remain authoritative; no secret mutation.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 443 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'work/ucp1-causal-portfolio-economics-20261124' &&
      github.actor == 'mariancradulescu' && github.run_attempt == 1
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          run-id: 41724643418
          github-token: ${{ github.token }}
          path: bdp-source
      - name: Authenticate original BDP1 contract fields only, no economic run
        run: python -m research.cpe1_one_integrated_original_execute --preflight-bdp1
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cpe1-bdp1-authentic-contract-source-only-preflight
          path: cpe1-bdp1-preflight/
          retention-days: 90
          if-no-files-found: error
  original-native-economic:
    needs: verify
    if: needs.verify.outputs.authorized == 'true'
    environment: mxm-r3-custody-v1
    concurrency:
      group: cpe1-one-300eur-native-portfolio-original-exposed
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          run-id: 41724643418
          github-token: ${{ github.token }}
          path: bdp-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          run-id: 41735441128
          github-token: ${{ github.token }}
          path: aip-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hxc1-original-historical-encrypted-source
          run-id: 43817213663
          github-token: ${{ github.token }}
          path: mde1-hxc1-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: xmh2-complete-274day-m15-encrypted-source
          run-id: 44352570167
          github-token: ${{ github.token }}
          path: mde1-xmh2-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p05-new-live-readonly-authentic-source-sealed
          run-id: 45134137836
          github-token: ${{ github.token }}
          path: p05-sealed
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p05-new-live-readonly-aggregate-public
          run-id: 45134137836
          github-token: ${{ github.token }}
          path: p05-public
      - name: ONE custody source-only -> ONE Mxm.Core common funded economic cycle
        run: python -m research.cpe1_one_integrated_original_execute
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - name: ONE original public economic receipt; no broker credentials or OHLC
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpe1-one-original-authentic-sourced-csharp-eur300-economic
          path: cpe1-public/
          retention-days: 90
          if-no-files-found: error
