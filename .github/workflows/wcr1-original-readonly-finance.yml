name: WCR1 original weekend BTC to US500 reopen source and EUR300 native economics
on:
  pull_request:
    paths:
      - 'research/wcr1_original_reopen_source.py'
      - 'research/wcr1_original_native_eur_readback.py'
      - 'research/test_wcr1_original.py'
      - '.github/workflows/wcr1-original-readonly-finance.yml'
  push:
    branches: [main]
    paths:
      - 'ops/wcr1-original-once-intent.txt'
      - '.github/workflows/wcr1-original-readonly-finance.yml'
permissions:
  contents: read
  actions: read
jobs:
  validate-frozen-wcr1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      authorized: ${{ steps.owner.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/wcr1_original_reopen_source.py research/wcr1_original_native_eur_readback.py research/test_wcr1_original.py
      - run: python -m unittest research.test_wcr1_original -v
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Mxm.Replay -c Release
      - name: Exact OWNER first-attempt main-only WCR1 one-time original research gate
        id: owner
        shell: bash
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_WCR1_SUNDAY_CRYPTO_US500_ORIGINAL_ONCE" &&
                "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/wcr1-original-once-intent.txt" &&
                "$(cat ops/wcr1-original-once-intent.txt)" == "OWNER_WCR1_52_SUNDAY_US500_SOURCE_AND_EUR_NATIVE_ONCE" ]]; then
              echo 'authorized=true' >> "$GITHUB_OUTPUT"
          fi
  original-run-public-custody:
    needs: validate-frozen-wcr1
    if: ${{ needs.validate-frozen-wcr1.outputs.authorized == 'true' }}
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wcr1-original-run-public-recipient
          path: new-recipient-output/
          retention-days: 5
          if-no-files-found: error
  original-readonly-source:
    needs: [validate-frozen-wcr1, original-run-public-custody]
    if: ${{ needs.validate-frozen-wcr1.outputs.authorized == 'true' }}
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-wcr1-original-52week-source-once
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wcr1-original-run-public-recipient
          path: new-recipient-output
      - name: Original Pepperstone scope-view BTC/US500/EURUSD 52 Sundays; seal before outcome
        run: python -m research.wcr1_original_reopen_source
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wcr1-original-52week-crypto-us500-encrypted
          path: wcr1-original-reopen-source.v2.enc
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wcr1-original-source-coverage-only
          path: wcr1-original-source-public.json
          retention-days: 90
          if-no-files-found: error
  protected-eur300-native-money:
    needs: [validate-frozen-wcr1, original-readonly-source]
    if: ${{ needs.validate-frozen-wcr1.outputs.authorized == 'true' }}
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wcr1-original-52week-crypto-us500-encrypted
          path: wcr1-original
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wcr1-original-source-coverage-only
          path: wcr1-source-public
      - name: Original protobuf independent readback and protected native EUR300 exact fixed score
        run: python -m research.wcr1_original_native_eur_readback
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wcr1-original-eur300-native-financed-evidence
          path: wcr1-original-native-financed-eur300-result.public.json
          retention-days: 90
          if-no-files-found: error
