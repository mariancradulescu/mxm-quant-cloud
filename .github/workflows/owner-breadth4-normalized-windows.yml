name: OWNER normalize verified breadth-4 disjoint windows
on:
  pull_request:
    paths: ['research/official_breadth4_normalized_windows_1.json', 'research/owner_breadth4_normalized_windows.py', 'research/test_official_breadth_spans.py', '.github/workflows/owner-breadth4-normalized-windows.yml']
  push:
    branches: [main]
    paths: ['research/official_breadth4_normalized_windows_1.json']
permissions:
  contents: read
  actions: read
jobs:
  technical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m unittest research.test_official_breadth_spans research.test_official_breadth_extension_4
      - run: python -m research.owner_breadth4_normalized_windows check
  verify:
    needs: technical
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'mariancradulescu' && github.run_attempt == 1
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - run: python -m research.owner_breadth4_normalized_windows download
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Reconcile existing packets, expose actual spans and preserve normalized data
        run: python -m research.owner_breadth4_normalized_windows verify
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-breadth-4-normalized-windows-protected
          path: breadth4-window-cache/*.sealed
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-breadth-4-normalized-windows-public
          path: breadth4-window-cache/normalized-window-receipt.json
          retention-days: 90
          if-no-files-found: error
