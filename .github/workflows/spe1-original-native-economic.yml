name: SPE1 genuinely original 12-symbol M15 native signal-exit economics (no orders)
on:
  pull_request:
    paths:
      - 'research/SPE1_FROZEN_12CLASS_SIGNAL_EXIT_ECONOMIC_20261119.md'
      - 'research/spe1_original_integrated_native.py'
      - 'src/Mxm.Core/NativeSignalEconomicResearch.cs'
      - 'src/Mxm.Core/NativeCausalExitResearch.cs'
      - 'src/Mxm.Replay/Spe1NativeStudy.cs'
      - 'src/Mxm.Replay/Program.cs'
      - '.github/workflows/spe1-original-native-economic.yml'
  push:
    branches: [main]
    paths:
      - 'ops/spe1-original-run-once.txt'
      - '.github/workflows/spe1-original-native-economic.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      owner_once: ${{ steps.owner.outputs.owner_once }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Protocol frozen strictly earlier, prior to implementation, no drift
        run: |
          git merge-base --is-ancestor 48b7d0c8d729e5151cf1070e2f6f023127a1cc2e HEAD
          git show 48b7d0c8d729e5151cf1070e2f6f023127a1cc2e:research/SPE1_FROZEN_12CLASS_SIGNAL_EXIT_ECONOMIC_20261119.md > /tmp/spe1-frozen
          cmp /tmp/spe1-frozen research/SPE1_FROZEN_12CLASS_SIGNAL_EXIT_ECONOMIC_20261119.md
      - run: dotnet build src/Mxm.Replay -c Release
      - run: dotnet run --project tests/Mxm.Checks -c Release
      - run: dotnet build src/Mxm.Cloud -c Release
      - run: python -m py_compile research/spe1_original_integrated_native.py
      - name: Owner exact one-time NEW economic run using existing originals; PR NEVER gets custody
        id: owner
        shell: bash
        run: |
          echo "owner_once=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_SPE1_NEW_INTEGRATED_PRICE_ONLY_SOURCE_REUSE_ONCE" &&
                "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/spe1-original-run-once.txt" &&
                "$(cat ops/spe1-original-run-once.txt)" == "OWNER_SPE1_NEW_CAUSAL_EXIT_NATIVE_ORIGINAL_279491_M15_ONCE" ]]; then
            echo 'owner_once=true' >> "$GITHUB_OUTPUT"
          fi
  original-source-reuse-native-economics:
    needs: verify
    if: ${{ needs.verify.outputs.owner_once == 'true' }}
    environment: mxm-r3-custody-v1
    concurrency:
      group: mxm-spe1-exact-original-source-reuse-only-once
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: xmh2-complete-274day-m15-encrypted-source
          run-id: 44352570167
          github-token: ${{ github.token }}
          path: mde1-xmh2-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hxc1-original-historical-encrypted-source
          run-id: 43817213663
          github-token: ${{ github.token }}
          path: mde1-hxc1-source
      - name: Source-bound NEW signal-exit economic C# evaluation, zero broker request
        run: python -m research.spe1_original_integrated_native
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: spe1-new-12asset-signal-exit-native-original-public
          path: spe1-public/
          if-no-files-found: warn
          retention-days: 90
