name: OWNER full estate monetary recovery and original risk fact audit
on:
  pull_request:
    paths: ['src/Mxm.Core/NativeRecoveredEconomicMechanisms.cs','src/Mxm.Replay/IntegratedEconomicReplay.PersistentRiskAudit.cs','research/owner_estate_monetary_competition.py','research/full_estate_monetary_competition_1.json','research/test_estate_monetary_competition.py','research/owner_persistent_risk_fact_audit.py','.github/workflows/owner-estate-monetary-competition.yml']
  push:
    branches: [main]
    paths: ['research/full_estate_monetary_competition_1.json']
permissions:
  contents: read
  actions: read
jobs:
  technical:
    runs-on: ubuntu-24.04
    outputs:
      new_study: ${{ steps.scope.outputs.new_study }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = push ] && git diff --diff-filter=A --name-only "$BEFORE" "$GITHUB_SHA" | grep -Fxq research/full_estate_monetary_competition_1.json; then
            echo 'new_study=true' >> "$GITHUB_OUTPUT"
          else
            echo 'new_study=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.owner_estate_monetary_competition check
      - run: python -m py_compile research/owner_estate_monetary_competition.py research/owner_persistent_risk_fact_audit.py research/owner_recovery_evidence_review.py
      - run: dotnet build src/Mxm.PathResearch -c Release
      - run: dotnet build src/Mxm.Replay -c Release
      - run: dotnet build src/Mxm.Cloud -c Release
      - run: dotnet run --project tests/Mxm.Checks -c Release
      - run: dotnet src/Mxm.Replay/bin/Release/net8.0/Mxm.Replay.dll --owner-persistent-risk-audit-check
      - run: python -m unittest research.test_estate_monetary_competition research.test_breadth57_causal_ridge research.test_estate_recovery research.test_witnessed_risk_geometry -v
  economic:
    needs: technical
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'mariancradulescu' && github.run_attempt == 1 && needs.technical.outputs.new_study == 'true'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.PathResearch -c Release && dotnet build src/Mxm.Replay -c Release
      - run: python -m research.owner_estate_monetary_competition evaluate --work "$RUNNER_TEMP/estate-private"
        env:
          GH_TOKEN: ${{ github.token }}
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - run: python -m research.owner_estate_monetary_competition conserve
        if: always()
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-estate-monetary-public
          path: estate-monetary-report/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-estate-monetary-reusable-source
          path: estate-monetary-source-sealed/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-estate-monetary-sealed-books
          path: estate-monetary-books-sealed/
          retention-days: 90
          if-no-files-found: warn
  original-risk-facts:
    needs: technical
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'mariancradulescu' && github.run_attempt == 1 && needs.technical.outputs.new_study == 'true'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - run: python -m research.owner_persistent_risk_fact_audit --work "$RUNNER_TEMP/risk-fact-private"
        env:
          GH_TOKEN: ${{ github.token }}
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-persistent-risk-fact-audit
          path: persistent-risk-fact-report/
          retention-days: 90
          if-no-files-found: warn
