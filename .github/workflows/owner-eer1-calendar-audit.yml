name: OWNER EER1 official calendar readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-eer1-calendar-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  calendar-readback:
    if: github.run_attempt == 1
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Verify and open only the original metadata files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15000522105" > "$RUNNER_TEMP/eer1-artifact.json"
          python -c 'import json,sys; a=json.load(open(sys.argv[1])); assert a["id"]==15000522105 and a["workflow_run"]["id"]==45555613548 and a["size_in_bytes"]==233873730 and a["digest"]=="sha256:107b2bc43e6ff25a5799e253b0ab6ee718ad5b88ef3bb3211d84ad6c20b87a5b" and not a["expired"]' "$RUNNER_TEMP/eer1-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15000522105/zip" > "$RUNNER_TEMP/eer1-original.zip"
          echo "107b2bc43e6ff25a5799e253b0ab6ee718ad5b88ef3bb3211d84ad6c20b87a5b  $RUNNER_TEMP/eer1-original.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/eer1-original.zip" receipt.json metadata.sealed -d "$RUNNER_TEMP/eer1-calendar-input"
      - name: Classify official sessions and holiday fields
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: python -m research.owner_eer1_calendar_audit "$RUNNER_TEMP/eer1-calendar-input" "$RUNNER_TEMP/eer1-calendar-audit.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eer1-official-calendar-audit
          path: ${{ runner.temp }}/eer1-calendar-audit.json
          retention-days: 90
          if-no-files-found: error
