name: SQIC1 frozen pooled quote-impulse economics
on:
  pull_request:
    paths:
      - "research/sqic1_quote_impulse.md"
      - "research/sqic1_quote_impulse.py"
      - "research/test_sqic1_quote_impulse.py"
      - ".github/workflows/sqic1.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sqic1.yml"
permissions:
  contents: read
  actions: read
jobs:
  causal-protocol-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Quote-age, two-sided pressure, pooled benchmark regression
        run: python -m unittest research.test_sqic1_quote_impulse -v
  original-pepperstone-economic-screen:
    needs: causal-protocol-tests
    if: >-
      github.event_name == 'push' &&
      github.actor == 'mariancradulescu' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'SQIC1_ORIGINAL_READONLY_ONE_TIME')
    environment: mxm-r3-pepperstone-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Enforce exact once-only original research identity
        run: |
          test "$(git log -1 --format=%s)" = 'SQIC1_ORIGINAL_READONLY_ONE_TIME'
          test -f research/sqic1_quote_impulse.md
          test -f research/sqic1_quote_impulse.py
          test -f research/evidence_registry.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Original account strictly read-only pooled market predictive and cost screen
        run: python -m research.sqic1_quote_impulse
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sqic1-pooled-original-readonly-economics-public
          path: sqic1-public.json
          if-no-files-found: error
          retention-days: 90
