      - name: First-addition-only owner marker, no private key access
        id: gate
        shell: bash
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          subject="$(git log -1 --format=%s)"
          case "$subject" in
            OWNER_P05_ORIGINAL_READBACK_COST_FRONTIER_20261123)
