            echo 'authorized=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Download original 45134137836 sealed source
        if: steps.gate.outputs.authorized == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p05-new-live-readonly-authentic-source-sealed
          run-id: 45134137836
          github-token: ${{ github.token }}
          path: p05-original-sealed
      - name: Download original 45134137836 public receipt
        if: steps.gate.outputs.authorized == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p05-new-live-readonly-aggregate-public
          run-id: 45134137836
          github-token: ${{ github.token }}
          path: p05-original-public
      - name: Decrypt source in protected memory and publish aggregate diagnostic only
        if: steps.gate.outputs.authorized == 'true'
        run: |
          python -m research.p05_source_economic_gate \
            --receipt p05-original-public/receipt.json \
            --sealed-dir p05-original-sealed \
            --output p05-original-economic-aggregate.json
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - name: Upload aggregate-only original source frontier
        if: steps.gate.outputs.authorized == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p05-original-source-mathematical-cost-frontier-public
          path: p05-original-economic-aggregate.json
          retention-days: 90
          if-no-files-found: error
A\t'"$marker" &&
