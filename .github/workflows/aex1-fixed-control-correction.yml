name: AEX1 postclosure fixed-control technical correction
on:
  pull_request:
    paths:
      - 'research/AEX1_FIXED_CONTROL_CORRECTION.md'
      - 'research/aex1_fixed_control_correction.py'
      - 'src/Mxm.Replay/NativeAex1FixedControlCorrection.cs'
      - '.github/workflows/aex1-fixed-control-correction.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aex1-fixed-control-correction.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m py_compile research/aex1_fixed_control_correction.py
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Mxm.Replay -c Release
  original-custody-control-correction:
    needs: verify
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' &&
      github.run_attempt == '1' &&
      startsWith(github.event.head_commit.message, 'AEX1_FIXED_CONTROL_CORRECTION_ONCE')
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fce1-original-pepperstone-encrypted-source
          run-id: 43036474843
          github-token: ${{ github.token }}
          path: original-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: aex1-original-custody-public-receipt
          run-id: 43240155847
          github-token: ${{ github.token }}
          path: original-receipt
      - name: Execute exact native fixed control and preserve original correction boundaries
        run: python -m research.aex1_fixed_control_correction
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aex1-corrected-fixed-control-public-receipt
          path: aex1-fixed-control-correction.json
          if-no-files-found: error
          retention-days: 90
