name: HSD1 systematic original HXC1 price structure and economic screening
on:
  pull_request:
    paths:
      - 'research/hsd1_structure_protocol.json'
      - 'research/hsd1_structure_research.py'
      - 'research/test_hsd1_structure_research.py'
      - '.github/workflows/hsd1-authentic-systematic-structures.yml'
  push:
    branches: [main]
    paths:
      - 'ops/hsd1-study-intent.txt'
      - '.github/workflows/hsd1-authentic-systematic-structures.yml'
permissions:
  contents: read
  actions: read

jobs:
  verify-frozen-systematic-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      authorized: ${{ steps.owner.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/hsd1_structure_research.py
      - run: python -m unittest research.test_hsd1_structure_research -v
      - name: One exact OWNER/main frozen historical systematic research request
        id: owner
        shell: bash
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_HSD1_SYSTEMATIC_HISTORICAL_DISCOVERY_ONCE" &&
                "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/hsd1-study-intent.txt" &&
                "$(cat ops/hsd1-study-intent.txt)" == "OWNER_HSD1_FROZEN_SIX_STRUCTURE_FOUR_REGIME_HXC1_SOURCE_ONLY" ]]; then
            echo 'authorized=true' >> "$GITHUB_OUTPUT"
          fi

  protected-original-historical-systematic-research:
    needs: verify-frozen-systematic-study
    if: needs.verify-frozen-systematic-study.outputs.authorized == 'true'
    environment: mxm-r3-custody-v1
    concurrency:
      group: mxm-hsd1-closed-original-source-52week-once
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hxc1-original-historical-encrypted-source
          run-id: 43817213663
          github-token: ${{ github.token }}
          path: hsd1-original-source
      - name: Original 12-asset multi-structure H1 research with M15/M1 path risk and EUR current-commission lower bound, NO orders
        run: python -m research.hsd1_structure_research
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hsd1-original-historical-systematic-predictive-eur-commission-only
          path: hsd1-public-predictive-economic-proxy.json
          retention-days: 90
          if-no-files-found: error
