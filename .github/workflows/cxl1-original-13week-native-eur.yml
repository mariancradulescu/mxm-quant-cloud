name: CXL1 13-week ORIGINAL pre-gated BTC ETH EUR300 native CSharp finance
on:
  pull_request:
    paths:
      - 'research/cxl1_original_275_source.py'
      - 'research/cxl1_original_native_eur_readback.py'
      - 'research/test_cxl1_original_native.py'
      - '.github/workflows/cxl1-original-13week-native-eur.yml'
  push:
    branches: [main]
    paths:
      - 'ops/cxl1-full-13week-original-once.txt'
      - '.github/workflows/cxl1-original-13week-native-eur.yml'
permissions:
  contents: read
  actions: read
jobs:
  validate-protocol-first:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      allowed: ${{ steps.owner.outputs.allowed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/cxl1_original_275_source.py research/cxl1_original_native_eur_readback.py research/test_cxl1_original_native.py
      - run: python -m unittest research.test_cxl1_original_feasibility research.test_cxl1_original_native -v
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Mxm.Replay -c Release
      - name: OWNER main exact first-attempt full source and matched EUR after prior source PASS
        id: owner
        shell: bash
        run: |
          echo 'allowed=false' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_CXL1_FULL_13WEEK_ORIGINAL_EUR_ONCE" &&
                "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/cxl1-full-13week-original-once.txt" &&
                "$(cat ops/cxl1-full-13week-original-once.txt)" == "OWNER_CXL1_ORIGINAL_275_PLUS_PILOT50_NATIVE_EUR300_ONCE" ]]; then
              echo 'allowed=true' >> "$GITHUB_OUTPUT"
          fi
  custody-public-recipient:
    needs: validate-protocol-first
    if: ${{ needs.validate-protocol-first.outputs.allowed == 'true' }}
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cxl1-full-275-original-custody-public
          path: new-recipient-output/
          retention-days: 5
          if-no-files-found: error
  full-original-275-readonly-source:
    needs: [validate-protocol-first, custody-public-recipient]
    if: ${{ needs.validate-protocol-first.outputs.allowed == 'true' }}
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-cxl1-original-275-earlier-once
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cxl1-full-275-original-custody-public
          path: new-recipient-output
      - name: Original Pepperstone BTC ETH EURUSD 275 earlier endpoints; source seal BEFORE profit
        run: python -m research.cxl1_original_275_source
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cxl1-original-275-earlier-sealed-source
          path: cxl1-earlier-275-authentic.v2.enc
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cxl1-original-275-earlier-source-coverage
          path: cxl1-original-275-source-public.json
          retention-days: 90
          if-no-files-found: error
  protected-original-native-money:
    needs: [validate-protocol-first, full-original-275-readonly-source]
    if: ${{ needs.validate-protocol-first.outputs.allowed == 'true' }}
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cxl1-original-275-earlier-sealed-source
          path: cxl1-new-encrypted
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cxl1-original-275-earlier-source-coverage
          path: cxl1-new-public
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cxl1-original-50clock-source-encrypted
          run-id: 43945139889
          github-token: ${{ github.token }}
          path: cxl1-pilot-encrypted
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cxl1-original-50clock-pilot-public
          run-id: 43945139889
          github-token: ${{ github.token }}
          path: cxl1-pilot-public
      - name: Verify all original raw protobuf and score one new native CSharp EUR300 matched policy
        run: python -m research.cxl1_original_native_eur_readback
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cxl1-original-13week-native-eur300-financial
          path: cxl1-original-authentic-13week-native-eur300.public.json
          retention-days: 90
          if-no-files-found: error
