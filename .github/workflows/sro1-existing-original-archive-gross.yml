name: SRO1 existing original ECA1 source economic gross cross-sector replay
on:
  pull_request:
    paths:
      - 'research/SRO1_US_SECTOR_ROTATION_BASKET.md'
      - 'research/sro1_original_archive_sector_economics.py'
      - 'research/test_sro1_original_archive_sector_economics.py'
      - '.github/workflows/sro1-existing-original-archive-gross.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sro1-existing-original-archive-gross.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/sro1_original_archive_sector_economics.py research/test_sro1_original_archive_sector_economics.py
      - run: python -m unittest research.test_sro1_original_archive_sector_economics -v
  protected-original-archive-gross-economic-research:
    needs: verify
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' && github.run_attempt == '1' &&
      startsWith(github.event.head_commit.message, 'OWNER_SRO1_REUSE_ORIGINAL_ONCE')
    environment: mxm-r3-custody-v1
    permissions:
      contents: read
      actions: read
    concurrency:
      group: mxm-sro1-original-eca1-research-one-shot
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: eca1-original-encrypted-source
          run-id: 43498785771
          github-token: ${{ github.token }}
          path: source-original
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: eca1-original-public-economic
          run-id: 43498785771
          github-token: ${{ github.token }}
          path: source-public
      - name: Decrypt exact preexisting ECA1 tape and score frozen sector rotation gross only
        run: python -m research.sro1_original_archive_sector_economics
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sro1-original-eca1-archive-gross-economic-verdict
          path: sro1-archived-original-economic-gross.json
          if-no-files-found: error
          retention-days: 90
