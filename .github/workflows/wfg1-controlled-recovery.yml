name: WFG1 controlled recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wfg1-controlled-recovery.yml'
permissions: {}
concurrency:
  group: wfg1-original-43096900076-recovery
  cancel-in-progress: false
jobs:
  fence-original:
    if: >-
      github.actor == 'mariancradulescu' &&
      github.run_attempt == '1' &&
      github.event.before == '8772dd45dc7768c48d44b50ea8bd909bd7075b28' &&
      github.event.head_commit.message == 'WFG1_RECOVERY_CONTROL_43096900076'
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    outputs:
      original_conclusion: ${{ steps.fence.outputs.original_conclusion }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Establish terminal state before permitting custody
        id: fence
        run: python3 research/wfg1_recovery_guard.py
        env:
          GH_TOKEN: ${{ github.token }}
  protected-recovery:
    needs: fence-original
    if: github.run_attempt == '1' && needs.fence-original.outputs.original_conclusion != ''
    permissions:
      contents: read
      actions: read
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8772dd45dc7768c48d44b50ea8bd909bd7075b28
          persist-credentials: false
      - name: Verify preregistered revision and protocol
        run: |
          test "$(git rev-parse HEAD)" = 8772dd45dc7768c48d44b50ea8bd909bd7075b28
          echo 'd3c5c4b266cf30577ec5664fa84aa8be6da13f38c54dba6e91ab94ba09041354  research/WFG1.md' | sha256sum -c -
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fce1-original-pepperstone-encrypted-source
          run-id: 43036474843
          github-token: ${{ github.token }}
          path: original-source
      - name: Execute frozen WFG1 in existing custody
        run: python -m research.wfg1
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - name: Attach recovery provenance
        env:
          ORIGINAL_CONCLUSION: ${{ needs.fence-original.outputs.original_conclusion }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          payload = {
              "originalRunId": 43096900076,
              "originalAttempt": 1,
              "originalConclusion": os.environ["ORIGINAL_CONCLUSION"],
              "recoveryRunId": int(os.environ["GITHUB_RUN_ID"]),
              "recoveryAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "economicCommit": "8772dd45dc7768c48d44b50ea8bd909bd7075b28",
              "receiptSha256": hashlib.sha256(Path("wfg1-public.json").read_bytes()).hexdigest(),
              "independentConfirmation": False,
          }
          Path("wfg1-recovery-provenance.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wfg1-recovery-public-receipt
          path: |
            wfg1-public.json
            wfg1-recovery-provenance.json
          if-no-files-found: error
          retention-days: 90
