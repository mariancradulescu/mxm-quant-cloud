name: SFX1 original FX M15/H4 economic read-only programme
on:
  push:
    branches: [main]
    paths: ['ops/sfx1-research-intent.txt']
permissions:
  contents: read
  actions: read
jobs:
  verify_sfx1_exact_owner_request:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'MXM_SFX1_ORIGINAL_FX_M15_H4_ECONOMIC_SCORE_ONCE'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Guard single-file owner/main original account read-only authorization
        shell: bash
        run: |
          test "$(git log -1 --format=%s)" = 'MXM_SFX1_ORIGINAL_FX_M15_H4_ECONOMIC_SCORE_ONCE'
          test "$(git diff --name-only HEAD^ HEAD)" = 'ops/sfx1-research-intent.txt'
          test "$(cat ops/sfx1-research-intent.txt)" = 'SFX1_FOUR_NEW_FX_ORIGINAL_M15_NATIVE_H4_COST_BENCHMARK_ONCE'
          test ! -f docs/SFX1_AUTHENTIC_RESULT_20261108.json
          test -f research/sfx1_protocol.json
          test -f docs/CMA1_AUTHENTIC_CONTRACT_TERMS_20261108.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m unittest research.test_sfx1 -v
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build src/Mxm.Replay -c Release
      - run: dotnet run --project tests/Mxm.Checks -c Release

  sfx1_run_bound_recipient:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' &&
      github.event_name == 'push' &&
      needs.verify_sfx1_exact_owner_request.result == 'success'
    needs: verify_sfx1_exact_owner_request
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: mxm-r3-custody-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Derive run-bound recipient from existing protected private key
        run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sfx1-bound-custody-recipient-public-only
          path: new-recipient-output/
          if-no-files-found: error
          retention-days: 90

  sfx1_original_broker_m15_collect:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' &&
      github.event_name == 'push' &&
      needs.verify_sfx1_exact_owner_request.result == 'success' &&
      needs.sfx1_run_bound_recipient.result == 'success'
    needs: [verify_sfx1_exact_owner_request, sfx1_run_bound_recipient]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: mxm-r3-pepperstone-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sfx1-bound-custody-recipient-public-only
          path: new-source-recipient
      - name: One-time 486 original-account read-only M15 and cost observations
        run: python -m research.sfx1_source
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sfx1-original-fx-m15-sealed-source
          path: sealed-output/
          if-no-files-found: error
          retention-days: 90

  sfx1_custody_native_parity_economic_result:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' &&
      github.event_name == 'push' &&
      needs.verify_sfx1_exact_owner_request.result == 'success' &&
      needs.sfx1_original_broker_m15_collect.result == 'success'
    needs: [verify_sfx1_exact_owner_request, sfx1_original_broker_m15_collect]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: mxm-r3-custody-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build src/Mxm.Replay -c Release
      - run: dotnet run --project tests/Mxm.Checks -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sfx1-original-fx-m15-sealed-source
          path: sealed-output
      - name: Original account source + real native CSharp sign parity before economic labels
        run: python -m research.sfx1_source --readback
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sfx1-authentic-original-m15-native-predictive-economics-public-only
          path: sfx1-authentic-public.json
          if-no-files-found: error
          retention-days: 90
