    needs: [verify, depth_channel_capture]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: mxm-r3-custody-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: depth-channel-sealed-source
          path: sealed-output
      - name: Reconstruct original protobuf deltas and prospectively fixed source gate
        run: python -m research.depth_channel_pilot --readback
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: depth-channel-public-only
          path: depth-channel.public.json
          if-no-files-found: error
          retention-days: 90
