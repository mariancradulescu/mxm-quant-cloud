      - name: Exact owner/main predeclared integrated portfolio economics intent
        id: epa
        shell: bash
        run: |
          echo "authorized_portfolio_economic=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_EPA1_INTEGRATED_PORTFOLIO_ECONOMICS" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/portfolio-economic-request.txt" ]]; then
            echo "authorized_portfolio_economic=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Exact owner/main prospectively frozen holding-risk portfolio intent
        id: epa2
        shell: bash
        run: |
          echo "authorized_portfolio_holding=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_EPA2_HOLDING_PORTFOLIO_ECONOMICS" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/portfolio-holding-request.txt" ]]; then
            echo "authorized_portfolio_holding=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Exact owner/main frozen EPA2 evidence diagnosis without broker access
        id: holding_diag
        shell: bash
        run: |
          echo "authorized_holding_diagnosis=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_EPA2_FROZEN_EVIDENCE_DIAGNOSIS" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/holding-diagnosis-request.txt" ]]; then
            echo "authorized_holding_diagnosis=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Recognize owner/main broker-free causal observation feasibility request
        id: cef
        shell: bash
        run: |
          echo "authorized_observation_feasibility=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_CAUSAL_OBSERVATION_FEASIBILITY" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/observation-feasibility-request.txt" ]]; then
            echo "authorized_observation_feasibility=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Recognize exact owner/main prospective sequence portfolio economics intent
        id: sqp
        shell: bash
        run: |
          echo "authorized_sequence_portfolio=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_SEQUENCE_PORTFOLIO_ECONOMICS" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/sequence-portfolio-request.txt" ]]; then
            echo "authorized_sequence_portfolio=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Recognize exact owner/main original encrypted-source preservation intent
        id: sqp_preserve
        shell: bash
        run: |
          echo "authorized_sqp_preservation=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_SQP1_ENCRYPTED_SOURCE_PRESERVATION" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/sqp1-preserve-source-request.txt" ]]; then
            echo "authorized_sqp_preservation=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Recognize exact owner/main integrated discovery and native-ledger reception intent
        id: bdp
        shell: bash
        run: |
          echo "authorized_discovery_program=false" >> "$GITHUB_OUTPUT"
          echo "authorized_discovery_reception=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_INTEGRATED_DISCOVERY_PROGRAM" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/portfolio-discovery-request.txt" ]]; then
            echo "authorized_discovery_program=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_BDP1_CALENDAR_FACT_RECEPTION" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/portfolio-discovery-reception-request.txt" ]]; then
            echo "authorized_discovery_program=true" >> "$GITHUB_OUTPUT"
            echo "authorized_discovery_reception=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Exact owner/main auction-inventory and broker-identity read-only research intent
        id: aip
        shell: bash
        run: |
          echo "authorized_auction_inventory=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
