            echo "authorized_carry_preflight=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate exact owner/main prospective depth information-channel intent
        id: dcp
        shell: bash
        run: |
          echo "authorized_depth_channel=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_DEPTH_CHANNEL_PILOT" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/depth-channel-request.txt" ]]; then
            echo "authorized_depth_channel=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            6.0.x
      - run: dotnet run --project tests/Mxm.Checks -c Release
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m research.verify_owner_policy
      - name: Reproduce system economic constraints from frozen public receipts only
        run: python -m research.system_economic_feasibility
      - run: python -m research.verify_epa1_receipt
      - run: python -m research.verify_holding_receipt
      - run: python -m pip install -r research/requirements.txt
      - run: python -m unittest research.test_depth_channel_pilot -v
      - run: python -m unittest research.test_pipeline research.test_intraday_net research.test_flow_net research.test_neighbour_net research.test_funded_replay research.test_relative_gross research.test_tick_volume_net research.test_anchor_signal research.test_session_wick_signal research.test_orchestrated_replay research.test_joint_quote_extension research.test_portfolio_economic research.test_holding_economic research.test_causal_observation
      - name: Verify native open-equity monitor from immutable modeled holding marks
        run: python -m research.verify_frozen_risk_observations
      - name: Preserve sampled native risk observation receipt without study replay
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-risk-observation-frozen-public-only
          path: native-risk-observation.public.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify native monetary reconstruction from frozen public settlement facts only
        run: python -m research.verify_frozen_money_recovery
      - name: Preserve native monetary reconstruction receipt without broker requests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-monetary-recovery-frozen-public-only
          path: native-monetary-recovery.public.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify original 100 encrypted archive identities with read-only GitHub API token
        run: python -m research.legacy_manifest_remote
        env:
          MXM_GITHUB_METADATA_READ_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: original-archive-public-identity-only
          path: legacy-archive-public-receipt.json
          if-no-files-found: error
          retention-days: 30
      - run: dotnet build src/Mxm.Cloud -c Release
      - name: Verify algo produced
        run: test -n "$(find src/Mxm.Cloud/bin/Release -name '*.algo' -print -quit)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mxm-observation-only-not-authorized-for-activation
          path: src/Mxm.Cloud/bin/Release/**/*.algo
          if-no-files-found: error
      - name: Recover original SQP1 ciphertext without broker access or decryption
        if: steps.sqp_preserve.outputs.authorized_sqp_preservation == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sealed-source
          path: sqp1-preserved-source
          run-id: 41706496201
          github-token: ${{ github.token }}
      - name: Verify original source hash without economic replay
        if: steps.sqp_preserve.outputs.authorized_sqp_preservation == 'true'
        run: |
          python - <<'PYHASH'
          import json,hashlib
          from pathlib import Path
          r=json.loads(Path('docs/SQP1_AUTHENTIC_RESULT.json').read_text())
          assert hashlib.sha256(Path('sqp1-preserved-source/source.envelope.json').read_bytes()).hexdigest()==r['sourceCiphertextSha256']
          print('SQP1 original ciphertext binding verified; no decryption or economic replay')
          PYHASH
      - name: Preserve original bound ciphertext beyond initial retention
        if: steps.sqp_preserve.outputs.authorized_sqp_preservation == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
