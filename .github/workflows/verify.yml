name: Verify native foundation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      collect:
        description: Run protected read-only source collection and custody readback
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    outputs:
      authorized_source_request: ${{ steps.intent.outputs.authorized_source_request }}
      authorized_cold_source_score: ${{ steps.cold.outputs.authorized_cold_source_score }}
      authorized_economic_request: ${{ steps.economic.outputs.authorized_economic_request }}
      authorized_economic_screen: ${{ steps.econ_screen.outputs.authorized_economic_screen }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Validate exact owner source admission intent without secrets
        id: intent
        shell: bash
        run: |
          echo "authorized_source_request=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_READ_ONLY_SOURCE_ADMISSION" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/collect-request.txt" ]]; then
            echo "authorized_source_request=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate explicit owner cold score intent without secrets
        id: cold
        shell: bash
        run: |
          echo "authorized_cold_source_score=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_COLD_SOURCE_SCORE" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/cold-score-request.txt" ]]; then
            echo "authorized_cold_source_score=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify exact OWNER new multi-resolution economic data request
        id: economic
        shell: bash
        run: |
          echo "authorized_economic_request=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_ECONOMIC_SOURCE_ADMISSION" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/economic-request.txt" ]]; then
            echo "authorized_economic_request=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify exact OWNER frozen new economic signal research intent
        id: econ_screen
        shell: bash
        run: |
          echo "authorized_economic_screen=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_COLD_ECONOMIC_SCREEN" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/economic-screen-request.txt" ]]; then
            echo "authorized_economic_screen=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            6.0.x
      - run: dotnet run --project tests/Mxm.Checks -c Release
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m unittest research.test_pipeline
      - name: Verify original 100 encrypted archive identities with read-only GitHub API token
        run: python -m research.legacy_manifest_remote
        env:
          MXM_GITHUB_METADATA_READ_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: original-archive-public-identity-only
          path: legacy-archive-public-receipt.json
          if-no-files-found: error
          retention-days: 30
      - run: dotnet build src/Mxm.Cloud -c Release
      - name: Verify algo produced
        run: test -n "$(find src/Mxm.Cloud/bin/Release -name '*.algo' -print -quit)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mxm-observation-only-not-authorized-for-activation
          path: src/Mxm.Cloud/bin/Release/**/*.algo
          if-no-files-found: error
  custody_recipient:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.collect == true) ||
        (github.event_name == 'push' &&
          (needs.verify.outputs.authorized_source_request == 'true' || needs.verify.outputs.authorized_economic_request == 'true'))
      )
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: mxm-r3-custody-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Derive run-bound new-source recipient from existing installed private
        run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: new-source-recipient-public-only
          path: new-recipient-output/
          if-no-files-found: error
          retention-days: 30
  collect:
    # Secrets are unavailable to PRs, branches, generic pushes and non-owner triggers.
    # A precise source-request file update substitutes for dispatch from Chat normal.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.collect == true) ||
        (github.event_name == 'push' &&
          (needs.verify.outputs.authorized_source_request == 'true' || needs.verify.outputs.authorized_economic_request == 'true'))
      )
    needs: [verify, custody_recipient]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-existing-oauth-read-only
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: new-source-recipient-public-only
          path: new-source-recipient
      - name: Existing bounded source H1 collection (non-economic request only)
        if: needs.verify.outputs.authorized_economic_request != 'true'
        run: python -m research.collect
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - name: New broad economic source (no historical model replay)
        if: needs.verify.outputs.authorized_economic_request == 'true'
        run: python -m research.economic_source
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sealed-source
          path: sealed-output/
          if-no-files-found: error
          retention-days: 30
  custody:
    # Domain-bound new-source readback, independent of historical archive recipient.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.collect == true) ||
        (github.event_name == 'push' &&
          (needs.verify.outputs.authorized_source_request == 'true' || needs.verify.outputs.authorized_economic_request == 'true'))
      ) &&
      needs.verify.result == 'success' &&
      needs.collect.result == 'success'
    needs: [verify, collect]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: mxm-r3-custody-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sealed-source
          path: sealed-output
      - name: Existing v2 H1 source readback
        if: needs.verify.outputs.authorized_economic_request != 'true'
        run: python -m research.readback
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - name: New economic multi-resolution CSharp custody and source coverage
        if: needs.verify.outputs.authorized_economic_request == 'true'
        run: python -m research.economic_readback
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - name: Upload existing original v2 CSharp source receipt
        if: needs.verify.outputs.authorized_economic_request != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: new-source-custody-public-receipt
          path: readback.public.json
          if-no-files-found: error
      - name: Upload NEW economic source CSharp receipt without raw source
        if: needs.verify.outputs.authorized_economic_request == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: economic-source-csharp-public-receipt
          path: economic-source-receipt.public.json
          if-no-files-found: error

  cold_causal_score:
    # Explicit owner/main single-source readback: no broker or order requests.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' &&
      github.event_name == 'push' &&
      needs.verify.outputs.authorized_cold_source_score == 'true'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: mxm-r3-custody-v1
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sealed-source
          path: sealed-output
          run-id: 41467047520
          github-token: ${{ github.token }}
      - name: Cold score frozen CSharp model on prior authenticated v2 source
        run: python -m research.score_existing_source
        env:
          MXM_FROZEN_SOURCE_RUN_ID: '41467047520'
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: causal-cold-score-public-only
          path: causal-cold-score.public.json
          if-no-files-found: error
          retention-days: 30

  cold_economic_screen:
    # NO broker requests; original v2 sealed source is exact immutable run.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' &&
      github.event_name == 'push' &&
      needs.verify.outputs.authorized_economic_screen == 'true'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: mxm-r3-custody-v1
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sealed-source
          path: sealed-output
          run-id: 41476636915
          github-token: ${{ github.token }}
      - name: Score new fixed H4/M15 breakout research using authentic sealed market source
        run: python -m research.score_economic_source
        env:
          MXM_FROZEN_ECONOMIC_RUN_ID: '41476636915'
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: economic-frozen-breakout-public-only
          path: economic-breakout.public.json
          if-no-files-found: error
          retention-days: 30
