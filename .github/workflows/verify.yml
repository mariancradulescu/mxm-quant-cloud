            echo "authorized_policy_attribution=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate exact owner/main M15 anchored genuine NET research request
        id: m15_anchor
        shell: bash
        run: |
          echo "authorized_m15_anchor_net=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_AUTHENTIC_M15_ANCHOR_NET_STUDY" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/m15-anchor-net-request.txt" ]]; then
            echo "authorized_m15_anchor_net=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Exact owner/main source-reuse wick economics intent, no broker access
        id: wick
        shell: bash
        run: |
          echo "authorized_wick_net=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_FROZEN_M15_WICK_SESSION_NET" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/m15-wick-net-request.txt" ]]; then
            echo "authorized_wick_net=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Exact owner/main integrated system research intent
        id: joint
        shell: bash
        run: |
          echo "authorized_joint_opportunity=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_JOINT_OPPORTUNITY_DEVELOPMENT" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/joint-opportunity-request.txt" ]]; then
            echo "authorized_joint_opportunity=true" >> "$GITHUB_OUTPUT"
