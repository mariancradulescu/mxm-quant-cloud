name: Verify native foundation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      collect:
        description: Run protected read-only source collection and custody readback
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    permissions:
      contents: read
      actions: read
    outputs:
      authorized_depth_channel: ${{ steps.dcp.outputs.authorized_depth_channel }}
      authorized_source_request: ${{ steps.intent.outputs.authorized_source_request }}
      authorized_cold_source_score: ${{ steps.cold.outputs.authorized_cold_source_score }}
      authorized_economic_request: ${{ steps.economic.outputs.authorized_economic_request }}
      authorized_economic_screen: ${{ steps.econ_screen.outputs.authorized_economic_screen }}
      authorized_regime_discovery: ${{ steps.regime.outputs.authorized_regime_discovery }}
      authorized_neighbour_net: ${{ steps.neighbour.outputs.authorized_neighbour_net }}
      authorized_flow_net: ${{ steps.flow.outputs.authorized_flow_net }}
      authorized_intraday_net: ${{ steps.intraday.outputs.authorized_intraday_net }}
      authorized_net_coverage: ${{ steps.net_cov.outputs.authorized_net_coverage }}
      authorized_relative_gross: ${{ steps.relative.outputs.authorized_relative_gross }}
      authorized_volume_net: ${{ steps.volume_net.outputs.authorized_volume_net }}
      authorized_policy_attribution: ${{ steps.policy_attribution.outputs.authorized_policy_attribution }}
      authorized_m15_anchor_net: ${{ steps.m15_anchor.outputs.authorized_m15_anchor_net }}
      authorized_carry_preflight: ${{ steps.ccp.outputs.authorized_carry_preflight }}
      authorized_auction_inventory: ${{ steps.aip.outputs.authorized_auction_inventory }}
      authorized_discovery_program: ${{ steps.bdp.outputs.authorized_discovery_program }}
      authorized_discovery_reception: ${{ steps.bdp.outputs.authorized_discovery_reception }}
      authorized_sequence_portfolio: ${{ steps.sqp.outputs.authorized_sequence_portfolio }}
      authorized_observation_feasibility: ${{ steps.cef.outputs.authorized_observation_feasibility }}
      authorized_holding_diagnosis: ${{ steps.holding_diag.outputs.authorized_holding_diagnosis }}
      authorized_portfolio_holding: ${{ steps.epa2.outputs.authorized_portfolio_holding }}
      authorized_portfolio_economic: ${{ steps.epa.outputs.authorized_portfolio_economic }}
      authorized_joint_quote_extension: ${{ steps.joint_quotes.outputs.authorized_joint_quote_extension }}
      authorized_joint_opportunity: ${{ steps.joint.outputs.authorized_joint_opportunity }}
      authorized_wick_net: ${{ steps.wick.outputs.authorized_wick_net }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Validate exact owner source admission intent without secrets
        id: intent
        shell: bash
        run: |
          echo "authorized_source_request=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_READ_ONLY_SOURCE_ADMISSION" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/collect-request.txt" ]]; then
            echo "authorized_source_request=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate explicit owner cold score intent without secrets
        id: cold
        shell: bash
        run: |
          echo "authorized_cold_source_score=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_COLD_SOURCE_SCORE" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/cold-score-request.txt" ]]; then
            echo "authorized_cold_source_score=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify exact OWNER new multi-resolution economic data request
        id: economic
        shell: bash
        run: |
          echo "authorized_economic_request=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_ECONOMIC_SOURCE_ADMISSION" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/economic-request.txt" ]]; then
            echo "authorized_economic_request=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify exact OWNER frozen new economic signal research intent
        id: econ_screen
        shell: bash
        run: |
          echo "authorized_economic_screen=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_COLD_ECONOMIC_SCREEN" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/economic-screen-request.txt" ]]; then
            echo "authorized_economic_screen=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify owner-only original broker EUR200 cost gap research intent
        id: net_cov
