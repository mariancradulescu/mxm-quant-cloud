            echo "authorized_neighbour_net=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Recognize exact owner/main research-only USD-relative gross request
        id: relative
        shell: bash
        run: |
          echo "authorized_relative_gross=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_AUTHENTIC_RELATIVE_GROSS_STUDY" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/relative-gross-request.txt" ]]; then
            echo "authorized_relative_gross=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Recognize exact owner/main H1 volume dislocation quote NET request
        id: volume_net
        shell: bash
        run: |
          echo "authorized_volume_net=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
