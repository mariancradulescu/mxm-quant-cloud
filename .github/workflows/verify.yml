name: Verify native foundation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      collect:
        description: Run protected read-only source collection and custody readback
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    outputs:
      authorized_source_request: ${{ steps.intent.outputs.authorized_source_request }}
      authorized_cold_source_score: ${{ steps.cold.outputs.authorized_cold_source_score }}
      authorized_economic_request: ${{ steps.economic.outputs.authorized_economic_request }}
      authorized_economic_screen: ${{ steps.econ_screen.outputs.authorized_economic_screen }}
      authorized_regime_discovery: ${{ steps.regime.outputs.authorized_regime_discovery }}
      authorized_neighbour_net: ${{ steps.neighbour.outputs.authorized_neighbour_net }}
      authorized_flow_net: ${{ steps.flow.outputs.authorized_flow_net }}
      authorized_intraday_net: ${{ steps.intraday.outputs.authorized_intraday_net }}
      authorized_net_coverage: ${{ steps.net_cov.outputs.authorized_net_coverage }}
      authorized_relative_gross: ${{ steps.relative.outputs.authorized_relative_gross }}
      authorized_volume_net: ${{ steps.volume_net.outputs.authorized_volume_net }}
      authorized_policy_attribution: ${{ steps.policy_attribution.outputs.authorized_policy_attribution }}
      authorized_m15_anchor_net: ${{ steps.m15_anchor.outputs.authorized_m15_anchor_net }}
      authorized_joint_quote_extension: ${{ steps.joint_quotes.outputs.authorized_joint_quote_extension }}
      authorized_joint_opportunity: ${{ steps.joint.outputs.authorized_joint_opportunity }}
      authorized_wick_net: ${{ steps.wick.outputs.authorized_wick_net }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Validate exact owner source admission intent without secrets
        id: intent
        shell: bash
        run: |
          echo "authorized_source_request=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_READ_ONLY_SOURCE_ADMISSION" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/collect-request.txt" ]]; then
            echo "authorized_source_request=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate explicit owner cold score intent without secrets
        id: cold
        shell: bash
        run: |
          echo "authorized_cold_source_score=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_COLD_SOURCE_SCORE" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/cold-score-request.txt" ]]; then
            echo "authorized_cold_source_score=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify exact OWNER new multi-resolution economic data request
        id: economic
        shell: bash
        run: |
          echo "authorized_economic_request=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_ECONOMIC_SOURCE_ADMISSION" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/economic-request.txt" ]]; then
            echo "authorized_economic_request=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify exact OWNER frozen new economic signal research intent
        id: econ_screen
        shell: bash
        run: |
          echo "authorized_economic_screen=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_COLD_ECONOMIC_SCREEN" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/economic-screen-request.txt" ]]; then
            echo "authorized_economic_screen=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify owner-only original broker EUR200 cost gap research intent
        id: net_cov
        shell: bash
        run: |
          echo "authorized_net_coverage=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_AUTHENTIC_NET_COVERAGE" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/net-coverage-request.txt" ]]; then
            echo "authorized_net_coverage=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify exact OWNER native intraday NET research intent
        id: intraday
        shell: bash
        run: |
          echo "authorized_intraday_net=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_INTRADAY_NET_STUDY" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/intraday-net-request.txt" ]]; then
            echo "authorized_intraday_net=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify exact OWNER cost-first causal flow study intent
        id: flow
        shell: bash
        run: |
          echo "authorized_flow_net=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_CAUSAL_FLOW_NET_STUDY" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/flow-net-request.txt" ]]; then
            echo "authorized_flow_net=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify owner exact broad development intent without broker access
        id: regime
        shell: bash
        run: |
          echo "authorized_regime_discovery=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_WIDE_REGIME_DISCOVERY" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/regime-discovery-request.txt" ]]; then
            echo "authorized_regime_discovery=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify exact OWNER calibrated H1 neighbour NET study intent
        id: neighbour
        shell: bash
        run: |
          echo "authorized_neighbour_net=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_CALIBRATED_NEIGHBOUR_NET_STUDY" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/neighbour-net-request.txt" ]]; then
            echo "authorized_neighbour_net=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Recognize exact owner/main research-only USD-relative gross request
        id: relative
        shell: bash
        run: |
          echo "authorized_relative_gross=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_AUTHENTIC_RELATIVE_GROSS_STUDY" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/relative-gross-request.txt" ]]; then
            echo "authorized_relative_gross=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Recognize exact owner/main H1 volume dislocation quote NET request
        id: volume_net
        shell: bash
        run: |
          echo "authorized_volume_net=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_AUTHENTIC_H1_VOLUME_NET_STUDY" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/volume-net-request.txt" ]]; then
            echo "authorized_volume_net=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Recognize owner-only immutable H1 quote policy attribution request
        id: policy_attribution
        shell: bash
        run: |
          echo "authorized_policy_attribution=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_FROZEN_H1_POLICY_ATTRIBUTION" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/volume-policy-attribution-request.txt" ]]; then
            echo "authorized_policy_attribution=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate exact owner/main M15 anchored genuine NET research request
        id: m15_anchor
        shell: bash
        run: |
          echo "authorized_m15_anchor_net=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_AUTHENTIC_M15_ANCHOR_NET_STUDY" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/m15-anchor-net-request.txt" ]]; then
            echo "authorized_m15_anchor_net=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Exact owner/main source-reuse wick economics intent, no broker access
        id: wick
        shell: bash
        run: |
          echo "authorized_wick_net=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_FROZEN_M15_WICK_SESSION_NET" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/m15-wick-net-request.txt" ]]; then
            echo "authorized_wick_net=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Exact owner/main integrated system research intent
        id: joint
        shell: bash
        run: |
          echo "authorized_joint_opportunity=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_JOINT_OPPORTUNITY_DEVELOPMENT" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/joint-opportunity-request.txt" ]]; then
            echo "authorized_joint_opportunity=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Exact owner/main bounded execution-evidence extension intent
        id: joint_quotes
        shell: bash
        run: |
          echo "authorized_joint_quote_extension=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_JOINT_QUOTE_EVIDENCE_EXTENSION" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/joint-quote-extension-request.txt" ]]; then
            echo "authorized_joint_quote_extension=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            6.0.x
      - run: dotnet run --project tests/Mxm.Checks -c Release
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m research.verify_owner_policy
      - run: python -m pip install -r research/requirements.txt
      - run: python -m unittest research.test_pipeline research.test_intraday_net research.test_flow_net research.test_neighbour_net research.test_funded_replay research.test_relative_gross research.test_tick_volume_net research.test_anchor_signal research.test_session_wick_signal research.test_orchestrated_replay research.test_joint_quote_extension
      - name: Verify original 100 encrypted archive identities with read-only GitHub API token
        run: python -m research.legacy_manifest_remote
        env:
          MXM_GITHUB_METADATA_READ_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: original-archive-public-identity-only
          path: legacy-archive-public-receipt.json
          if-no-files-found: error
          retention-days: 30
      - run: dotnet build src/Mxm.Cloud -c Release
      - name: Verify algo produced
        run: test -n "$(find src/Mxm.Cloud/bin/Release -name '*.algo' -print -quit)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mxm-observation-only-not-authorized-for-activation
          path: src/Mxm.Cloud/bin/Release/**/*.algo
          if-no-files-found: error
  custody_recipient:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.collect == true) ||
        (github.event_name == 'push' &&
          (needs.verify.outputs.authorized_source_request == 'true' || needs.verify.outputs.authorized_economic_request == 'true' || needs.verify.outputs.authorized_intraday_net == 'true' || needs.verify.outputs.authorized_flow_net == 'true' || needs.verify.outputs.authorized_neighbour_net == 'true' || needs.verify.outputs.authorized_volume_net == 'true' || needs.verify.outputs.authorized_m15_anchor_net == 'true' || needs.verify.outputs.authorized_joint_quote_extension == 'true'))
      )
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: mxm-r3-custody-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Derive run-bound new-source recipient from existing installed private
        run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: new-source-recipient-public-only
          path: new-recipient-output/
          if-no-files-found: error
          retention-days: 30
  collect:
    # Secrets are unavailable to PRs, branches, generic pushes and non-owner triggers.
    # A precise source-request file update substitutes for dispatch from Chat normal.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.collect == true) ||
        (github.event_name == 'push' &&
          (needs.verify.outputs.authorized_source_request == 'true' || needs.verify.outputs.authorized_economic_request == 'true' || needs.verify.outputs.authorized_intraday_net == 'true' || needs.verify.outputs.authorized_flow_net == 'true' || needs.verify.outputs.authorized_neighbour_net == 'true' || needs.verify.outputs.authorized_volume_net == 'true' || needs.verify.outputs.authorized_m15_anchor_net == 'true' || needs.verify.outputs.authorized_joint_quote_extension == 'true'))
      )
    needs: [verify, custody_recipient]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-existing-oauth-read-only
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: new-source-recipient-public-only
          path: new-source-recipient
      - name: Existing bounded source H1 collection (non-economic request only)
        if: needs.verify.outputs.authorized_economic_request != 'true' && needs.verify.outputs.authorized_intraday_net != 'true' && needs.verify.outputs.authorized_flow_net != 'true' && needs.verify.outputs.authorized_neighbour_net != 'true' && needs.verify.outputs.authorized_volume_net != 'true' && needs.verify.outputs.authorized_m15_anchor_net != 'true' && needs.verify.outputs.authorized_joint_quote_extension != 'true'
        run: python -m research.collect
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - name: New broad economic source (no historical model replay)
        if: needs.verify.outputs.authorized_economic_request == 'true'
        run: python -m research.economic_source
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - name: Frozen native hourly-shock reversal NET on genuine event BID ASK
        if: needs.verify.outputs.authorized_intraday_net == 'true'
        run: python -m research.intraday_net
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - name: Cost-first native distinct session and cross-currency flow NET
        if: needs.verify.outputs.authorized_flow_net == 'true'
        run: python -m research.flow_net
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - name: H1 conditional-neighbour NET with TRAIN calibration and adaptive portfolio risk
        if: needs.verify.outputs.authorized_neighbour_net == 'true'
        run: python -m research.neighbour_net
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - name: Authentic H1 tick-volume dislocation research with funded EUR200 event replay
        if: needs.verify.outputs.authorized_volume_net == 'true'
        run: python -m research.tick_volume_net
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - name: Authentic new M15 session-anchored tick-weighted quote balance EUR200 NET
        if: needs.verify.outputs.authorized_m15_anchor_net == 'true'
        run: python -m research.anchor_balance_net
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - name: Bounded all-six-asset historical quote and current minimum-margin evidence
        if: needs.verify.outputs.authorized_joint_quote_extension == 'true'
        run: python -m research.joint_quote_extension
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sealed-source
          path: sealed-output/
          if-no-files-found: error
          retention-days: 30
  custody:
    # Domain-bound new-source readback, independent of historical archive recipient.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.collect == true) ||
        (github.event_name == 'push' &&
          (needs.verify.outputs.authorized_source_request == 'true' || needs.verify.outputs.authorized_economic_request == 'true' || needs.verify.outputs.authorized_intraday_net == 'true' || needs.verify.outputs.authorized_flow_net == 'true' || needs.verify.outputs.authorized_neighbour_net == 'true' || needs.verify.outputs.authorized_volume_net == 'true' || needs.verify.outputs.authorized_m15_anchor_net == 'true' || needs.verify.outputs.authorized_joint_quote_extension == 'true'))
      ) &&
      needs.verify.result == 'success' &&
      needs.collect.result == 'success'
    needs: [verify, collect]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: mxm-r3-custody-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sealed-source
          path: sealed-output
      - name: Existing v2 H1 source readback
        if: needs.verify.outputs.authorized_economic_request != 'true' && needs.verify.outputs.authorized_intraday_net != 'true' && needs.verify.outputs.authorized_flow_net != 'true' && needs.verify.outputs.authorized_neighbour_net != 'true' && needs.verify.outputs.authorized_volume_net != 'true' && needs.verify.outputs.authorized_m15_anchor_net != 'true' && needs.verify.outputs.authorized_joint_quote_extension != 'true'
        run: python -m research.readback
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - name: Download original multi-asset ciphertext for clock-only evidence binding
        if: needs.verify.outputs.authorized_joint_quote_extension == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sealed-source
