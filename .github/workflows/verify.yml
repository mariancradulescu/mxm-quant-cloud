      - name: Exact owner/main bounded execution-evidence extension intent
        id: joint_quotes
        shell: bash
        run: |
          echo "authorized_joint_quote_extension=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_JOINT_QUOTE_EVIDENCE_EXTENSION" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/joint-quote-extension-request.txt" ]]; then
