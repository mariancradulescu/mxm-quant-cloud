          echo "authorized_net_coverage=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_AUTHENTIC_NET_COVERAGE" ]] &&
