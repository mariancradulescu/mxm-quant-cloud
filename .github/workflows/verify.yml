          echo "authorized_flow_net=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "MXM_CAUSAL_FLOW_NET_STUDY" ]] &&
             [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/flow-net-request.txt" ]]; then
            echo "authorized_flow_net=true" >> "$GITHUB_OUTPUT"
