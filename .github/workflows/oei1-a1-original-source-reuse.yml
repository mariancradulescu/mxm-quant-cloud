name: OEI1 A1 score-only causal recovery of original encrypted source
on:
  pull_request:
    paths:
      - 'research/OEI1_A1_PRESCORE_CAUSAL_RECOVERY_20261118.md'
      - 'research/oei1_integrated.py'
      - 'research/test_oei1_integrated.py'
      - 'research/oei1_a1_reuse_original.py'
      - '.github/workflows/oei1-a1-original-source-reuse.yml'
  push:
    branches: [main]
    paths:
      - 'ops/oei1-a1-recover-once.txt'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/oei1_integrated.py research/oei1_a1_reuse_original.py
      - run: python -m unittest research.test_oei1_integrated -v
      - name: Original corrective protocol must predate implementation
        run: |
          git fetch --depth=1 origin a80e4e6296841c07c00e56705b30b6631e5f476e
          git show a80e4e6296841c07c00e56705b30b6631e5f476e:research/OEI1_A1_PRESCORE_CAUSAL_RECOVERY_20261118.md > /tmp/oei1-a1-frozen.md
          cmp /tmp/oei1-a1-frozen.md research/OEI1_A1_PRESCORE_CAUSAL_RECOVERY_20261118.md
  protected-original-source-score-only:
    needs: verify
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' &&
      github.run_attempt == '1' &&
      github.event.head_commit.message == 'OWNER_OEI1_A1_REUSE_ORIGINAL_SOURCE_ONCE'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 44247979857
          github-token: ${{ github.token }}
          name: oei1-original-pepperstone-encrypted-custody
          path: oei1-original-source/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 44247979857
          github-token: ${{ github.token }}
          name: oei1-original-integrated-3phase-public
          path: oei1-original-public/
      - name: Verify original cipher and plaintext hash, decrypt ephemerally and score corrected causal offers
        run: python -m research.oei1_a1_reuse_original
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: oei1-a1-causal-corrected-original-financial-public
          path: oei1-a1-public/
          if-no-files-found: error
          retention-days: 90
