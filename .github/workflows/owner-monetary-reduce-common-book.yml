name: OWNER monetary reduction seven-family common-book research
on:
  pull_request:
    paths:
      - 'research/owner_monetary_reduce_common_book.py'
      - '.github/workflows/owner-monetary-reduce-common-book.yml'
      - 'src/Mxm.Core/NativeEconomicMechanisms.cs'
      - 'src/Mxm.Core/NativeUnifiedPortfolioEngine.EurGeneral.cs'
      - 'src/Mxm.Replay/IntegratedEconomicReplay.Pav1MarketTime.cs'
      - 'tests/Mxm.Checks/NativeEconomicMechanismChecks.cs'
  push:
    branches: [main]
    paths: ['research/owner_monetary_reduce_common_book.py']
permissions:
  contents: read
  actions: read
jobs:
  technical:
    runs-on: ubuntu-24.04
    outputs:
      new_study: ${{ steps.scope.outputs.new_study }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = push ] && git diff --diff-filter=A --name-only "$BEFORE" "$GITHUB_SHA" | grep -Fxq research/owner_monetary_reduce_common_book.py; then
            echo "new_study=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_study=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m research.owner_monetary_reduce_common_book check
      - run: dotnet build src/Mxm.Replay -c Release
      - run: dotnet build src/Mxm.Cloud -c Release
      - run: dotnet run --project tests/Mxm.Checks -c Release
      - run: python -m unittest research.test_pav1_market_time
  evaluate:
    needs: technical
    if: github.event_name == 'push' && needs.technical.outputs.new_study == 'true'
    runs-on: ubuntu-24.04
    environment: mxm-r3-custody-v1
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Mxm.Replay -c Release
      - name: Restore exact normalized cache, zero reconstruction
        run: python -m research.owner_monetary_reduce_common_book restore --work "$RUNNER_TEMP/reduce-private"
        env:
          GH_TOKEN: ${{ github.token }}
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - name: Execute new paired research under all three cost scenarios
        run: python -m research.owner_monetary_reduce_common_book evaluate --work "$RUNNER_TEMP/reduce-private"
      - name: Upload economic receipts and progress (no raw source)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: monetary-reduce-common-book-1-economic
          path: reduce-report/
          if-no-files-found: warn
      - name: Conserve new selection and terminal books without recopying source
        if: always()
        run: python -m research.owner_monetary_reduce_common_book conserve
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - name: Upload encrypted new books
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: monetary-reduce-common-book-1-sealed-books
          path: reduce-sealed-books/
          if-no-files-found: warn
