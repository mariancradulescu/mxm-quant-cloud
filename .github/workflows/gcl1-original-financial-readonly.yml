name: GCL1 DOL weekly gold FX original read-only money and source protection
on:
  pull_request:
    paths:
      - 'research/GCL1_CLAIMS_GOLD_EURUSD_ECONOMIC_PROTOCOL_20261116.md'
      - 'research/gcl1_claims_quote_source.py'
      - 'research/gcl1_claims_gold_eurusd_economic_readback.py'
      - 'research/test_gcl1_claims_gold_eurusd.py'
      - '.github/workflows/gcl1-original-financial-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'ops/gcl1-original-once-intent.txt'
      - '.github/workflows/gcl1-original-financial-readonly.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify-frozen-gcl1:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      authorized: ${{ steps.owner.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/gcl1_claims_quote_source.py research/gcl1_claims_gold_eurusd_economic_readback.py
      - run: python -m unittest research.test_gcl1_claims_gold_eurusd -v
      - name: OWNER main-only exact one-time original read-only finance intent
        id: owner
        shell: bash
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_GCL1_AUTHENTIC_FINANCIAL_ORIGINAL_ONCE" &&
                "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/gcl1-original-once-intent.txt" &&
                "$(cat ops/gcl1-original-once-intent.txt)" == "OWNER_GCL1_DOL43_TUES43_READONLY_ORIGINAL_FINANCE" ]]; then
             echo 'authorized=true' >> "$GITHUB_OUTPUT"
          fi
  derive-gcl1-recipient:
    needs: verify-frozen-gcl1
    if: needs.verify-frozen-gcl1.outputs.authorized == 'true'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Issue exact run-bound public recipient without private key export
        run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gcl1-original-public-recipient
          path: new-recipient-output/
          retention-days: 5
          if-no-files-found: error
  gcl1-original-bidask-readonly:
    needs: [verify-frozen-gcl1, derive-gcl1-recipient]
    if: needs.verify-frozen-gcl1.outputs.authorized == 'true'
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-gcl1-original-43week-readonly-finance-once
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gcl1-original-public-recipient
          path: new-recipient-output
      - name: Original EUR account, 86 day x 3 clock BID+ASK, financial contract read-only and SEAL BEFORE any future scoring
        run: python -m research.gcl1_claims_quote_source
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gcl1-original-sealed-bidask-source
          path: gcl1-original-source.v2.enc
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gcl1-original-source-coverage-only
          path: gcl1-original-source-coverage.public.json
          retention-days: 90
          if-no-files-found: error
  gcl1-protected-finance:
    needs: [verify-frozen-gcl1, gcl1-original-bidask-readonly]
    if: needs.verify-frozen-gcl1.outputs.authorized == 'true'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          run-id: 41724643418
          github-token: ${{ github.token }}
          path: bdp1-original-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gcl1-original-sealed-bidask-source
          path: gcl1-original-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gcl1-original-source-coverage-only
          path: gcl1-source-public
      - name: FULL original protobuf authenticated BDP1+GCL1 price and FINANCE original readback; zero closed models
        run: python -m research.gcl1_claims_gold_eurusd_economic_readback
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gcl1-authentic-claims-gold-eurusd-conditional-money
          path: gcl1-authentic-claims-gold-eurusd-conditional-money.public.json
          retention-days: 90
          if-no-files-found: error
