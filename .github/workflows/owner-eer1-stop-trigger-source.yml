name: OWNER EER1 archived NatGas quote protection evidence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-eer1-stop-trigger-source.yml']
permissions:
  actions: read
  contents: read
jobs:
  readback:
    if: github.run_attempt == 1 && github.actor == 'mariancradulescu'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - name: Read the immutable ciphertext and EER1 diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/15000522105/zip > /tmp/eer1-stop-original.zip
          echo '107b2bc43e6ff25a5799e253b0ab6ee718ad5b88ef3bb3211d84ad6c20b87a5b  /tmp/eer1-stop-original.zip' | sha256sum -c -
          unzip -q /tmp/eer1-stop-original.zip receipt.json 251.sealed -d stop-source
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/15004052694/zip > /tmp/eer1-stop-diagnosis.zip
          echo '4d58bbab64a62e7293ba2d2fbae24e8c9981134b968ed9420655c681484fdc44  /tmp/eer1-stop-diagnosis.zip' | sha256sum -c -
          unzip -q /tmp/eer1-stop-diagnosis.zip eer1-diagnosis.json
      - name: Locate the first observed crossing using the shared CSharp Trade stop rule
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: python -m research.owner_eer1_stop_source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eer1-natgas-stop-trigger-source
          path: eer1-stop-trigger-source.json
          if-no-files-found: error
          retention-days: 90
