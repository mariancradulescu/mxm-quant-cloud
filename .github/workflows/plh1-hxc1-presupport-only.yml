name: PLH1 London FX original HXC1 portfolio pre-outcome support only
on:
  pull_request:
    paths:
      - 'research/PLH1_PORTFOLIO_LONDON_FX_HANDOFF_PRESOURCE.md'
      - 'research/plh1_london_fx_source_preflight.py'
      - 'research/test_plh1_london_fx_source_preflight.py'
      - '.github/workflows/plh1-hxc1-presupport-only.yml'
  push:
    branches: [main]
    paths:
      - 'ops/plh1-original-support-intent.txt'
      - '.github/workflows/plh1-hxc1-presupport-only.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify-presupport:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      authorized: ${{ steps.owner.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/plh1_london_fx_source_preflight.py research/test_plh1_london_fx_source_preflight.py
      - run: python -m unittest research.test_plh1_london_fx_source_preflight -v
      - name: One OWNER main-only first-attempt HXC1 source re-readback, no predictor
        id: owner
        shell: bash
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_PLH1_HXC1_ORIGINAL_SUPPORT_ONLY_ONCE" &&
                "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/plh1-original-support-intent.txt" &&
                "$(cat ops/plh1-original-support-intent.txt)" == "OWNER_PLH1_PORTFOLIO_13W_SUPPORT_ONLY_NO_OUTCOMES" ]]; then
            echo 'authorized=true' >> "$GITHUB_OUTPUT"
          fi
  original-hxc1-protected-presupport:
    needs: verify-presupport
    if: needs.verify-presupport.outputs.authorized == 'true'
    environment: mxm-r3-custody-v1
    concurrency:
      group: mxm-plh1-original-hxc1-support-once
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hxc1-original-historical-encrypted-source
          run-id: 43817213663
          github-token: ${{ github.token }}
          path: plh1-source
      - name: Rebuild HXC1 1444 original read-only packets and pre-outcome 13-week support only
        run: python -m research.plh1_london_fx_source_preflight
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plh1-authentic-portfolio-fx-presupport-census
          path: plh1-original-exposed-fx-handoff-support-only.public.json
          retention-days: 90
          if-no-files-found: error
