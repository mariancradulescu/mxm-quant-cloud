name: NAS100 original leaf gaps only - read-only owner gated
on:
  pull_request:
    paths:
      - 'research/funded_nas100_gap_collection.py'
      - 'research/test_funded_nas100_gap_collection.py'
      - '.github/workflows/funded-nas100-gap-only.yml'
  push:
    branches: [main]
    paths:
      - 'ops/funded-history-nas100-gap-only-once.txt'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.guard.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: |
          python -m py_compile research/funded_nas100_gap_collection.py
          python -m unittest research.test_funded_history_gap_plan research.test_funded_nas100_gap_collection -v
      - name: Gate a distinct, first-addition-only OWNER main marker
        id: guard
        shell: bash
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          marker=ops/funded-history-nas100-gap-only-once.txt
          subject=OWNER_FUNDED_HISTORY_NAS100_GAP_ONLY_READ_ONLY_BACKFILL_ONCE_44824462289_44910122403
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "$subject" &&
                "$(git diff-tree --no-commit-id --name-status -r HEAD)" == $'A\t'"$marker" &&
                -z "$(git log -1 --format=%H HEAD^ -- "$marker")" &&
                -f "$marker" ]] &&
             cmp -s "$marker" <(printf '%s\n' "$subject"); then
            echo 'authorized=true' >> "$GITHUB_OUTPUT"
          fi
  recipient:
    needs: verify
    if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' && needs.verify.outputs.authorized == 'true' }}
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: funded-nas100-gap-public-recipient
          path: new-recipient-output/
          retention-days: 3
          if-no-files-found: error
  collect-gap-only:
    needs: [verify, recipient]
    if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' && needs.verify.outputs.authorized == 'true' }}
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-existing-oauth-read-only
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: funded-nas100-gap-public-recipient
          path: new-source-recipient
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: funded-action-history-source-public
          path: integrated-source-public
          run-id: 44824462289
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: funded-action-history-recovery-public
          path: funded-history-recovery
          run-id: 44910122403
          github-token: ${{ github.token }}
      - name: Capture ONLY approved missing NAS100 leaves
        run: python -m research.funded_nas100_gap_collection --collect
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: funded-nas100-gap-new-ciphertext
          path: funded-nas100-gap-sealed/
          compression-level: 0
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: funded-nas100-gap-capture-public
          path: funded-nas100-gap-public/
          retention-days: 90
          if-no-files-found: warn
  readback:
    needs: [verify, collect-gap-only]
    if: ${{ always() && needs.verify.outputs.authorized == 'true' && github.run_attempt == '1' && github.ref == 'refs/heads/main' }}
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: funded-nas100-gap-new-ciphertext
          path: funded-nas100-gap-sealed
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: funded-nas100-gap-capture-public
          path: funded-nas100-gap-public
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: funded-action-history-custody
          path: integrated-sealed-source
          run-id: 44824462289
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: funded-action-history-source-public
          path: integrated-source-public
          run-id: 44824462289
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: funded-action-history-recovery-public
          path: funded-history-recovery
          run-id: 44910122403
          github-token: ${{ github.token }}
      - name: Reconcile new sealed leaves against frozen original account/symbol
        run: python -m research.funded_nas100_gap_collection --readback
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: funded-nas100-gap-verified-public
          path: funded-nas100-gap-public/
          retention-days: 90
          if-no-files-found: warn
