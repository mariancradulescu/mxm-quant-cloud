name: General-state C# funded economic development (new study)
on:
  pull_request:
    paths:
      - 'src/Mxm.Core/NativeGeneralOpportunity.cs'
      - 'src/Mxm.Core/NativeFundedActionValue.cs'
      - 'src/Mxm.Core/NativeFundedActionResearch.cs'
      - 'src/Mxm.Core/NativeUnifiedPortfolioEngine.Integrated.cs'
      - 'src/Mxm.Replay/**'
      - 'tests/Mxm.Checks/NativeFundedActionChecks.cs'
      - 'research/funded_history_economic_development.py'
      - 'research/test_funded_general_state_economic_development.py'
      - 'research/GENERAL_STATE_FUNDED_ECONOMIC_PROTOCOL.md'
      - '.github/workflows/funded-general-state-economic.yml'
  push:
    branches: [main]
    paths:
      - 'ops/funded-general-state-13w-csharp-once.txt'
permissions:
  contents: read
  actions: read
jobs:
  verify-native:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.owner.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Native C# tests and both common-Core consumers
        run: |
          dotnet build src/Mxm.Replay -c Release
          dotnet build src/Mxm.Cloud -c Release
          dotnet run --project tests/Mxm.Checks -c Release
      - name: Source custody and public aggregate regression
        run: |
          python -m pip install -r research/requirements.txt
          python -m unittest research.test_funded_history_economic_development research.test_funded_general_state_economic_development -v
          python -m py_compile research/funded_history_economic_development.py
      - name: Separate OWNER one-time guarded admission
        id: owner
        shell: bash
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          marker=ops/funded-general-state-13w-csharp-once.txt
          subject=OWNER_GENERAL_STATE_ECONOMIC_13W_CONDITIONAL_ONCE_44824462289_44910122403
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "$subject" &&
                "$(git diff-tree --no-commit-id --name-status -r HEAD)" == $'A\t'"$marker" &&
                -z "$(git log -1 --format=%H HEAD^ -- "$marker")" &&
                -f "$marker" ]] &&
             cmp -s "$marker" <(printf '%s\n' "$subject"); then
            echo 'authorized=true' >> "$GITHUB_OUTPUT"
          fi
  authenticated-general-economics:
    needs: verify-native
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && needs.verify-native.outputs.authorized == 'true' }}
    environment: mxm-r3-custody-v1
    concurrency:
      group: mxm-general-state-protected-once-20261122
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - name: Original authenticated ciphertext, no recollection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: funded-action-history-custody
          path: integrated-sealed-source
          run-id: 44824462289
          github-token: ${{ github.token }}
      - name: Original source receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: funded-action-history-source-public
          path: integrated-source-public
          run-id: 44824462289
          github-token: ${{ github.token }}
      - name: Immutable recovery verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: funded-action-history-recovery-public
          path: funded-history-recovery
          run-id: 44910122403
          github-token: ${{ github.token }}
      - name: Separate new native general-state economic study
        run: python -m research.funded_history_economic_development
        env:
          MXM_GENERAL_STATE_RESEARCH: '1'
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - name: Whitelisted public aggregates only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: funded-general-state-13w-csharp-public
          path: funded-general-state-economic-public/
          retention-days: 90
          if-no-files-found: error
