name: RDE1 presource causal risk study verification
on:
  pull_request:
    paths:
      - 'research/rde1_protocol.json'
      - 'research/rde1_risk_distribution.py'
      - 'research/test_rde1_risk_distribution.py'
      - '.github/workflows/rde1-risk-distribution.yml'
  push:
    branches: [main]
    paths:
      - 'research/rde1_protocol.json'
      - 'research/rde1_risk_distribution.py'
      - 'research/test_rde1_risk_distribution.py'
      - '.github/workflows/rde1-risk-distribution.yml'
permissions:
  contents: read
jobs:
  verify-risk-chronology:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile RDE1 without accessing original source
        run: python -m py_compile research/rde1_risk_distribution.py research/test_rde1_risk_distribution.py
      - name: Verify future blindness, chronology, no-trade and forecast leakage
        run: python -m unittest research.test_rde1_risk_distribution -v
