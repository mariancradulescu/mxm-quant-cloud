name: Original Pepperstone Open API native product economic replay
on:
  push:
    branches:
      - mxm-original-openapi-native-replay-20261109
    paths:
      - ".github/workflows/original-openapi-native-product.yml"
      - "research/native_original_openapi_product_replay.py"
      - "src/Mxm.Core/NativeOriginalOpenApiProductAdapter.cs"
      - "src/Mxm.Replay/Program.cs"
permissions:
  contents: read
jobs:
  original-view-only-native-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: mxm-r3-pepperstone-v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Reuse project protobuf source dependencies and compile existing C# replay
        run: |
          python -m pip install -r research/requirements.txt
          dotnet build src/Mxm.Replay -c Release
      - name: Collect original Pepperstone SCOPE_VIEW M5+tick BID/ASK and execute native EUR300 model
        run: python -m research.native_original_openapi_product_replay
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - name: Upload economic aggregate only (never OAuth, account identifiers, raw ticks)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: original-openapi-native-product-economic-receipt
          path: native-original-openapi-public-receipt.json
          if-no-files-found: warn
          retention-days: 21
