name: OWNER official history and monetary source windows
on:
  push:
    branches: [main]
    paths: ['research/official_history_monetary_windows_1.json']
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: github.run_attempt == 1 && github.actor == 'mariancradulescu'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-public-receipt
          run-id: 45396314675
          github-token: ${{ github.token }}
          path: input/original-source-history
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: eer1-recovered-economic-ledgers-and-evidence
          run-id: 45568679560
          github-token: ${{ github.token }}
          path: eer1-public
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: eur-official-universe-tranche-verified
          run-id: 45573479281
          github-token: ${{ github.token }}
          path: input/verified-tranche
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: history-continuation-verified
          run-id: 45584495052
          github-token: ${{ github.token }}
          path: input/verified-continuation
      - run: |
          echo '15544ae5a45b0fd07e2ffddb49ca3b71b150340e5b9b45b9d3c41c29e8fa2ffb  research/official_history_monetary_windows_1.json' | sha256sum -c -
          mkdir -p input/eer1-economic
          cp eer1-public/source-census.json input/eer1-economic/
          cp -R input/{original-source-history,eer1-economic,verified-tranche,verified-continuation} .
          python -m research.owner_history_continuation plan --registered-continuation research/official_history_monetary_windows_1.json
      - run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - run: mv new-recipient-output input/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-monetary-windows-input
          path: input/
          retention-days: 2
          if-no-files-found: error
  collect:
    needs: prepare
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-existing-oauth-read-only
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: history-monetary-windows-input
      - run: python -m research.owner_history_continuation capture --registered-continuation research/official_history_monetary_windows_1.json
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-monetary-windows-protected
          path: owner-history-continuation/
          retention-days: 90
          if-no-files-found: error
  verify:
    needs: collect
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: history-monetary-windows-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: history-monetary-windows-protected
          path: owner-history-continuation
      - run: python -m research.owner_history_continuation verify --registered-continuation research/official_history_monetary_windows_1.json
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-monetary-windows-verified
          path: history-monetary-windows-verified.json
          retention-days: 90
          if-no-files-found: error
