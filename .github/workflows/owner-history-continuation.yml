name: OWNER historical availability, universe continuation and CLI optimizer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-history-continuation.yml']
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: github.run_attempt == 1 && github.actor == 'mariancradulescu'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-public-receipt
          run-id: 45396314675
          github-token: ${{ github.token }}
          path: input/original-source-history
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: eer1-recovered-economic-ledgers-and-evidence
          run-id: 45568679560
          github-token: ${{ github.token }}
          path: eer1-public
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: eur-official-universe-tranche-verified
          run-id: 45573479281
          github-token: ${{ github.token }}
          path: input/verified-tranche
      - run: |
          mkdir -p input/eer1-economic
          cp eer1-public/source-census.json input/eer1-economic/
          cp -R input/{original-source-history,eer1-economic,verified-tranche} .
          python -m research.owner_history_continuation plan
      - run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - run: mv new-recipient-output input/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-continuation-input
          path: input/
          retention-days: 2
          if-no-files-found: error
  collect:
    needs: prepare
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-existing-oauth-read-only
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: history-continuation-input
      - run: python -m research.owner_history_continuation capture
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-continuation-protected
          path: owner-history-continuation/
          retention-days: 90
          if-no-files-found: error
  verify:
    needs: collect
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: history-continuation-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: history-continuation-protected
          path: owner-history-continuation
      - run: python -m research.owner_history_continuation verify
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-continuation-verified
          path: history-continuation-verified.json
          retention-days: 90
          if-no-files-found: error

  optimizer-command:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Inspect optimizer commands in the existing official CLI images
        shell: bash
        run: |
          mkdir -p optimizer-capability
          for version in 5101 5106; do
            if [[ "$version" == 5101 ]]; then
              image=ghcr.io/spotware/ctrader-console:5.10.1
            else
              image=ghcr.io/spotware/ctrader-console@sha256:6a339e15ee895de270be4a4e293fdb3f2fcdbecfbbace460105703125742e5ad
            fi
            docker pull "$image"
            docker image inspect --format '{{index .RepoDigests 0}}' "$image" > "optimizer-capability/$version-digest.txt"
            docker run --rm --network none "$image" --version > "optimizer-capability/$version-version.txt"
            set +e
            timeout 45s docker run --rm --network none "$image" --help > "optimizer-capability/$version-help.txt" 2>&1
            help_exit=$?
            timeout 45s docker run --rm --network none "$image" optimize --help > "optimizer-capability/$version-optimize.txt" 2>&1
            optimize_exit=$?
            set -e
            printf 'help %s\noptimize_help %s\n' "$help_exit" "$optimize_exit" > "optimizer-capability/$version-status.txt"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-optimizer-command-receipt
          path: optimizer-capability/
          retention-days: 90
          if-no-files-found: error
