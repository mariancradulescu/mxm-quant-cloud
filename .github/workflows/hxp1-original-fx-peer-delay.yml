name: HXP1 original FX peer-delay historical predictive research (not RDE1)
on:
  pull_request:
    paths:
      - 'research/hxp1_fx_peer_delay.py'
      - 'research/hxp1_fx_peer_delay_protocol.json'
      - 'research/test_hxp1_fx_peer_delay.py'
      - '.github/workflows/hxp1-original-fx-peer-delay.yml'
  push:
    branches: [main]
    paths:
      - 'ops/hxp1-study-intent.txt'
      - '.github/workflows/hxp1-original-fx-peer-delay.yml'
permissions:
  contents: read
  actions: read

jobs:
  verify-causal-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      authorized: ${{ steps.owner.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/hxp1_fx_peer_delay.py
      - run: python -m unittest research.test_hxp1_fx_peer_delay -v
      - name: Exact OWNER original source study only; never PR, RDE1 or generic dispatch
        id: owner
        shell: bash
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_HXP1_HISTORICAL_PREDICTIVE_ONCE" &&
                "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/hxp1-study-intent.txt" &&
                "$(cat ops/hxp1-study-intent.txt)" == "OWNER_HXP1_FROZEN_FX_PEER_SHOCK_SOURCE_HXC1_ONLY" ]]; then
             echo 'authorized=true' >> "$GITHUB_OUTPUT"
          fi

  original-custody-predictive-evaluation:
    needs: verify-causal-study
    if: needs.verify-causal-study.outputs.authorized == 'true'
    environment: mxm-r3-custody-v1
    concurrency:
      group: mxm-hxp1-fx-original-52w-once
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hxc1-original-historical-encrypted-source
          run-id: 43817213663
          github-token: ${{ github.token }}
          path: hxc1-source
      - name: Original H1 causal train-selection-exposed FX peer delay EUR commission-floor research; no broker traffic
        run: python -m research.hxp1_fx_peer_delay
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hxp1-original-fx-causal-predictive-eur-commission-floor
          path: hxp1-original-predictive-public.json
          retention-days: 90
          if-no-files-found: error
