name: OWNER recent expanded funded C Sharp research
on:
  pull_request:
    paths:
      - 'research/eur_recent_funded_1.json'
      - 'research/owner_eur_recent_funded.py'
      - 'research/test_owner_eur_recent_funded.py'
      - '.github/workflows/owner-eur-recent-funded.yml'
  push:
    branches: [main]
    paths:
      - 'research/eur_recent_funded_1_execution.json'
  workflow_run:
    workflows: ['OWNER recent continuous official history and universe expansion']
    branches: [main]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  technical:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'mariancradulescu') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.id == 45716198383 && github.event.workflow_run.head_sha == 'bd7d403a2da0469472b2984252be91db7bedc2bd')
    runs-on: ubuntu-24.04
    outputs:
      source_summary_sha256: ${{ steps.binding.outputs.source_summary_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind the completed collection and its verified summary
        id: binding
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from hashlib import sha256
          from io import BytesIO
          import json
          import os
          from pathlib import Path
          import subprocess
          from zipfile import ZipFile

          def api(endpoint):
              return subprocess.check_output(["gh", "api", "repos/" + os.environ["GITHUB_REPOSITORY"] + endpoint])

          protocol = Path("research/eur_recent_funded_1.json").read_bytes()
          study = json.loads(protocol)
          run_id = study["SourceRun"]
          revision = study["SourceRevision"]
          artifact_id = 15075408433
          archive_sha256 = "6af35361b6f66cc3b90653d056b5ce0456317cf317335add204fa5740816804c"
          assert run_id == 45716198383 and revision == "bd7d403a2da0469472b2984252be91db7bedc2bd"
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              marker_path = "research/eur_recent_funded_1_execution.json"
              marker = json.loads(Path(marker_path).read_bytes())
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_bytes())
              assert len(event["commits"]) == 1 and marker_path in event["commits"][0]["added"]
              expected = dict(Study=study["Study"], SourceRun=run_id, SourceRevision=revision,
                              SourceArtifact=artifact_id, SourceArchiveSha256=archive_sha256,
                              ProtocolSha256=sha256(protocol).hexdigest(), ValidatedRevision=event["before"])
              assert marker == expected, "RECENT_FUNDED_EXECUTION_BINDING"

          run = json.loads(api(f"/actions/runs/{run_id}"))
          assert run["id"] == run_id and run["head_sha"] == revision and run["head_branch"] == "main"
          assert run["status"] == "completed" and run["conclusion"] == "success" and run["event"] == "push"
          assert run["path"] == ".github/workflows/owner-eur-recent-continuous.yml"
          assert run["head_repository"]["full_name"] == os.environ["GITHUB_REPOSITORY"]
          endpoint = f"/actions/artifacts/{artifact_id}"
          metadata = json.loads(api(endpoint))
          assert metadata["id"] == artifact_id and metadata["name"] == "recent-source-verified-summary"
          assert metadata["workflow_run"]["id"] == run_id and metadata["workflow_run"]["head_sha"] == revision
          assert not metadata["expired"] and metadata["digest"] == "sha256:" + archive_sha256
          archive = api(endpoint + "/zip")
          assert sha256(archive).hexdigest() == archive_sha256
          with ZipFile(BytesIO(archive)) as zip_file:
              summary_bytes = zip_file.read("recent-source-summary.json")
          summary = json.loads(summary_bytes)
          expected_source = sha256(Path("research/eur_recent_continuous_source_1.json").read_bytes()).hexdigest()
          assert summary["protocolSha256"] == expected_source and not summary["pending"]
          assert summary["planned"] == summary["verified"] == len(summary["receipts"]) == 37
          assert summary["orders"] == 0 and summary["cloudActivated"] is False
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"source_summary_sha256={sha256(summary_bytes).hexdigest()}\n")
          print(f"VERIFIED_RECENT_SOURCE {run_id} {artifact_id} {summary['verified']}")
          PY
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Mxm.Replay -c Release
      - run: python -m unittest research.test_owner_eur_recent_funded research.test_owner_eur_recent_continuous research.test_owner_eur_checkpoint research.test_merge_eur_adaptive
      - run: dotnet run --project tests/Mxm.Checks -c Release
  evidence:
    needs: technical
    if: needs.technical.outputs.source_summary_sha256 != ''
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        scenario: [0, 1, 2]
        group: [CONTROL, RANKED]
    env:
      MXM_ECONOMIC_SCENARIO_INDEX: ${{ matrix.scenario }}
      MXM_ECONOMIC_TRIAL_GROUP: ${{ matrix.group }}
      MXM_ECONOMIC_RECEIPT_DIRECTORY: window-receipts
      MXM_ECONOMIC_BOUNDED_NEIGHBORS: 1
      MXM_ECONOMIC_PAIRED_DISTRIBUTION: 1
      MXM_ECONOMIC_REUSE_FRAMES: 1
      CHECKPOINT_PREFIX: eur-recent-funded-checkpoint-${{ matrix.scenario }}-${{ matrix.group }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Mxm.Replay -c Release
      - name: Pin exact original artifact identity and archive digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/15000522105 > /tmp/eer1-artifact.json
          python -c 'import json; a=json.load(open("/tmp/eer1-artifact.json")); assert a["id"]==15000522105 and a["workflow_run"]["id"]==45555613548 and a["size_in_bytes"]==233873730 and a["digest"]=="sha256:107b2bc43e6ff25a5799e253b0ab6ee718ad5b88ef3bb3211d84ad6c20b87a5b" and not a["expired"]'
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/15000522105/zip > /tmp/eer1-original.zip
          echo '107b2bc43e6ff25a5799e253b0ab6ee718ad5b88ef3bb3211d84ad6c20b87a5b  /tmp/eer1-original.zip' | sha256sum -c -
          unzip -q /tmp/eer1-original.zip -d eer1-source
          rm /tmp/eer1-original.zip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-eur-conditional-source-verified
          path: pilot-source
          run-id: 45552716026
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-public-receipt
          path: original-source-history
          run-id: 45396314675
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-original-sealed
          path: original-source-history
          run-id: 45396314675
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-history-extension-sealed-and-receipt
          path: previous-extension
          run-id: 45409527714
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          path: bdp-source
          run-id: 41724643418
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          path: aip-source
          run-id: 41735441128
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hxc1-original-historical-encrypted-source
          path: mde1-hxc1-source
          run-id: 43817213663
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: xmh2-complete-274day-m15-encrypted-source
          path: mde1-xmh2-source
          run-id: 44352570167
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p05-new-live-readonly-authentic-source-sealed
          path: p05-sealed
          run-id: 45134137836
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p05-new-live-readonly-aggregate-public
          path: p05-public
          run-id: 45134137836
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-eur-gap-official-original
          path: prior-gap
          run-id: 45541671931
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-eur-rollover-official-original
          path: prior-rollover
          run-id: 45549613144
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: integrated-full-session-custody
          path: integrated-sealed-source
          run-id: 44687919474
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: integrated-full-session-source-public
          path: integrated-source-public
          run-id: 44687919474
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: closed-market-original-ciphertext
          path: closed-market-source
          run-id: 44733062339
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: closed-market-original-source-public
          path: closed-market-source
          run-id: 44733062339
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hxc1-original-historical-encrypted-source
          path: hxc1-original
          run-id: 43817213663
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recent-source-input
          run-id: 45716198383
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recent-source-metadata
          path: recent-metadata
          run-id: 45716198383
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recent-source-plan
          run-id: 45716198383
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recent-source-verified-summary
          run-id: 45716198383
          github-token: ${{ github.token }}
      - name: Verify the bound collection summary
        env:
          RECENT_SOURCE_SUMMARY_SHA256: ${{ needs.technical.outputs.source_summary_sha256 }}
        run: echo "$RECENT_SOURCE_SUMMARY_SHA256  recent-source-summary.json" | sha256sum -c -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: recent-source-protected-*
          path: recent-protected
          run-id: 45716198383
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: recent-source-verified-*
          path: recent-verified
          run-id: 45716198383
          github-token: ${{ github.token }}
      - name: Reconstruct original authenticated common book
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: python -m research.owner_eer1_readback --prepare-protection-recovery "$RUNNER_TEMP/eur-private"
      - name: Reconcile and materialize the recent expanded common book
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: python -m research.owner_eur_recent_funded "$RUNNER_TEMP/eur-private" recent-funded-source.json
      - name: Recover published encrypted chronological checkpoints on retry
        id: resume
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p window-receipts
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name' > "$RUNNER_TEMP/checkpoints.txt"
          for phase in 1 2 3 4; do
            name="$CHECKPOINT_PREFIX-$phase"
            if grep -Fxq "$name" "$RUNNER_TEMP/checkpoints.txt"; then
              gh run download "$GITHUB_RUN_ID" --name "$name" --dir "checkpoints/$phase"
              find "checkpoints/$phase" -name '*.json' -type f -exec cp {} window-receipts/ \;
              echo "phase$phase=true" >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Replay phase 1 and seal checkpoint
        if: steps.resume.outputs.phase1 != 'true'
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: python -m research.owner_eur_checkpoint "$RUNNER_TEMP/eur-private" recent-funded-result.json --protocol "$RUNNER_TEMP/eur-private/protocol.json" --phase 1 --checkpoint checkpoints/1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.resume.outputs.phase1 != 'true'
        with:
          name: ${{ env.CHECKPOINT_PREFIX }}-1
          path: checkpoints/1
          if-no-files-found: error
          retention-days: 90
      - name: Replay phase 2 and seal checkpoint
        if: steps.resume.outputs.phase2 != 'true'
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: python -m research.owner_eur_checkpoint "$RUNNER_TEMP/eur-private" recent-funded-result.json --protocol "$RUNNER_TEMP/eur-private/protocol.json" --previous checkpoints/1/checkpoint.sealed --phase 2 --checkpoint checkpoints/2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.resume.outputs.phase2 != 'true'
        with:
          name: ${{ env.CHECKPOINT_PREFIX }}-2
          path: checkpoints/2
          if-no-files-found: error
          retention-days: 90
      - name: Replay phase 3 and seal checkpoint
        if: steps.resume.outputs.phase3 != 'true'
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: python -m research.owner_eur_checkpoint "$RUNNER_TEMP/eur-private" recent-funded-result.json --protocol "$RUNNER_TEMP/eur-private/protocol.json" --previous checkpoints/2/checkpoint.sealed --phase 3 --checkpoint checkpoints/3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.resume.outputs.phase3 != 'true'
        with:
          name: ${{ env.CHECKPOINT_PREFIX }}-3
          path: checkpoints/3
          if-no-files-found: error
          retention-days: 90
      - name: Replay phase 4 and seal checkpoint
        if: steps.resume.outputs.phase4 != 'true'
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: python -m research.owner_eur_checkpoint "$RUNNER_TEMP/eur-private" recent-funded-result.json --protocol "$RUNNER_TEMP/eur-private/protocol.json" --previous checkpoints/3/checkpoint.sealed --phase 4 --checkpoint checkpoints/4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.resume.outputs.phase4 != 'true'
        with:
          name: ${{ env.CHECKPOINT_PREFIX }}-4
          path: checkpoints/4
          if-no-files-found: error
          retention-days: 90
      - name: Complete adjacent recent test window without resetting capital
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: python -m research.owner_eur_checkpoint "$RUNNER_TEMP/eur-private" recent-funded-result.json --protocol "$RUNNER_TEMP/eur-private/protocol.json" --previous checkpoints/4/checkpoint.sealed
      - name: Bind materialized protocol and source
        run: |
          cp "$RUNNER_TEMP/eur-private/protocol.json" materialized-protocol.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("recent-funded-result.json").read_bytes())["Summary"]
          source=json.loads(Path("recent-funded-source.json").read_bytes())
          assert s["SourceSha256"]==source["SourceSha256"] and s["ProtocolSha256"]==source["ProtocolSha256"]
          assert s["EvidenceManifestSha256"]==source["EvidenceManifestSha256"] and s["Orders"]==s["SourceBrokerRequests"]==0
          assert s["CloudActivated"] is s["IndependentConfirmationCertified"] is False
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eur-recent-funded-result-${{ matrix.scenario }}-${{ matrix.group }}
          path: |
            recent-funded-result.json
            recent-funded-source.json
            materialized-protocol.json
            window-receipts/*.json
          if-no-files-found: error
          retention-days: 90
  combine:
    needs: evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: eur-recent-funded-result-*
          path: partitions
      - name: Reconcile all common-book trials
        run: |
          python - <<'PY'
          from pathlib import Path
          from research.merge_eur_adaptive import collect
          from research.merge_eur_scenarios import exact_json
          root=Path("partitions")
          paths=sorted(root.glob("*/recent-funded-result.json"))
          first=paths[0].parent
          for path in paths:
              for name in ("materialized-protocol.json","recent-funded-source.json"):
                  assert (path.parent/name).read_bytes()==(first/name).read_bytes()
          result=collect(first/"materialized-protocol.json",paths)
          out=Path("recent-report");out.mkdir()
          (out/"economic.json").write_text(exact_json(result)+"\n")
          for name in ("materialized-protocol.json","recent-funded-source.json"):
              (out/name).write_bytes((first/name).read_bytes())
          for scenario in result["Summary"]["Results"]:
              for trial in scenario["Trials"]:
                  r=trial["Result"]
                  print(scenario["SpreadMultiplier"],trial["Id"],r["Closed"],r["ClosedGrossEur"],r["ClosedNetEur"],r["Hard21AllFullRegisteredWeeks"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eur-recent-funded-complete
          path: recent-report/
          if-no-files-found: error
          retention-days: 90
