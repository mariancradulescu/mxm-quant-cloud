name: EWL1 original historic endpoint mature-label learning (not RDE1)
on:
  pull_request:
    paths:
      - 'research/ewl1_endpoint_protocol.json'
      - 'research/ewl1_endpoint_learning.py'
      - 'research/test_ewl1_endpoint_learning.py'
      - 'docs/EWL1_CAUSAL_DIAGNOSIS_20261116.md'
      - '.github/workflows/ewl1-authentic-endpoint-learning.yml'
  push:
    branches: [main]
    paths:
      - 'ops/ewl1-study-intent.txt'
      - '.github/workflows/ewl1-authentic-endpoint-learning.yml'
permissions:
  contents: read
  actions: read

jobs:
  verify-endpoint-causality:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      authorized: ${{ steps.owner.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/ewl1_endpoint_learning.py
      - run: python -m unittest research.test_ewl1_endpoint_learning -v
      - name: One exact OWNER/main causal endpoint historical evaluation, no RDE1
        id: owner
        shell: bash
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_EWL1_AUTHENTIC_ENDPOINT_DISTRIBUTION_ONCE" &&
                "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/ewl1-study-intent.txt" &&
                "$(cat ops/ewl1-study-intent.txt)" == "OWNER_EWL1_FROZEN_CAUSAL_WALKFORWARD_HXC1_ONLY" ]]; then
             echo 'authorized=true' >> "$GITHUB_OUTPUT"
          fi

  original-historical-prequential-model:
    needs: verify-endpoint-causality
    if: needs.verify-endpoint-causality.outputs.authorized == 'true'
    environment: mxm-r3-custody-v1
    concurrency:
      group: mxm-ewl1-original-endpoint-52week-once
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hxc1-original-historical-encrypted-source
          run-id: 43817213663
          github-token: ${{ github.token }}
          path: ewl1-source
      - name: Reconcile original HXC1 protobuf, then learn and score matured endpoint analog outcomes chronologically only
        run: python -m research.ewl1_endpoint_learning
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ewl1-original-historical-endpoint-predictive-eur-proxy
          path: ewl1-original-endpoint-learning-public.json
          retention-days: 90
          if-no-files-found: error
