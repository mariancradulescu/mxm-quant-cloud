name: Post415 native impulse-exhaustion financed W44-W45 development
on:
  pull_request:
    paths:
      - 'src/Mxm.Core/NativeImpulseExhaustionResearch.cs'
      - 'src/Mxm.Core/NativeStructuralOpportunity.cs'
      - 'src/Mxm.Core/NativeStructuralResearch.cs'
      - 'src/Mxm.Core/NativeUnifiedPortfolioEngine.Integrated.cs'
      - 'src/Mxm.Replay/IntegratedEconomicReplay.ClosedMarketContext.cs'
      - 'research/post415_exhaustion_development.py'
      - '.github/workflows/post415-exhaustion-development.yml'
  push:
    branches: [main]
    paths:
      - 'ops/post415-exhaustion-development-once.txt'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.intent.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: |
            8.0.x
            6.0.x
      - run: dotnet run --project tests/Mxm.Checks -c Release
      - run: dotnet build src/Mxm.Replay -c Release
      - run: dotnet build src/Mxm.Cloud -c Release
      - run: python3 -m py_compile research/post415_exhaustion_development.py
      - name: Original source custody exact main single-addition gate
        id: intent
        shell: bash
        run: |
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          marker=ops/post415-exhaustion-development-once.txt
          subject=OWNER_POST415_EXHAUSTION_W44_W45_DEVELOPMENT_ONCE
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" && "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "$subject" &&
                "$(git diff-tree --no-commit-id --name-status -r HEAD)" == $'A\t'"$marker" &&
                -z "$(git log -1 --format=%H HEAD^ -- "$marker")" &&
                "$(cat "$marker")" == "$subject" ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          fi
  economic:
    needs: verify
    if: needs.verify.outputs.authorized == 'true'
    environment: mxm-r3-custody-v1
    concurrency:
      group: mxm-post415-w44w45-native-development-original
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: closed-market-original-ciphertext
          path: closed-market-source
          run-id: 44733062339
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: closed-market-original-source-public
          path: closed-market-source
          run-id: 44733062339
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hxc1-original-historical-encrypted-source
          path: hxc1-original
          run-id: 43817213663
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: integrated-full-session-custody
          path: integrated-sealed-source
          run-id: 44687919474
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: integrated-full-session-source-public
          path: integrated-source-public
          run-id: 44687919474
          github-token: ${{ github.token }}
      - run: python -m research.post415_exhaustion_development
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: post415-exhaustion-w44w45-development-original-public
          path: post415-exhaustion-development-public/
          if-no-files-found: warn
          retention-days: 90
