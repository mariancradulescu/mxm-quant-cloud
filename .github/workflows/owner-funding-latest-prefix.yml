name: OWNER latest-prefix closed financing settlement
on:
  pull_request:
    paths: ['research/funding_latest_prefix_settlement_1.json', 'research/owner_funding_prefix_settlement.py', 'research/test_funding_latest_prefix.py', 'research/NativeFundingSettlement/**', '.github/workflows/owner-funding-latest-prefix.yml']
  push:
    branches: [main]
    paths: ['research/funding_latest_prefix_settlement_1.json']
permissions:
  contents: read
  actions: read
jobs:
  technical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build research/NativeFundingSettlement -c Release
      - run: python -m unittest research.test_funding_latest_prefix
  prepare:
    needs: technical
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'mariancradulescu' && github.run_attempt == 1
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: latest-prefix-recipient
          path: new-recipient-output/
          retention-days: 90
          if-no-files-found: error
  capture:
    needs: prepare
    environment: mxm-r3-pepperstone-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: mxm-existing-oauth-read-only
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: latest-prefix-recipient
          path: new-recipient-output
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-public-receipt
          path: original-source-history
          run-id: 45396314675
          github-token: ${{ github.token }}
      - run: python -m research.owner_funding_prefix_settlement capture
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: latest-prefix-protected
          path: latest-prefix-protected/
          retention-days: 90
          if-no-files-found: error
  verify_settle:
    needs: capture
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build research/NativeFundingSettlement -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: latest-prefix-protected
          path: latest-prefix-protected
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-public-receipt
          path: original-source-history
          run-id: 45396314675
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: funded-action-history-source-public
          path: integrated-source-public
          run-id: 44824462289
          github-token: ${{ github.token }}
      - name: Verify latest-prefix witnesses and immutable closed monetary facts
        run: python -m research.owner_funding_prefix_settlement verify
        env:
          GH_TOKEN: ${{ github.token }}
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - name: Settle the closed financing window using existing native Spotware cost methodology
        run: dotnet research/NativeFundingSettlement/bin/Release/net8.0/NativeFundingSettlement.dll prefix-native-input.json latest-prefix-settlement.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: latest-prefix-settlement-complete
          path: |
            prefix-native-input.json
            prefix-funding-overlay.json
            latest-prefix-settlement.json
          retention-days: 90
          if-no-files-found: error
