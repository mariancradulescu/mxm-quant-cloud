name: RVC1 ONE native joint FX residual EUR300 original costed economics
on:
  pull_request:
    paths:
      - 'research/RVC1_FROZEN_JOINT_FX_RESIDUAL_ECONOMICS_20261123.md'
      - 'src/Mxm.Core/NativeRvc1JointResidualEconomic.cs'
      - 'src/Mxm.Replay/Program.cs'
      - 'tests/Mxm.Checks/NativeRvc1JointResidualChecks.cs'
      - 'tests/Mxm.Checks/Program.cs'
      - 'research/rvc1_one_original_execution.py'
      - '.github/workflows/rvc1-one-integrated-economics.yml'
  push:
    branches: [main]
    paths:
      - 'ops/rvc1-one-native-joint-residual-once.txt'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      authorized: ${{ steps.owner.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Same native Core and Replay compile, no external secrets
        run: dotnet build src/Mxm.Replay -c Release
      - name: Full C# funded two-leg REQUEST -> Pending -> OPEN_FILL -> Held -> CLOSE_FILL checks
        run: dotnet run --project tests/Mxm.Checks -c Release
      - name: Source-only Python custodian compiles without network
        run: python -m py_compile research/rvc1_one_original_execution.py
      - name: Native frozen hypothesis immutable since BEFORE implementation
        shell: bash
        run: |
          git fetch --depth=1 origin d43b49c46163b9f634f7c42d3c790e516df41762
          git show d43b49c46163b9f634f7c42d3c790e516df41762:research/RVC1_FROZEN_JOINT_FX_RESIDUAL_ECONOMICS_20261123.md > /tmp/RVC1_FROZEN
          cmp -s /tmp/RVC1_FROZEN research/RVC1_FROZEN_JOINT_FX_RESIDUAL_ECONOMICS_20261123.md
      - name: Hard gate first-addition-only owner/main original authorisation
        id: owner
        shell: bash
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          subject=OWNER_RVC1_ONE_NATIVE_FX_RESIDUAL_EUR300_ONCE_20261123
          marker=ops/rvc1-one-native-joint-residual-once.txt
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "$subject" &&
                "$(git diff-tree --no-commit-id --name-status -r HEAD)" == $'A\t'"$marker" &&
                -z "$(git log -1 --format=%H HEAD^ -- "$marker")" &&
                -f "$marker" ]] &&
              cmp -s "$marker" <(printf '%s\n' "$subject"); then
            echo 'authorized=true' >> "$GITHUB_OUTPUT"
          fi
  one-authentic-original-economic:
    needs: verify
    if: needs.verify.outputs.authorized == 'true'
    environment: mxm-r3-custody-v1
    concurrency:
      group: mxm-rvc1-one-original-300eur-frozen-common-book
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          run-id: 41724643418
          github-token: ${{ github.token }}
          path: bdp-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          run-id: 41735441128
          github-token: ${{ github.token }}
          path: aip-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hxc1-original-historical-encrypted-source
          run-id: 43817213663
          github-token: ${{ github.token }}
          path: mde1-hxc1-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: xmh2-complete-274day-m15-encrypted-source
          run-id: 44352570167
          github-token: ${{ github.token }}
          path: mde1-xmh2-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p05-new-live-readonly-authentic-source-sealed
          run-id: 45134137836
          github-token: ${{ github.token }}
          path: p05-sealed
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p05-new-live-readonly-aggregate-public
          run-id: 45134137836
          github-token: ${{ github.token }}
          path: p05-public
      - name: ONE verified originals source-only bridge -> ONE native joint book
        run: python -m research.rvc1_one_original_execution
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - name: Publish only source receipts and aggregate C# economic result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rvc1-one-original-native-joint-fx-common300-economic-public
          path: rvc1-public/
          retention-days: 90
          if-no-files-found: error
