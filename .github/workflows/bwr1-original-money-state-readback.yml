name: BWR1 F1 exact original protected EUR financial state correction
on:
  pull_request:
    paths:
      - 'research/BWR1_ORIGINAL_STATE_LABEL_READBACK.md'
      - 'research/bwr1_brent_wti_paired_eur.py'
      - 'research/bwr1_original_protected_money_correction.py'
      - 'research/test_bwr1_original_money_correction.py'
      - '.github/workflows/bwr1-original-money-state-readback.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bwr1-original-money-state-readback.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/bwr1_original_protected_money_correction.py research/test_bwr1_original_money_correction.py
      - run: python -m unittest research.test_bwr1_original_money_correction research.test_bwr1_brent_wti_paired_eur -v
  corrected-original-protected-financial-readback:
    needs: verify
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' && github.run_attempt == '1' &&
      startsWith(github.event.head_commit.message, 'OWNER_BWR1_F1_EXACT_ORIGINAL_READBACK_ONCE')
    environment: mxm-r3-custody-v1
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bwr1-original-encrypted-source
          run-id: 43576022822
          github-token: ${{ github.token }}
          path: bwr1-original-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bwr1-original-public-eur-money
          run-id: 43576022822
          github-token: ${{ github.token }}
          path: bwr1-original-public
      - name: Reconcile immutable broker original and score exact 25 causal pairs
        run: python -m research.bwr1_original_protected_money_correction
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bwr1-f1-corrected-original-eur-conditional-receipt
          path: bwr1-f1-corrected-original-eur-public.json
          if-no-files-found: error
          retention-days: 90
