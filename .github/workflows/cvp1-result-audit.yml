name: CVP1 immutable public receipt arithmetic audit
on:
  pull_request:
    paths:
      - 'docs/CVP1_*'
      - 'research/audit_cvp1_public.py'
      - '.github/workflows/cvp1-result-audit.yml'
  push:
    branches: [main]
    paths:
      - 'docs/CVP1_*'
      - 'research/audit_cvp1_public.py'
      - '.github/workflows/cvp1-result-audit.yml'
permissions:
  contents: read
jobs:
  arithmetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original ZIP and cash trade cost R weekly identities without policy execution
        run: python research/audit_cvp1_public.py docs/CVP1_ORIGINAL_PUBLIC_44162043538.zip /tmp/cvp1-audit.json
