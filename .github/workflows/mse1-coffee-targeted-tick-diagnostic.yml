name: MSE1 Coffee one-shot original-account targeted tick diagnosis
on:
  pull_request:
    paths:
      - '.github/workflows/mse1-coffee-targeted-tick-diagnostic.yml'
      - 'research/mse1_coffee_targeted_tick_diagnostic.py'
      - 'research/MSE1_COFFEE_TARGETED_TICK_DIAGNOSTIC.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mse1-coffee-targeted-tick-diagnostic.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m py_compile research/mse1_coffee_targeted_tick_diagnostic.py
  custody-recipient:
    needs: verify
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' && github.run_attempt == '1' &&
      startsWith(github.event.head_commit.message, 'OWNER_MSE1_COFFEE_TARGETED_TICKS_ONCE')
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mse1-coffee-targeted-existing-custody-recipient
          path: new-recipient-output/
          if-no-files-found: error
          retention-days: 30
  targeted-readonly-ticks:
    needs: custody-recipient
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-existing-oauth-read-only
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mse1-coffee-targeted-existing-custody-recipient
          path: new-recipient-output
      - name: New, narrowly bounded read-only Coffee tick retrieval only
        run: python -m research.mse1_coffee_targeted_tick_diagnostic
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mse1-coffee-new-targeted-raw-ticks-encrypted
          path: mse1-coffee-targeted-ticks.v2.enc
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mse1-coffee-new-targeted-tick-public-diagnostic
          path: mse1-coffee-targeted-ticks-public.json
          if-no-files-found: error
          retention-days: 90
