name: OWNER conditional EUR source readback
on:
  pull_request:
    paths:
      - '.github/workflows/owner-eur-conditional-source.yml'
      - 'research/owner_eur_conditional_source.py'
      - 'research/test_owner_eur_conditional_source.py'
      - 'research/owner_eur_conditional_pilot.py'
      - 'research/OWNER_EUR_CONDITIONAL_CONTINUITY_PILOT_20261125.md'
      - 'src/Mxm.Core/NativeConditionalRollover.cs'
      - 'src/Mxm.Replay/IntegratedEconomicReplay.ConditionalRollover.cs'
      - 'src/Mxm.Replay/IntegratedEconomicReplay.DatedEur.cs'
      - 'src/Mxm.Core/NativePortfolioFunding.cs'
      - 'src/Mxm.Core/NativeUnifiedPortfolioEngine*.cs'
      - 'tests/Mxm.Checks/NativeEurPortfolioChecks.cs'
  push:
    branches: [main]
    paths: ['ops/owner-eur-conditional-source-once.txt']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      activate: ${{ steps.marker.outputs.activate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/owner_eur_conditional_pilot.py
      - run: python -m unittest research.test_owner_eur_conditional_source
      - run: dotnet run --project tests/Mxm.Checks -c Release
      - run: dotnet build src/Mxm.Replay -c Release
      - id: marker
        shell: bash
        run: |
          echo 'activate=false' >> "$GITHUB_OUTPUT"
          [[ "$GITHUB_EVENT_NAME" == push ]] || exit 0
          marker=ops/owner-eur-conditional-source-once.txt
          subject=OWNER_EUR_CONDITIONAL_SOURCE_20261125
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_RUN_ATTEMPT" == 1 &&
             "$GITHUB_ACTOR" == mariancradulescu &&
             "$(git log -1 --format=%s)" == "$subject" &&
             "$(git diff-tree --no-commit-id --name-status -r HEAD)" == $'A\t'"$marker" &&
             -z "$(git log -1 HEAD^ -- "$marker")" ]]
          cmp -s "$marker" <(printf '%s\n' "$subject")
          echo 'activate=true' >> "$GITHUB_OUTPUT"
  readback:
    needs: verify
    if: needs.verify.outputs.activate == 'true'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-public-receipt
          path: original-source-history
          run-id: 45396314675
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-eur-rollover-official-original
          path: eur-rollover-continuity
          run-id: 45549613144
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-eur-chronological-coverage-updated
          path: prior-eur-matrix
          run-id: 45545171456
          github-token: ${{ github.token }}
      - run: python -m research.owner_eur_conditional_source
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-eur-conditional-source-verified
          path: eur-conditional-source/
          retention-days: 90
          if-no-files-found: error
  pilot:
    needs: [verify, readback]
    if: needs.verify.outputs.activate == 'true' && needs.readback.result == 'success'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-eur-conditional-source-verified
          path: eur-conditional-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          path: bdp-source
          run-id: 41724643418
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          path: aip-source
          run-id: 41735441128
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: integrated-full-session-custody
          path: integrated-sealed-source
          run-id: 44687919474
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: integrated-full-session-source-public
          path: integrated-source-public
          run-id: 44687919474
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: closed-market-original-ciphertext
          path: closed-market-source
          run-id: 44733062339
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: closed-market-original-source-public
          path: closed-market-source
          run-id: 44733062339
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hxc1-original-historical-encrypted-source
          path: hxc1-original
          run-id: 43817213663
          github-token: ${{ github.token }}
      - name: Run distinct pre-registered exposed continuity pilot
        run: python -m research.owner_eur_conditional_pilot
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-eur-conditional-pilot-ledgers
          path: owner-eur-conditional-pilot-public/
          retention-days: 90
          if-no-files-found: error
