name: XMH2 ORIGINAL 274day earlier M15 Pepperstone source-only no model
on:
  pull_request:
    paths:
      - 'research/XMH2_FROZEN_274DAY_EARLIER_M15_SOURCE_20261118.md'
      - 'research/xmh2_complete_earlier_m15_source_protocol.json'
      - 'research/xmh2_m15_source.py'
      - 'research/xmh2_m15_readback.py'
      - 'research/test_xmh2_m15_source.py'
      - '.github/workflows/xmh2-complete-earlier-m15-source-only.yml'
  push:
    branches: [main]
    paths:
      - 'ops/xmh2-full-m15-once.txt'
      - '.github/workflows/xmh2-complete-earlier-m15-source-only.yml'
permissions:
  contents: read
  actions: read

jobs:
  verify-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      authorized: ${{ steps.owner.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Freeze separate NEW source support protocol before collection
        run: |
          git merge-base --is-ancestor 3b20ae7c6f3e931cb6168a2fd00d367295d7e543 HEAD
          git show 3b20ae7c6f3e931cb6168a2fd00d367295d7e543:research/XMH2_FROZEN_274DAY_EARLIER_M15_SOURCE_20261118.md >/tmp/xmh2-frozen
          cmp /tmp/xmh2-frozen research/XMH2_FROZEN_274DAY_EARLIER_M15_SOURCE_20261118.md
      - run: python -m py_compile research/xmh2_m15_source.py research/xmh2_m15_readback.py
      - run: python -m unittest research.test_xmh2_m15_source -v
      - name: One exact OWNER main source-only admission; never PR or generic dispatch
        id: owner
        shell: bash
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_XMH2_COMPLETE_274DAY_M15_READONLY_SOURCE_ONCE" &&
                "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/xmh2-full-m15-once.txt" &&
                "$(cat ops/xmh2-full-m15-once.txt)" == "OWNER_XMH2_1644_HISTORICAL_M15_OFFICIAL_REQUESTS_ONCE" ]]; then
             echo 'authorized=true' >> "$GITHUB_OUTPUT"
          fi

  original-recipient:
    needs: [verify-source-contract]
    if: needs.verify-source-contract.outputs.authorized == 'true'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Derive run-bound public recipient from installed custody key, no secret export
        run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xmh2-new-source-public-recipient
          path: new-recipient-output/
          retention-days: 5
          if-no-files-found: error

  original-historical-readonly-collection:
    needs: [verify-source-contract, original-recipient]
    if: needs.verify-source-contract.outputs.authorized == 'true'
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-xmh2-new-earlier-m15-readonly-probe-once
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: xmh2-new-source-public-recipient
          path: new-source-recipient
      - name: Original-account historical M15 274 days 1644 fixed chunks source-only through Open API; NO prediction, NO orders
        run: python -m research.xmh2_m15_source
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xmh2-complete-274day-m15-encrypted-source
          path: xmh2-sealed-output/
          retention-days: 90
          if-no-files-found: error

  original-historical-source-readback:
    needs: [verify-source-contract, original-historical-readonly-collection]
    if: needs.verify-source-contract.outputs.authorized == 'true'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: xmh2-complete-274day-m15-encrypted-source
          path: xmh2-sealed-output
      - name: Cryptographic original-account and protobuf OHLCV readback, aggregate receipt only
        run: python -m research.xmh2_m15_readback
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xmh2-full-274day-m15-original-public-receipt
          path: xmh2-full-m15-provenance.public.json
          retention-days: 90
          if-no-files-found: error
