name: OWNER dense earlier historical funded research
on:
  pull_request:
    paths:
      - 'research/eur_dense_funded_2.json'
      - 'research/owner_eur_dense_funded.py'
      - '.github/workflows/owner-eur-dense-funded.yml'
      - 'src/Mxm.Core/NativeEur*'
      - 'src/Mxm.Replay/IntegratedEconomicReplay.Eur*.cs'
  push:
    branches: [main]
    paths: ['research/eur_dense_funded_2.json']
permissions:
  contents: read
  actions: read
jobs:
  technical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.owner_eur_dense_funded --help
      - run: dotnet build src/Mxm.Replay -c Release
      - run: python -m unittest research.test_owner_eur_dense_monetary research.test_owner_eur_checkpoint research.test_merge_eur_scenarios
      - run: dotnet run --project tests/Mxm.Checks -c Release
  evidence:
    needs: technical
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'mariancradulescu'
    strategy:
      fail-fast: false
      matrix:
        scenario: [0, 1, 2]
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      MXM_ECONOMIC_SCENARIO_INDEX: ${{ matrix.scenario }}
      MXM_ECONOMIC_TRIAL_GROUP: DENSE
      MXM_ECONOMIC_RECEIPT_DIRECTORY: window-receipts
      MXM_ECONOMIC_BOUNDED_NEIGHBORS: 1
      MXM_ECONOMIC_PAIRED_DISTRIBUTION: 1
      MXM_ECONOMIC_REUSE_FRAMES: 1
      CHECKPOINT_PREFIX: eur-dense-funded-checkpoint-${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Mxm.Replay -c Release
      - name: Pin original authenticated terms archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/15000522105 > /tmp/eer1-artifact.json
          python -c 'import json; a=json.load(open("/tmp/eer1-artifact.json")); assert a["id"]==15000522105 and a["workflow_run"]["id"]==45555613548 and a["digest"]=="sha256:107b2bc43e6ff25a5799e253b0ab6ee718ad5b88ef3bb3211d84ad6c20b87a5b" and not a["expired"]'
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/15000522105/zip > /tmp/eer1-original.zip
          echo '107b2bc43e6ff25a5799e253b0ab6ee718ad5b88ef3bb3211d84ad6c20b87a5b  /tmp/eer1-original.zip' | sha256sum -c -
          unzip -q /tmp/eer1-original.zip -d eer1-source
          rm /tmp/eer1-original.zip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-public-receipt
          run-id: 45396314675
          github-token: ${{ github.token }}
          path: original-source-history
      - name: Pin dense and prior archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.owner_eur_dense_funded download
      - name: Materialize and independently reconcile all dense packets
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: python -m research.owner_eur_dense_funded materialize --work "$RUNNER_TEMP/eur-private" --receipt dense-source.json
      - name: Recover encrypted checkpoints from earlier attempt
        id: resume
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p window-receipts
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name' > "$RUNNER_TEMP/checkpoints.txt"
          for phase in 1 2 3; do
            name="$CHECKPOINT_PREFIX-$phase"
            if grep -Fxq "$name" "$RUNNER_TEMP/checkpoints.txt"; then
              gh run download "$GITHUB_RUN_ID" --name "$name" --dir "checkpoints/$phase"
              find "checkpoints/$phase" -name '*.json' -type f -exec cp {} window-receipts/ \;
              echo "phase$phase=true" >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Replay phase 1 and seal checkpoint
        if: steps.resume.outputs.phase1 != 'true'
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: python -m research.owner_eur_checkpoint "$RUNNER_TEMP/eur-private" dense-result.json --protocol "$RUNNER_TEMP/eur-private/protocol.json" --phase 1 --checkpoint checkpoints/1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.resume.outputs.phase1 != 'true'
        with:
          name: ${{ env.CHECKPOINT_PREFIX }}-1
          path: checkpoints/1
          if-no-files-found: error
          retention-days: 90
      - name: Replay phase 2 and seal checkpoint
        if: steps.resume.outputs.phase2 != 'true'
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: python -m research.owner_eur_checkpoint "$RUNNER_TEMP/eur-private" dense-result.json --protocol "$RUNNER_TEMP/eur-private/protocol.json" --previous checkpoints/1/checkpoint.sealed --phase 2 --checkpoint checkpoints/2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.resume.outputs.phase2 != 'true'
        with:
          name: ${{ env.CHECKPOINT_PREFIX }}-2
          path: checkpoints/2
          if-no-files-found: error
          retention-days: 90
      - name: Replay phase 3 and seal checkpoint
        if: steps.resume.outputs.phase3 != 'true'
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: python -m research.owner_eur_checkpoint "$RUNNER_TEMP/eur-private" dense-result.json --protocol "$RUNNER_TEMP/eur-private/protocol.json" --previous checkpoints/2/checkpoint.sealed --phase 3 --checkpoint checkpoints/3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.resume.outputs.phase3 != 'true'
        with:
          name: ${{ env.CHECKPOINT_PREFIX }}-3
          path: checkpoints/3
          if-no-files-found: error
          retention-days: 90
      - name: Complete last chronological fold
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: python -m research.owner_eur_checkpoint "$RUNNER_TEMP/eur-private" dense-result.json --protocol "$RUNNER_TEMP/eur-private/protocol.json" --previous checkpoints/3/checkpoint.sealed
      - name: Validate native report and public custody receipt
        run: |
          cp "$RUNNER_TEMP/eur-private/protocol.json" materialized-protocol.json
          python - <<'PY'
          import json
          from pathlib import Path
          bind=json.loads(Path("dense-source.json").read_bytes())
          plan=json.loads(Path("materialized-protocol.json").read_bytes())
          s=json.loads(Path("dense-result.json").read_bytes())["Summary"]
          assert s["Study"]==plan["Study"] and s["ProtocolSha256"]==bind["ProtocolSha256"]
          assert s["SourceSha256"]==bind["SourceSha256"] and s["EvidenceManifestSha256"]==bind["EvidenceManifestSha256"]
          assert len(s["Results"])==1 and len(s["Results"][0]["Trials"])==len(plan["Trials"])
          assert s["Orders"]==s["SourceBrokerRequests"]==0
          assert s["CloudActivated"] is s["IndependentConfirmationCertified"] is False
          for m in s["Results"][0]["Markets"]:
              print("DENSE_FUNDED_NATIVE_MARKS",m["Name"],m["Counts"].get("MONETARY_FRAME",0))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eur-dense-funded-result-${{ matrix.scenario }}
          path: |
            dense-result.json
            dense-source.json
            materialized-protocol.json
            window-receipts/*.json
          if-no-files-found: error
          retention-days: 90
  combine:
    needs: [technical, evidence]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: eur-dense-funded-result-*
          path: partitions
      - name: Reconcile exact monetary reports
        run: |
          set -euo pipefail
          mkdir dense-report
          dir="partitions/eur-dense-funded-result"
          for scenario in 1 2; do
            cmp "$dir-0/materialized-protocol.json" "$dir-$scenario/materialized-protocol.json"
            cmp "$dir-0/dense-source.json" "$dir-$scenario/dense-source.json"
          done
          python -m research.merge_eur_scenarios "$dir-0/materialized-protocol.json" dense-report/economic.json "$dir"-{0,1,2}/dense-result.json
          cp "$dir-0/dense-source.json" dense-report/source.json
          cp "$dir-0/materialized-protocol.json" dense-report/protocol.json
          sha256sum dense-report/*.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eur-dense-funded-complete
          path: dense-report/
          retention-days: 90
          if-no-files-found: error
