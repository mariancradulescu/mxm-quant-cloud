name: SPL1 52-week recurrent sterling price discovery original EUR finance
on:
  pull_request:
    paths:
      - 'research/SPL1_STERLING_CROSS_PRICE_DISCOVERY_FROZEN_20261116.md'
      - 'research/spl1_original_eurgbp_source.py'
      - 'research/spl1_original_sterling_financial_readback.py'
      - 'research/test_spl1_original_sterling.py'
      - '.github/workflows/spl1-genuine-fx-eur-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'ops/spl1-single-original-owner-intent.txt'
      - '.github/workflows/spl1-genuine-fx-eur-readonly.yml'
permissions:
  contents: read
  actions: read

jobs:
  validate-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      authorized: ${{ steps.owner.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/spl1_original_eurgbp_source.py research/spl1_original_sterling_financial_readback.py research/test_spl1_original_sterling.py
      - run: python -m unittest research.test_spl1_original_sterling -v
      - name: OWNER only one original complete 52-week read-only run on main
        id: owner
        shell: bash
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_SPL1_ANNUAL_FINANCIAL_READONLY_ONCE" &&
                "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/spl1-single-original-owner-intent.txt" &&
                "$(cat ops/spl1-single-original-owner-intent.txt)" == "OWNER_SPL1_GBP52W_TWO_CLOCKS_ALL_SOURCE_AND_EUR_FINANCE" ]]; then
             echo 'authorized=true' >> "$GITHUB_OUTPUT"
          fi

  custody-public-recipient:
    needs: validate-gate
    if: needs.validate-gate.outputs.authorized == 'true'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Produce exact original-run public recipient from existing custody installation
        run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spl1-original-custody-public-recipient
          path: new-recipient-output/
          retention-days: 5
          if-no-files-found: error

  original-pepperstone-m5-quote-source:
    needs: [validate-gate, custody-public-recipient]
    if: needs.validate-gate.outputs.authorized == 'true'
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-spl1-original-annual-sterling-readonly-once
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: spl1-original-custody-public-recipient
          path: new-recipient-output
      - name: Original Pepperstone FX EURGBP M5 plus GBPUSD/EURUSD bidask at all 520 fixed clocks, SEAL FIRST
        run: python -m research.spl1_original_eurgbp_source
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spl1-original-annual-fx-encrypted-source
          path: spl1-original-source.v2.enc
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spl1-original-source-coverage-only
          path: spl1-original-source-public.json
          retention-days: 90
          if-no-files-found: error

  original-protected-eur-economics:
    needs: [validate-gate, original-pepperstone-m5-quote-source]
    if: needs.validate-gate.outputs.authorized == 'true'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          run-id: 41724643418
          github-token: ${{ github.token }}
          path: bdp1-original
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: spl1-original-annual-fx-encrypted-source
          path: spl1-original
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: spl1-original-source-coverage-only
          path: spl1-public
      - name: Rebuild both authenticated original raw Pepperstone sources and SCORE 520 original EUR300 opportunities
        run: python -m research.spl1_original_sterling_financial_readback
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spl1-original-52-week-eur-funded-conditional-money
          path: spl1-original-annual-sterling-eur-money.public.json
          retention-days: 90
          if-no-files-found: error
