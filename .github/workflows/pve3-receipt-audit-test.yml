name: PVE3 receipt-only audit tests - no source or economic replay
on:
  pull_request:
    paths:
      - 'research/pve3_original_receipt_audit.py'
      - 'research/test_pve3_original_receipt_audit.py'
      - '.github/workflows/pve3-receipt-audit-test.yml'
permissions:
  contents: read
jobs:
  receipt-audit-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest research.test_pve3_original_receipt_audit -v
