name: MRF1 F1 numeric-portability SECOND technical finance-only recovery
on:
  pull_request:
    paths:
      - 'research/MRF1_F1_NUMERIC_PORTABILITY_RECOVERY_BOUNDARY_20261117.md'
      - 'research/mrf1_f1_numeric_portable_finance.py'
      - 'research/test_mrf1_f1_numeric_portable_finance.py'
      - '.github/workflows/mrf1-f1-numeric-portable-finance.yml'
  push:
    branches: [main]
    paths:
      - 'ops/mrf1-f1-numeric-finance-once.txt'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      original_readback: ${{ steps.owner.outputs.original_readback }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt numpy==2.3.5
      - name: Fixed recovery protocol separately frozen BEFORE this technical adapter
        run: |
          git merge-base --is-ancestor 5e00ecbdeaf421ea19ba4cf64144b280a13f1952 HEAD
          git show 5e00ecbdeaf421ea19ba4cf64144b280a13f1952:research/MRF1_F1_NUMERIC_PORTABILITY_RECOVERY_BOUNDARY_20261117.md >/tmp/mrf1-recovery-first-protocol.md
          cmp /tmp/mrf1-recovery-first-protocol.md research/MRF1_F1_NUMERIC_PORTABILITY_RECOVERY_BOUNDARY_20261117.md
      - name: First original MRF1 model and native financial code remain immutable
        run: |
          git show 19d90c3601d56ac4c87389dec24118ba2b8454c3:research/MRF1_FROZEN_AUTHENTIC_M1_MULTIRESOLUTION_PROTOCOL_20261117.md >/tmp/mrf1-original-protocol.md
          cmp /tmp/mrf1-original-protocol.md research/MRF1_FROZEN_AUTHENTIC_M1_MULTIRESOLUTION_PROTOCOL_20261117.md
          git show 19d90c3601d56ac4c87389dec24118ba2b8454c3:research/mrf1_authentic_m1_multiresolution.py >/tmp/mrf1-original-model.py
          cmp /tmp/mrf1-original-model.py research/mrf1_authentic_m1_multiresolution.py
          git show 19d90c3601d56ac4c87389dec24118ba2b8454c3:src/Mxm.Replay/Mrf1NativeStudy.cs >/tmp/mrf1-native-original.cs
          cmp /tmp/mrf1-native-original.cs src/Mxm.Replay/Mrf1NativeStudy.cs
      - run: python -m unittest research.test_mrf1_f1_financial_only_recovery -v
      - run: dotnet build src/Mxm.Replay -c Release
      - run: python -m research.verify_owner_policy
      - name: Exact OWNER ONE-TIME technical financial recovery on main ONLY
        id: owner
        shell: bash
        run: |
          echo 'original_readback=false' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_MRF1_F1_NUMERIC_PARITY_FINANCE_ONLY_ONCE" &&
                "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/mrf1-f1-numeric-finance-once.txt" &&
                "$(cat ops/mrf1-f1-numeric-finance-once.txt)" == "OWNER_MRF1_F1_SOURCE_MODEL_FIXED_5E_MINUS14_PARITY_FINANCE_ONLY" ]]; then
            echo 'original_readback=true' >> "$GITHUB_OUTPUT"
          fi
  numeric-portability-finance-second:
    needs: verify
    if: ${{ needs.verify.outputs.original_readback == 'true' }}
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: mxm-mrf1-f1-numeric-portable-finance-only-once
      cancel-in-progress: false
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt numpy==2.3.5
      - run: dotnet build src/Mxm.Replay -c Release
      - name: Frozen FIRST ORIGINAL failed-run predictive artifact, no model retraining
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mrf1-original-genuine-m1-mtf-predictive-and-native-eur
          run-id: 44069157176
          github-token: ${{ github.token }}
          path: mrf1-first-original
      - name: Original HXC1 immutable M1/M15/H1 source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hxc1-original-historical-encrypted-source
          run-id: 43817213663
          github-token: ${{ github.token }}
          path: hxc1-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cxl1-original-275-earlier-sealed-source
          run-id: 43947388854
          github-token: ${{ github.token }}
          path: cxl1-new-encrypted
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cxl1-original-275-earlier-source-coverage
          run-id: 43947388854
          github-token: ${{ github.token }}
          path: cxl1-new-public
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cxl1-original-50clock-source-encrypted
          run-id: 43945139889
          github-token: ${{ github.token }}
          path: cxl1-pilot-encrypted
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cxl1-original-50clock-pilot-public
          run-id: 43945139889
          github-token: ${{ github.token }}
          path: cxl1-pilot-public
      - name: Apply EXACT first original model hash to causal bars and evaluate PREVIOUSLY UNRUN C# finance only
        run: python -m research.mrf1_f1_financial_only_recovery
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
          MRF1_DOTNET: dotnet
      - name: Preserve finance recovery receipts including technical error stage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mrf1-f1-second-numeric-portable-finance-original
          path: mrf1-f1-numeric-recovery-*.json
          if-no-files-found: warn
          retention-days: 90
      - if: success()
        run: sha256sum research/MRF1_F1_NUMERIC_PORTABILITY_RECOVERY_BOUNDARY_20261117.md research/mrf1_f1_numeric_portable_finance.py mrf1-f1-numeric-recovery-*.json
