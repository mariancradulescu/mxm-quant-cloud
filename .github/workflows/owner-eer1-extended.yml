name: OWNER EER1 extended multi-asset EUR research
on:
  pull_request:
    paths:
      - '.github/workflows/owner-eer1-extended.yml'
      - 'research/owner_eer1_*.py'
      - 'research/test_owner_eer1_source.py'
      - 'research/OWNER_EER1_EXTENDED_20261125.md'
      - 'src/Mxm.Replay/IntegratedEconomicReplay.Eer1.cs'
      - 'src/Mxm.Core/NativeUnifiedPortfolioEngine.Economic.cs'
  push:
    branches: [main]
    paths: ['ops/owner-eer1-extended-once.txt']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      activate: ${{ steps.marker.outputs.activate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/owner_eer1_source.py research/owner_eer1_readback.py
      - run: python -m unittest research.test_owner_eer1_source research.test_p05_readonly_wire
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/Mxm.Checks -c Release
      - run: dotnet build src/Mxm.Replay -c Release
      - id: marker
        shell: bash
        run: |
          echo 'activate=false' >> "$GITHUB_OUTPUT"
          [[ "$GITHUB_EVENT_NAME" == push ]] || exit 0
          marker=ops/owner-eer1-extended-once.txt
          subject=OWNER_EER1_EXTENDED_20261125
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_RUN_ATTEMPT" == 1 &&
             "$GITHUB_ACTOR" == mariancradulescu &&
             "$(git log -1 --format=%s)" == "$subject" &&
             "$(git diff-tree --no-commit-id --name-status -r HEAD)" == $'A\t'"$marker" &&
             -z "$(git log -1 HEAD^ -- "$marker")" ]]
          cmp -s "$marker" <(printf '%s\n' "$subject")
          echo 'activate=true' >> "$GITHUB_OUTPUT"
  recipient:
    needs: verify
    if: needs.verify.outputs.activate == 'true'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eer1-recipient
          path: new-recipient-output/
          retention-days: 2
          if-no-files-found: error
  source:
    needs: [verify, recipient]
    if: needs.verify.outputs.activate == 'true' && needs.recipient.result == 'success'
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-existing-oauth-read-only
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: eer1-recipient
          path: eer1-recipient
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-eur-conditional-source-verified
          path: pilot-source
          run-id: 45552716026
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-public-receipt
          path: original-source-history
          run-id: 45396314675
          github-token: ${{ github.token }}
      - name: Collect progressive official historical quote and missing bar shards
        run: python -m research.owner_eer1_source
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eer1-protected-source
          path: eer1-source/
          retention-days: 90
          if-no-files-found: error
  economics:
    needs: [verify, source]
    if: needs.verify.outputs.activate == 'true' && needs.source.result == 'success'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: eer1-protected-source
          path: eer1-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-eur-conditional-source-verified
          path: pilot-source
          run-id: 45552716026
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-public-receipt
          path: original-source-history
          run-id: 45396314675
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-original-sealed
          path: original-source-history
          run-id: 45396314675
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-history-extension-sealed-and-receipt
          path: previous-extension
          run-id: 45409527714
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          path: bdp-source
          run-id: 41724643418
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          path: aip-source
          run-id: 41735441128
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hxc1-original-historical-encrypted-source
          path: mde1-hxc1-source
          run-id: 43817213663
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: xmh2-complete-274day-m15-encrypted-source
          path: mde1-xmh2-source
          run-id: 44352570167
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p05-new-live-readonly-authentic-source-sealed
          path: p05-sealed
          run-id: 45134137836
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p05-new-live-readonly-aggregate-public
          path: p05-public
          run-id: 45134137836
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-eur-gap-official-original
          path: prior-gap
          run-id: 45541671931
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-eur-rollover-official-original
          path: prior-rollover
          run-id: 45549613144
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: integrated-full-session-custody
          path: integrated-sealed-source
          run-id: 44687919474
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: integrated-full-session-source-public
          path: integrated-source-public
          run-id: 44687919474
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: closed-market-original-ciphertext
          path: closed-market-source
          run-id: 44733062339
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: closed-market-original-source-public
          path: closed-market-source
          run-id: 44733062339
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hxc1-original-historical-encrypted-source
          path: hxc1-original
          run-id: 43817213663
          github-token: ${{ github.token }}
      - name: Reconcile source shards and execute the three same-engine EUR scenarios
        run: python -m research.owner_eer1_readback
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eer1-economic-ledgers-and-evidence
          path: eer1-economic-public/
          retention-days: 90
          if-no-files-found: error
