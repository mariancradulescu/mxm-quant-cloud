name: SPDE1 original BDP1 AIP1 systematic OHLCV predictive EUR once
on:
  pull_request:
    paths:
      - 'research/spde1_protocol.json'
      - 'research/spde1_systematic_ohlcv.py'
      - 'research/test_spde1_systematic_ohlcv.py'
      - '.github/workflows/spde1-systematic-ohlcv.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/spde1-systematic-ohlcv.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/spde1_systematic_ohlcv.py research/test_spde1_systematic_ohlcv.py
      - run: python -m unittest research.test_spde1_systematic_ohlcv -v

  original-bdp1-aip1-systematic-causal-eur:
    needs: verify
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' && github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'OWNER_SPDE1_ORIGINAL_SYSTEMATIC_ONCE')
    environment: mxm-r3-custody-v1
    concurrency:
      group: mxm-spde1-frozen-original-bdp-aip-once
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/setup-dotnet@d4b0f63c456f71f60dc7b7ef596dcda22579ca62
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          run-id: 41724643418
          github-token: ${{ github.token }}
          path: bdp-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          run-id: 41735441128
          github-token: ${{ github.token }}
          path: aip-source
      - name: Verify both immutable original 52-week sources, train 26w, score selection13w + exposed13w in EUR
        run: python -m research.spde1_systematic_ohlcv
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spde1-authentic-12symbol-7family-trained-prediction-modelled-eur
          path: spde1-systematic-ohlcv-authentic-eur.json
          if-no-files-found: error
          retention-days: 90
