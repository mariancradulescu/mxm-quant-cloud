name: Funded action value - authenticated historical source
on:
  pull_request:
    paths:
      - 'research/FUNDED_ACTION_VALUE_HISTORICAL.md'
      - 'research/integrated_market_source.py'
      - 'research/integrated_market_readback.py'
      - 'research/test_integrated_market_ticks.py'
      - '.github/workflows/funded-action-history-source.yml'
  push:
    branches: [main]
    paths:
      - 'ops/funded-action-history-source-once.txt'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.marker.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Verify source scope and read-only archive decoder
        run: |
          python -m unittest research.test_hxc1_historical_source research.test_integrated_market_ticks
          python -m py_compile research/integrated_market_source.py research/integrated_market_readback.py
          python -c 'from research.integrated_market_source import DAY, FUNDED_HISTORY as s; assert s.end-s.start == 91*DAY and set(s.periods) == {"M1", "M5", "M15", "M30", "H1"} and s.protocol.is_file()'
      - name: Verify exact first-addition source marker
        id: marker
        shell: bash
        run: |
          marker=ops/funded-action-history-source-once.txt
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" && "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_FUNDED_ACTION_HISTORY_READ_ONLY_SOURCE_ONCE" &&
                "$(git diff-tree --no-commit-id --name-status -r HEAD)" == $'A\t'"$marker" &&
                -z "$(git log -1 --format=%H HEAD^ -- "$marker")" &&
                -f "$marker" ]] &&
             cmp -s "$marker" <(printf '%s\n' OWNER_FUNDED_ACTION_HISTORY_READ_ONLY_SOURCE_ONCE); then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          fi
  recipient:
    needs: verify
    if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' && needs.verify.outputs.authorized == 'true' }}
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: funded-action-history-recipient
          path: new-recipient-output/
          retention-days: 3
          if-no-files-found: error
  collect:
    needs: [verify, recipient]
    if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' && needs.verify.outputs.authorized == 'true' }}
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-existing-oauth-read-only
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: funded-action-history-recipient
          path: new-source-recipient
      - name: Capture original contracts, native bars and full active-hour tick history
        run: python -m research.integrated_market_source --funded-action-history
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: funded-action-history-custody
          path: integrated-sealed-source/
          compression-level: 0
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: funded-action-history-source-public
          path: integrated-source-public/
          retention-days: 90
          if-no-files-found: warn
  readback:
    needs: [verify, collect]
    if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' && needs.verify.outputs.authorized == 'true' }}
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: funded-action-history-custody
          path: integrated-sealed-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: funded-action-history-source-public
          path: integrated-source-public
      - name: Verify the original protobuf and emit C# source coverage
        run: python -m research.integrated_market_readback --funded-action-history-coverage
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: funded-action-history-native-source-coverage
          path: funded-history-coverage/
          retention-days: 90
          if-no-files-found: error
