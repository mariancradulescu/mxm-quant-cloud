name: OWNER earlier residual authenticated recovery
on:
  pull_request:
    paths: ['research/held_earlier_residual_recovery_2.json','research/owner_held_earlier_residual_recovery.py','research/owner_held_residual_recovery.py','.github/workflows/owner-held-earlier-residual-recovery.yml']
  push:
    branches: [main]
    paths: ['research/held_earlier_residual_recovery_2.json']
permissions:
  contents: read
  actions: read
jobs:
  technical:
    runs-on: ubuntu-24.04
    outputs:
      new_study: ${{ steps.scope.outputs.new_study }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = push ] && git diff --diff-filter=A --name-only "$BEFORE" "$GITHUB_SHA" | grep -Fxq research/held_earlier_residual_recovery_2.json; then
            echo 'new_study=true' >> "$GITHUB_OUTPUT"
          else
            echo 'new_study=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.owner_held_earlier_residual_recovery check
      - run: python -m unittest research.test_held_remaining_source research.test_held_residual_reconstruction -v
      - run: python -m py_compile research/owner_held_remaining_source.py research/owner_held_equity_recovery.py
      - run: dotnet build src/Mxm.Replay -c Release
      - run: dotnet run --project tests/Mxm.Checks -c Release
  prepare:
    needs: technical
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'mariancradulescu' && github.run_attempt == 1 && needs.technical.outputs.new_study == 'true'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      partitions: ${{ steps.plan.outputs.partitions }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - id: plan
        run: python -m research.owner_held_earlier_residual_recovery prepare
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remaining-held-plan
          path: remaining-held-plan/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remaining-held-recipient
          path: new-recipient-output/
          retention-days: 90
          if-no-files-found: error
  capture:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        index: ${{ fromJSON(needs.prepare.outputs.partitions) }}
    environment: mxm-r3-pepperstone-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: mxm-existing-oauth-read-only
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: remaining-held-plan
          path: remaining-held-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: remaining-held-recipient
          path: new-recipient-output
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-public-receipt
          path: original-source-history
          run-id: 45396314675
          github-token: ${{ github.token }}
      - run: python -m research.owner_held_remaining_source capture --index ${{ matrix.index }}
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remaining-held-protected-${{ matrix.index }}
          path: remaining-held-protected/
          retention-days: 90
          if-no-files-found: warn
  verify:
    needs: [prepare, capture]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        index: ${{ fromJSON(needs.prepare.outputs.partitions) }}
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: remaining-held-plan
          path: remaining-held-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: remaining-held-protected-${{ matrix.index }}
          path: remaining-held-protected
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-public-receipt
          path: original-source-history
          run-id: 45396314675
          github-token: ${{ github.token }}
      - run: python -m research.owner_held_remaining_source verify --index ${{ matrix.index }}
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remaining-held-verified-${{ matrix.index }}
          path: remaining-held-verified/
          retention-days: 90
          if-no-files-found: error
  equity:
    needs: verify
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: remaining-held-plan
          path: remaining-held-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: remaining-held-verified-*
          path: remaining-verified-all
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-public-receipt
          path: original-source-history
          run-id: 45396314675
          github-token: ${{ github.token }}
      - run: |
          ulimit -c 0
          python -m research.owner_held_earlier_residual_recovery settle --work "$RUNNER_TEMP/residual-private"
        env:
          GH_TOKEN: ${{ github.token }}
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: held-residual-recovered-earlier
          path: held-recovery-report/
          retention-days: 90
          if-no-files-found: warn
