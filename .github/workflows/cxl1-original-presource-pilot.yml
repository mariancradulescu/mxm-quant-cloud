name: CXL1 original 50-clock source-and-finance feasibility NO outcome scoring
on:
  pull_request:
    paths:
      - 'research/cxl1_original_feasibility.py'
      - 'research/test_cxl1_original_feasibility.py'
      - '.github/workflows/cxl1-original-presource-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'ops/cxl1-original-pilot-once.txt'
      - '.github/workflows/cxl1-original-presource-pilot.yml'
permissions:
  contents: read
  actions: read

jobs:
  validate-cxl1-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      authorized: ${{ steps.owner.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/cxl1_original_feasibility.py research/test_cxl1_original_feasibility.py
      - run: python -m unittest research.test_cxl1_original_feasibility -v
      - name: Owner-only one original pilot main commit; no PR/fork access to private source
        id: owner
        shell: bash
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_CXL1_ORIGINAL_PRESOURCE_PILOT_ONCE" &&
                "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/cxl1-original-pilot-once.txt" &&
                "$(cat ops/cxl1-original-pilot-once.txt)" == "OWNER_CXL1_50_CLOCK_NO_PAYOFF_FX_COST_SUPPORT_ONLY" ]]; then
              echo 'authorized=true' >> "$GITHUB_OUTPUT"
          fi
  public-custody-recipient:
    needs: validate-cxl1-source-only
    if: ${{ needs.validate-cxl1-source-only.outputs.authorized == 'true' }}
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cxl1-original-pilot-custody-public
          path: new-recipient-output/
          retention-days: 5
          if-no-files-found: error
  protected-original-pilot-source-only:
    needs: [validate-cxl1-source-only, public-custody-recipient]
    if: ${{ needs.validate-cxl1-source-only.outputs.authorized == 'true' }}
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-cxl1-50clock-source-no-economics-once
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cxl1-original-pilot-custody-public
          path: new-recipient-output
      - name: Original Pepperstone 50-clock predecision and EUR cost-source gate; NO return scoring
        run: python -m research.cxl1_original_feasibility
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cxl1-original-50clock-source-encrypted
          path: cxl1-original-feasibility.v2.enc
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cxl1-original-50clock-pilot-public
          path: cxl1-original-feasibility-public.json
          retention-days: 90
          if-no-files-found: error
