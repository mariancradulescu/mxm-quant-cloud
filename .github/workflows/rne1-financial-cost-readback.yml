name: RNE1 original source-only current contract fee preflight
on:
  pull_request:
    paths:
      - 'research/rne1_source_financial_preflight.py'
      - 'research/test_rne1_source_financial_preflight.py'
      - 'research/RNE1_SOURCE_FINANCIAL_PREFLIGHT.md'
      - '.github/workflows/rne1-financial-cost-readback.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rne1-financial-cost-readback.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/rne1_source_financial_preflight.py research/test_rne1_source_financial_preflight.py
      - run: python -m unittest research.test_rne1_source_financial_preflight
  protected-original-source-readback:
    needs: verify
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' && github.run_attempt == '1' &&
      startsWith(github.event.head_commit.message, 'OWNER_RNE1_COST_READBACK_ONCE')
    environment: mxm-r3-custody-v1
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rne1-original-encrypted-source
          run-id: 43468457518
          github-token: ${{ github.token }}
          path: original-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rne1-original-public-economic
          run-id: 43468457518
          github-token: ${{ github.token }}
          path: original-public
      - name: Attribute current NatGas USD broker cost on frozen original event tape
        run: python -m research.rne1_source_financial_preflight
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rne1-current-cost-usd-screen
          path: rne1-current-cost-usd-screen.json
          if-no-files-found: error
          retention-days: 90
