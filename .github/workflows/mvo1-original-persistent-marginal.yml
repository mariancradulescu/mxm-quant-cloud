name: MVO1 original 12asset native persistent marginal opportunity economics
on:
  pull_request:
    paths:
      - 'research/MVO1_FROZEN_PERSISTENT_MARGIN_OPPORTUNITY_20261119.md'
      - 'research/mvo1_original_persistent_native.py'
      - 'src/Mxm.Core/NativeMarginalValueResearch.cs'
      - 'src/Mxm.Core/NativeCausalExitResearch.cs'
      - 'src/Mxm.Replay/Mvo1NativeStudy.cs'
      - 'src/Mxm.Replay/Program.cs'
      - 'tests/Mxm.Checks/Mvo1NativeChecks.cs'
      - '.github/workflows/mvo1-original-persistent-marginal.yml'
  push:
    branches: [main]
    paths:
      - 'ops/mvo1-original-run-once.txt'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      owner_once: ${{ steps.owner.outputs.owner_once }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Confirm freeze strictly predates all code and original source scoring
        run: |
          git merge-base --is-ancestor 689f90428254c34e5497c8dab5145b9cd19bbc0b HEAD
          git show 689f90428254c34e5497c8dab5145b9cd19bbc0b:research/MVO1_FROZEN_PERSISTENT_MARGIN_OPPORTUNITY_20261119.md >/tmp/mvo1-frozen
          cmp /tmp/mvo1-frozen research/MVO1_FROZEN_PERSISTENT_MARGIN_OPPORTUNITY_20261119.md
      - run: dotnet build src/Mxm.Replay -c Release
      - run: dotnet run --project tests/Mxm.Checks -c Release
      - run: dotnet build src/Mxm.Cloud -c Release
      - run: python -m py_compile research/mvo1_original_persistent_native.py
      - name: Original unique OWNER main trigger only, never during PR checks
        id: owner
        shell: bash
        run: |
          echo "owner_once=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_MVO1_NEW_PERSISTENT_ECONOMIC_SOURCE_REUSE_ONCE" &&
                "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/mvo1-original-run-once.txt" &&
                "$(cat ops/mvo1-original-run-once.txt)" == "OWNER_MVO1_NATIVE_PERSISTENT_POSITION_ORIGINAL_279491_M15_ONCE" ]]; then
            echo "owner_once=true" >> "$GITHUB_OUTPUT"
          fi
  original-original-source-native-economic:
    needs: verify
    if: ${{ needs.verify.outputs.owner_once == 'true' }}
    environment: mxm-r3-custody-v1
    concurrency:
      group: mxm-mvo1-immutable-custody-source-reuse-once
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: xmh2-complete-274day-m15-encrypted-source
          run-id: 44352570167
          github-token: ${{ github.token }}
          path: mde1-xmh2-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hxc1-original-historical-encrypted-source
          run-id: 43817213663
          github-token: ${{ github.token }}
          path: mde1-hxc1-source
      - name: NEW CSharp causal marginal-value economics with genuine sources and preserved unknown exposure
        run: python -m research.mvo1_original_persistent_native
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mvo1-original-native-12asset-persistent-economic-public
          path: mvo1-public/
          retention-days: 90
          if-no-files-found: warn
