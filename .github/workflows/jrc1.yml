name: JRC1 authentic economic research
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jrc1.yml"
      - "research/jrc1.py"
permissions:
  contents: read
  actions: read
jobs:
  jrc1-authentic-economic-research:
    if: github.actor == 'mariancradulescu' && github.ref == 'refs/heads/main'
    environment: mxm-r3-pepperstone-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - name: Collect original bars and BID/ASK and execute native JRC1
        run: python -m research.jrc1
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jrc1-authentic-economic-public-receipt
          path: jrc1-public.json
          if-no-files-found: error
          retention-days: 90
