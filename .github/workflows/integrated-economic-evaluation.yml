name: Integrated economic discovery - original native common-book evaluation
on:
  pull_request:
    paths:
      - 'src/Mxm.Core/NativeIntegratedEconomicPolicy.cs'
      - 'src/Mxm.Core/NativeUnifiedPortfolioEngine*.cs'
      - 'src/Mxm.Cloud/MxmCloud.cs'
      - 'src/Mxm.Replay/IntegratedEconomicReplay.cs'
      - 'tests/Mxm.Checks/IntegratedEconomicPolicyChecks.cs'
      - 'research/integrated_market_readback.py'
      - '.github/workflows/integrated-economic-evaluation.yml'
  push:
    branches: [main]
    paths:
      - 'ops/integrated-common-book-original-once.txt'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.marker.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Frozen protocol and exact closed studies preserved
        run: |
          git merge-base --is-ancestor 4ec519712e3c1ee75ed0f443dc88afbebdb21c86 HEAD
          echo '165e9eb04471ebc684581a667114c0b67bac9be162a8dfb9d0233648baf3a4c8  research/INTEGRATED_ECONOMIC_DISCOVERY_20261120.md' | sha256sum -c
          git diff --exit-code 9fce63b4a8c50482b36ea46c940e0dc95f14651f -- \
            research/fcp1_original_source_finance_comparison.py \
            research/FCP1_FROZEN_FIRST_FINANCE_SCORE_PORTFOLIO_20261119.md \
            src/Mxm.Core/NativeFcp1FinancedSelection.cs src/Mxm.Replay/Fcp1FinancedScoreRunner.cs \
            research/scp1_a1_source_recovery_native_score.py ops/fcp1-main-once.txt
      - name: Native same-input checks including fractional volume, partial close and protection through gaps
        run: |
          dotnet build src/Mxm.Replay -c Release
          dotnet build src/Mxm.Cloud -c Release
          dotnet run --project tests/Mxm.Checks -c Release
          python -m py_compile research/integrated_market_readback.py
      - name: Match the separate first-addition main marker
        id: marker
        shell: bash
        run: |
          marker=ops/integrated-common-book-original-once.txt
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" && "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_INTEGRATED_COMMON_BOOK_ORIGINAL_ONCE" &&
                "$(git diff-tree --no-commit-id --name-status -r HEAD)" == $'A\t'"$marker" &&
                -z "$(git log -1 --format=%H HEAD^ -- "$marker")" &&
                "$(cat "$marker")" == "OWNER_INTEGRATED_COMMON_BOOK_ORIGINAL_ONCE" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
  original-native-economics:
    needs: verify
    if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' && needs.verify.outputs.ready == 'true' }}
    environment: mxm-r3-custody-v1
    concurrency:
      group: mxm-integrated-original-native-economics
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: integrated-full-session-custody
          path: integrated-sealed-source
          run-id: 44687919474
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: integrated-full-session-source-public
          path: integrated-source-public
          run-id: 44687919474
          github-token: ${{ github.token }}
      - name: Validate original read-only custody and evaluate common-capital native economics
        run: python -m research.integrated_market_readback
        env:
          INTEGRATED_SOURCE_RUN: '44687919474'
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integrated-native-economic-original-public
          path: integrated-economic-public/
          retention-days: 90
          if-no-files-found: warn
