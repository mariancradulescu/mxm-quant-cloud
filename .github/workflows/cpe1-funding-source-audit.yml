name: CPE1 original source-only funding audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cpe1-funding-source-audit.yml'
      - 'research/cpe1_funding_source_audit.py'
      - 'src/Mxm.Replay/Cpe1FundingSourceAudit.cs'

permissions:
  contents: read
  actions: read

jobs:
  read-originals:
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cpe1-technical-recovery-1-authentic-csharp-eur300
          run-id: 45370323302
          github-token: ${{ github.token }}
          path: cpe1-immutable-original
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          run-id: 41724643418
          github-token: ${{ github.token }}
          path: bdp-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          run-id: 41735441128
          github-token: ${{ github.token }}
          path: aip-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hxc1-original-historical-encrypted-source
          run-id: 43817213663
          github-token: ${{ github.token }}
          path: mde1-hxc1-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: xmh2-complete-274day-m15-encrypted-source
          run-id: 44352570167
          github-token: ${{ github.token }}
          path: mde1-xmh2-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p05-new-live-readonly-authentic-source-sealed
          run-id: 45134137836
          github-token: ${{ github.token }}
          path: p05-sealed
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p05-new-live-readonly-aggregate-public
          run-id: 45134137836
          github-token: ${{ github.token }}
          path: p05-public
      - name: Verify archived contracts and count the original closed-bar detections
        run: python -m research.cpe1_funding_source_audit
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpe1-original-funding-source-forensics
          path: cpe1-funding-source-audit/cpe1-funding-source-audit.json
          if-no-files-found: error
          retention-days: 90
