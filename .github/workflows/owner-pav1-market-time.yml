name: OWNER PAV1 market-time FX and common monetary development
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'research/pav1_market_time_fx_1.json', 'research/owner_pav1_market_time.py', 'research/test_pav1_market_time.py', 'research/NativePav1FundingRecovery/**', '.github/workflows/owner-pav1-market-time.yml']
  push:
    branches: [main]
    paths: ['research/pav1_market_time_fx_1.json', 'ops/pav1-market-time-technical-recovery-1.txt', 'ops/pav1-market-time-technical-recovery-2.txt']
permissions:
  contents: read
  actions: read
jobs:
  technical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Mxm.Replay -c Release
      - run: dotnet build src/Mxm.Cloud -c Release
      - run: dotnet build research/NativePav1FundingRecovery -c Release
      - run: python -m unittest research.test_pav1_market_time research.test_monetary_causal_lifecycle research.test_pav1_closed_funding
      - run: dotnet run --project tests/Mxm.Checks -c Release
  develop:
    needs: technical
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'mariancradulescu' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    environment: mxm-r3-custody-v1
    timeout-minutes: 120
    env:
      MXM_ECONOMIC_REUSE_FRAMES: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Mxm.Replay -c Release
      - run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - run: mv new-recipient-output current-checkpoint-recipient
      - name: Pin exact original artifact identity and archive digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/15000522105 > /tmp/eer1-artifact.json
          python -c 'import json; a=json.load(open("/tmp/eer1-artifact.json")); assert a["id"]==15000522105 and a["workflow_run"]["id"]==45555613548 and a["size_in_bytes"]==233873730 and a["digest"]=="sha256:107b2bc43e6ff25a5799e253b0ab6ee718ad5b88ef3bb3211d84ad6c20b87a5b" and not a["expired"]'
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/15000522105/zip > /tmp/eer1-original.zip
          echo '107b2bc43e6ff25a5799e253b0ab6ee718ad5b88ef3bb3211d84ad6c20b87a5b  /tmp/eer1-original.zip' | sha256sum -c -
          unzip -q /tmp/eer1-original.zip -d eer1-source
          rm /tmp/eer1-original.zip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-eur-conditional-source-verified
          path: pilot-source
          run-id: 45552716026
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-public-receipt
          path: original-source-history
          run-id: 45396314675
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-original-sealed
          path: original-source-history
          run-id: 45396314675
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-history-extension-sealed-and-receipt
          path: previous-extension
          run-id: 45409527714
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          path: bdp-source
          run-id: 41724643418
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          path: aip-source
          run-id: 41735441128
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hxc1-original-historical-encrypted-source
          path: mde1-hxc1-source
          run-id: 43817213663
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: xmh2-complete-274day-m15-encrypted-source
          path: mde1-xmh2-source
          run-id: 44352570167
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p05-new-live-readonly-authentic-source-sealed
          path: p05-sealed
          run-id: 45134137836
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p05-new-live-readonly-aggregate-public
          path: p05-public
          run-id: 45134137836
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-eur-gap-official-original
          path: prior-gap
          run-id: 45541671931
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owner-eur-rollover-official-original
          path: prior-rollover
          run-id: 45549613144
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: integrated-full-session-custody
          path: integrated-sealed-source
          run-id: 44687919474
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: integrated-full-session-source-public
          path: integrated-source-public
          run-id: 44687919474
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: closed-market-original-ciphertext
          path: closed-market-source
          run-id: 44733062339
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: closed-market-original-source-public
          path: closed-market-source
          run-id: 44733062339
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hxc1-original-historical-encrypted-source
          path: hxc1-original
          run-id: 43817213663
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recent-source-input
          run-id: 45716198383
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recent-source-metadata
          path: recent-metadata
          run-id: 45716198383
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recent-source-plan
          run-id: 45716198383
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recent-source-verified-summary
          run-id: 45716198383
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: recent-source-protected-*
          path: recent-protected
          run-id: 45716198383
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: recent-source-verified-*
          path: recent-verified
          run-id: 45716198383
          github-token: ${{ github.token }}
      - name: Verify immutable archives; no broker collection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m research.owner_pav1_market_time download
      - name: Reconstruct original source once
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: python -m research.owner_eer1_readback --prepare-protection-recovery "$RUNNER_TEMP/eur-private"
      - name: Verify byte identity; integrate existing four-market and conversion evidence
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
        run: python -m research.owner_pav1_market_time materialize --work "$RUNNER_TEMP/eur-private"
      - name: Frozen original books conditional FX settlement; no decision replay
        run: dotnet run --project research/NativePav1FundingRecovery -c Release -- pav-market-funding-input.json pav-market-funding-result.json --market-time
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pav1-market-time-source-and-frozen-book-settlement
          path: |
            pav-market-source.json
            pav-market-funding-input.json
            pav-market-funding-result.json
          if-no-files-found: error
          retention-days: 90
      - name: Seal reusable normalized source checkpoint before evaluation
        continue-on-error: true
        run: python -m research.owner_pav1_market_time checkpoint --work "$RUNNER_TEMP/eur-private"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pav1-market-time-source-checkpoint
          path: market-checkpoint/
          if-no-files-found: warn
          retention-days: 90
      - name: Native common portfolio S0
        run: python -m research.owner_pav1_market_time partition --work "$RUNNER_TEMP/eur-private" --stress 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pav1-market-time-S0
          path: |
            market-partitions/S0/result.json
            market-partitions/S0/selection.json
          if-no-files-found: error
          retention-days: 90
      - name: Native common portfolio S1
        run: python -m research.owner_pav1_market_time partition --work "$RUNNER_TEMP/eur-private" --stress 0.5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pav1-market-time-S1
          path: |
            market-partitions/S1/result.json
            market-partitions/S1/selection.json
          if-no-files-found: error
          retention-days: 90
      - name: Native common portfolio S2
        run: python -m research.owner_pav1_market_time partition --work "$RUNNER_TEMP/eur-private" --stress 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pav1-market-time-S2
          path: |
            market-partitions/S2/result.json
            market-partitions/S2/selection.json
          if-no-files-found: error
          retention-days: 90
      - run: python -m research.owner_pav1_market_time combine
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pav1-market-time-fx-1-complete
          path: market-report/
          if-no-files-found: error
          retention-days: 90
      - name: Seal resumable common books and source checkpoint
        if: always()
        run: python -m research.owner_pav1_market_time checkpoint --work "$RUNNER_TEMP/eur-private"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pav1-market-time-terminal-checkpoint
          path: market-checkpoint/
          if-no-files-found: warn
          retention-days: 90
