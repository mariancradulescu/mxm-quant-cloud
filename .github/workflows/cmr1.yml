name: CMR1 original Pepperstone cash-close predictive economics
on:
  pull_request:
    paths:
      - "research/cmr1.py"
      - "research/cmr1.md"
      - "research/test_cmr1.py"
      - ".github/workflows/cmr1.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cmr1.yml"
permissions:
  contents: read
  actions: read
jobs:
  synthetic-causal-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Verify no lookahead and fixed causal cash-close rule
        run: python -m unittest research.test_cmr1
  original-account-research:
    needs: synthetic-causal-guards
    if: github.event_name == 'push' && github.actor == 'mariancradulescu' && github.ref == 'refs/heads/main'
    environment: mxm-r3-pepperstone-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Bounded authenticated read-only CMR1 historical economic scoring
        run: python -m research.cmr1
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cmr1-us2000-original-account-public-receipt
          path: cmr1-public-receipt.json
          if-no-files-found: error
          retention-days: 90
