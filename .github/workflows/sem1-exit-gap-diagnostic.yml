name: SEM1 fixed-exit observation diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/sem1-exit-gap-diagnostic.yml'
      - 'research/sem1_exit_gap_diagnostic.py'
      - 'research/SEM1_EXIT_GAP_DIAGNOSTIC.md'
      - 'src/Mxm.Replay/NativeSessionBenchmarkCorrection.cs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sem1-exit-gap-diagnostic.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m py_compile research/sem1_exit_gap_diagnostic.py
      - run: dotnet build src/Mxm.Replay -c Release
  original-custody-diagnostic:
    needs: verify
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' && github.run_attempt == '1' &&
      startsWith(github.event.head_commit.message, 'OWNER_SEM1_EXIT_GAP_DIAGNOSTIC_ONCE')
    environment: mxm-r3-custody-v1
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sem1-original-pepperstone-encrypted-source
          run-id: 43207629492
          github-token: ${{ github.token }}
          path: original-sem1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: esd1-original-pepperstone-encrypted-source
          run-id: 43202303802
          github-token: ${{ github.token }}
          path: original-esd1
      - run: python -m research.sem1_exit_gap_diagnostic
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sem1-fixed-exit-technical-diagnostic
          path: |
            sem1-exit-gap-diagnostic-public.json
            session-benchmark-correction-public.json
          if-no-files-found: error
          retention-days: 90
