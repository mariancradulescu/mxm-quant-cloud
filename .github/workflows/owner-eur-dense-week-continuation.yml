name: OWNER contiguous earlier historical monetary source continuation
on:
  pull_request:
    paths:
      - 'research/official_eur_dense_monetary_3.json'
      - 'research/owner_eur_dense_monetary.py'
      - 'research/test_owner_eur_dense_monetary.py'
      - '.github/workflows/owner-eur-dense-week-continuation.yml'
  push:
    branches: [main]
    paths: ['research/official_eur_dense_monetary_3.json']
permissions:
  contents: read
  actions: read
jobs:
  technical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m unittest research.test_owner_eur_dense_monetary
  prepare:
    needs: technical
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'mariancradulescu' && github.run_attempt == 1
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-public-receipt
          run-id: 45396314675
          github-token: ${{ github.token }}
          path: input/original-source-history
      - name: Verify registered original symbols and fixed windows before account access
        run: |
          cp -R input/original-source-history .
          for symbol in EURUSD US500 XAUUSD SpotBrent; do
            for window in W07_MON W07_TUE W07_WED W07_THU W07_FRI; do
              python -m research.owner_eur_dense_monetary plan "$symbol" "$window" --protocol research/official_eur_dense_monetary_3.json
            done
          done
      - run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - run: mv new-recipient-output input/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dense-monetary-custody-input
          path: input/
          retention-days: 7
          if-no-files-found: error
  collect:
    needs: prepare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'mariancradulescu' && github.run_attempt == 1
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        symbol: [EURUSD, US500, XAUUSD, SpotBrent]
        window: [W07_MON, W07_TUE, W07_WED, W07_THU, W07_FRI]
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-existing-oauth-read-only
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dense-monetary-custody-input
      - run: python -m research.owner_eur_dense_monetary capture "${{ matrix.symbol }}" "${{ matrix.window }}" --protocol research/official_eur_dense_monetary_3.json
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dense-monetary-protected-${{ matrix.symbol }}-${{ matrix.window }}
          path: dense-monetary-protected/
          retention-days: 90
          if-no-files-found: error
  verify:
    needs: [prepare, collect]
    if: always() && needs.prepare.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        symbol: [EURUSD, US500, XAUUSD, SpotBrent]
        window: [W07_MON, W07_TUE, W07_WED, W07_THU, W07_FRI]
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dense-monetary-custody-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dense-monetary-protected-${{ matrix.symbol }}-${{ matrix.window }}
          path: dense-monetary-protected
      - run: python -m research.owner_eur_dense_monetary verify "${{ matrix.symbol }}" "${{ matrix.window }}" --protocol research/official_eur_dense_monetary_3.json
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dense-monetary-verified-${{ matrix.symbol }}-${{ matrix.window }}
          path: dense-monetary-verified.json
          retention-days: 90
          if-no-files-found: error
