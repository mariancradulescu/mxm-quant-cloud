name: BTI1 original-custody quote timestamp concentration (not QPI1)
on:
  pull_request:
    paths:
      - 'research/BTI1_TEMPORAL_QUOTE_BURSTINESS_PRESOURCE.md'
      - 'research/bti1_temporal_burstiness.py'
      - 'research/test_bti1_temporal_burstiness.py'
      - '.github/workflows/bti1-original-timing-incremental.yml'
  push:
    branches: [main]
    paths:
      - 'ops/bti1-study-intent.txt'
      - '.github/workflows/bti1-original-timing-incremental.yml'
permissions:
  contents: read
  actions: read

jobs:
  verify-bti1-causality:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      authorized: ${{ steps.owner.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/bti1_temporal_burstiness.py research/test_bti1_temporal_burstiness.py
      - run: python -m unittest research.test_bti1_temporal_burstiness -v
      - name: Exact first-attempt OWNER/main intent only; no closed QPI1 rerun
        id: owner
        shell: bash
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_BTI1_ORIGINAL_TIMING_RESEARCH_ONCE" &&
                "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/bti1-study-intent.txt" &&
                "$(cat ops/bti1-study-intent.txt)" == "OWNER_BTI1_QPI1_SOURCE_ONLY_NEW_FEATURE_NO_CLOSED_REPLAY" ]]; then
            echo 'authorized=true' >> "$GITHUB_OUTPUT"
          fi

  protected-original-timing-evaluation:
    needs: verify-bti1-causality
    if: needs.verify-bti1-causality.outputs.authorized == 'true'
    environment: mxm-r3-custody-v1
    concurrency:
      group: mxm-bti1-original-qpi1-readback-once
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qpi1-original-encrypted-source
          run-id: 43458050084
          github-token: ${{ github.token }}
          path: bti1-source
      - name: Independently verify ALL 645 read-only original request-response packets, then score only BTI1
        run: python -m research.bti1_temporal_burstiness
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bti1-original-quote-timing-incremental-public
          path: bti1-original-timing-incremental-public.json
          retention-days: 90
          if-no-files-found: error
