name: JFC1 ORIGINAL exact JPN225 EUR expected margin and three past BIDASK quote source
on:
  pull_request:
    paths:
      - 'research/JFC1_FROZEN_JPN225_REAL_MARGIN_QUOTES_20261118.md'
      - 'research/jfc1_exact_jpn_source_protocol.json'
      - 'research/jfc1_exact_jpn_original.py'
      - 'research/test_jfc1_exact_jpn_source.py'
      - '.github/workflows/jfc1-original-jpn225-cost-only.yml'
  push:
    branches: [main]
    paths:
      - 'ops/jfc1-original-jpn225-source-once.txt'
permissions:
  contents: read
  actions: read

jobs:
  verify-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      authorized: ${{ steps.owner.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Freeze separate NEW source support protocol before collection
        run: |
          git merge-base --is-ancestor dd600b5dba8451404a414e54a50c65f72e2e83f0 HEAD
          git show dd600b5dba8451404a414e54a50c65f72e2e83f0:research/JFC1_FROZEN_JPN225_REAL_MARGIN_QUOTES_20261118.md >/tmp/jfc1-frozen
          cmp /tmp/jfc1-frozen research/JFC1_FROZEN_JPN225_REAL_MARGIN_QUOTES_20261118.md
      - run: python -m py_compile research/jfc1_exact_jpn_original.py
      - run: python -m unittest research.test_jfc1_exact_jpn_source -v
      - name: One exact OWNER main source-only admission; never PR or generic dispatch
        id: owner
        shell: bash
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_JFC1_ORIGINAL_JPN225_COST_SOURCE_ONLY_ONCE" &&
                "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/jfc1-original-jpn225-source-once.txt" &&
                "$(cat ops/jfc1-original-jpn225-source-once.txt)" == "OWNER_JFC1_JPN225_MARGIN_THREE_PAST_BIDASK_CLOCKS_READONLY_ONCE" ]]; then
             echo 'authorized=true' >> "$GITHUB_OUTPUT"
          fi

  original-recipient:
    needs: [verify-source-contract]
    if: needs.verify-source-contract.outputs.authorized == 'true'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Derive run-bound public recipient from installed custody key, no secret export
        run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jfc1-original-source-public-recipient
          path: new-recipient-output/
          retention-days: 5
          if-no-files-found: error

  original-historical-readonly-collection:
    needs: [verify-source-contract, original-recipient]
    if: needs.verify-source-contract.outputs.authorized == 'true'
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-jfc1-exact-jpn225-original-cost-only-once
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jfc1-original-source-public-recipient
          path: new-source-recipient
      - name: Original-account single exact JPN225 expected EUR margin and BID ASK 3 past clocks; NO orders
        run: python -m research.jfc1_exact_jpn_original
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jfc1-original-jpn225-cost-encrypted-source
          path: jfc1-sealed-output/
          retention-days: 90
          if-no-files-found: error

  original-historical-source-readback:
    needs: [verify-source-contract, original-historical-readonly-collection]
    if: needs.verify-source-contract.outputs.authorized == 'true'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jfc1-original-jpn225-cost-encrypted-source
          path: jfc1-sealed-output
      - name: Independent original-account raw protobuf reconstruction, margin EUR and historical BIDASK samples
        run: python -m research.jfc1_exact_jpn_original --readback
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jfc1-original-jpn225-cost-public-readback
          path: jfc1-public/
          retention-days: 90
          if-no-files-found: error
