name: OWNER breadth eight annual path information
on:
  pull_request:
    paths: ['src/Mxm.PathResearch/**','src/Mxm.Core/NativeClosedPathPrediction.cs','research/owner_breadth_8_annual_path.py','.github/workflows/owner-breadth-8-annual-path.yml']
  push:
    branches: [main]
    paths: ['research/owner_breadth_8_annual_path.py']
permissions:
  contents: read
  actions: read
jobs:
  technical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Mxm.PathResearch -c Release
      - run: dotnet run --project tests/Mxm.Checks -c Release
      - run: python -m py_compile research/owner_breadth_8_annual_path.py
  evaluate:
    needs: technical
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.owner_breadth_8_annual_path --work "$RUNNER_TEMP/breadth-path"
        env:
          GH_TOKEN: ${{ github.token }}
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: breadth-eight-annual-path-information
          path: annual-path-report/
          retention-days: 90
          if-no-files-found: error
