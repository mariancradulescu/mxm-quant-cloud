name: CPE1 authenticated BDP1 contract preflight ONLY (no economics)
on:
  push:
    branches: [main]
    paths:
      - 'ops/cpe1-bdp1-source-only-preflight-20261124.txt'
permissions:
  contents: read
  actions: read
jobs:
  validate-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      authorized: ${{ steps.owner.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m py_compile research/cpe1_bdp1_source_only_preflight.py
      - name: OWNER exact first-addition main source-only marker, no original economics
        id: owner
        shell: bash
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          subject=OWNER_CPE1_BDP1_SOURCE_ONLY_PREFLIGHT_20261124
          marker=ops/cpe1-bdp1-source-only-preflight-20261124.txt
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "$subject" &&
                "$(git diff-tree --no-commit-id --name-status -r HEAD)" == $'A\t'"$marker" &&
                -z "$(git log -1 --format=%H HEAD^ -- "$marker")" &&
                -f "$marker" ]] &&
              cmp -s "$marker" <(printf '%s\n' "$subject"); then
            echo 'authorized=true' >> "$GITHUB_OUTPUT"
          else
            echo 'CPE1 source-only authority gate rejected' >&2
            exit 1
          fi
  bdp1-source-only-preflight:
    needs: validate-source-only
    if: needs.validate-source-only.outputs.authorized == 'true'
    environment: mxm-r3-custody-v1
    concurrency:
      group: cpe1-bdp1-original-source-only-preflight
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          run-id: 41724643418
          github-token: ${{ github.token }}
          path: bdp-source
      - name: Authenticate original BDP1 contract fields only (no economic run)
        run: python -m research.cpe1_bdp1_source_only_preflight
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cpe1-bdp1-authentic-contract-source-only-preflight-main
          path: cpe1-bdp1-preflight/
          retention-days: 90
          if-no-files-found: error
