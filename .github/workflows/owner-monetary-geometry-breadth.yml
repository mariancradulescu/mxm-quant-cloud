name: OWNER monetary geometry and 21-market breadth
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'research/monetary_geometry_breadth_1.json', 'research/owner_monetary_geometry_breadth.py', 'research/test_monetary_geometry_breadth.py', '.github/workflows/owner-monetary-geometry-breadth.yml']
  push:
    branches: [main]
    paths: ['research/monetary_geometry_breadth_1.json']
permissions:
  contents: read
  actions: read
jobs:
  technical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Mxm.Replay -c Release
      - run: python -m unittest research.test_monetary_geometry_breadth research.test_monetary_entry_quality research.test_monetary_opportunity_discovery research.test_owner_eur_recent_funded
      - run: dotnet run --project tests/Mxm.Checks -c Release
  screen:
    needs: technical
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'mariancradulescu' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    environment: mxm-r3-custody-v1
    timeout-minutes: 350
    env:
      MXM_ECONOMIC_REUSE_FRAMES: 1
    steps:
