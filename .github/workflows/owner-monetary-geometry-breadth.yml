  combine:
    needs: screen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: geometry-breadth-*
          path: partitions
      - name: Reconcile complete breadth and geometry study
        run: |
          python - <<'PY'
          from pathlib import Path
          from research.merge_eur_scenarios import read,exact_json
          roots=sorted(Path("partitions").glob("*/opportunity-result.json"))
          assert len(roots)==7
          first=roots[0].parent
          plan=read(first/"opportunity-protocol.json")
          results=[]
          for path in roots:
              for name in ("opportunity-protocol.json","opportunity-source.json"):
                  assert (path.parent/name).read_bytes()==(first/name).read_bytes()
              result=read(path)
              assert result["RegisteredMarketCount"]==21 and len(result["HeldOut"])==15
              results.append(result)
          assert {r["Mechanism"] for r in results}=={v["Mechanism"] for v in plan["Variants"]}
          out=Path("geometry-report");out.mkdir()
          for name in ("opportunity-protocol.json","opportunity-source.json"):
              (out/name).write_bytes((first/name).read_bytes())
          (out/"economic-opportunities.json").write_text(exact_json(dict(Study=plan["Study"],Results=results,
              SharedPortfolioEvaluations=0,IndependentConfirmationCertified=False,Orders=0,CloudActivated=False))+"\n")
          for r in results: print(r["Mechanism"],r["SelectedDecision"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: monetary-geometry-breadth-1-complete
          path: geometry-report/
          if-no-files-found: error
          retention-days: 90
