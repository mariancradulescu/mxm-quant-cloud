name: Integrated economic discovery - original full-session source
on:
  pull_request:
    paths:
      - 'research/INTEGRATED_ECONOMIC_DISCOVERY_20261120.md'
      - 'research/integrated_market_source.py'
      - '.github/workflows/integrated-economic-source.yml'
  push:
    branches: [main]
    paths:
      - 'ops/integrated-full-session-source-once.txt'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.marker.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Verify frozen scope and original-account decoder
        run: |
          echo '165e9eb04471ebc684581a667114c0b67bac9be162a8dfb9d0233648baf3a4c8  research/INTEGRATED_ECONOMIC_DISCOVERY_20261120.md' | sha256sum -c
          python -m unittest research.test_hxc1_historical_source
          python -m py_compile research/integrated_market_source.py
          python -c 'from research.integrated_market_source import UNIVERSE, WARMUP, START, END; assert len(UNIVERSE) == 6 and WARMUP < START < END'
      - name: Verify exact first-addition source marker
        id: marker
        shell: bash
        run: |
          marker=ops/integrated-full-session-source-once.txt
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" && "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_INTEGRATED_FULL_SESSION_READ_ONLY_SOURCE_ONCE" &&
                "$(git diff-tree --no-commit-id --name-status -r HEAD)" == $'A\t'"$marker" &&
                -z "$(git log -1 --format=%H HEAD^ -- "$marker")" &&
                "$(cat "$marker")" == "OWNER_INTEGRATED_FULL_SESSION_READ_ONLY_SOURCE_ONCE" ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          fi
  recipient:
    needs: verify
    if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' && needs.verify.outputs.authorized == 'true' }}
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrated-source-recipient
          path: new-recipient-output/
          retention-days: 3
          if-no-files-found: error
  collect:
    needs: [verify, recipient]
    if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' && needs.verify.outputs.authorized == 'true' }}
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-existing-oauth-read-only
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: integrated-source-recipient
          path: new-source-recipient
      - name: Capture original contracts, native bars and full active-hour tick history
        run: python -m research.integrated_market_source
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integrated-full-session-custody
          path: integrated-sealed-source/
          compression-level: 0
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integrated-full-session-source-public
          path: integrated-source-public/
          retention-days: 90
          if-no-files-found: warn
