name: EURJPY parity original currency readback
on:
  pull_request:
    paths:
      - 'research/eurjpy_parity_currency_readback.py'
      - 'research/EURJPY_QUOTE_PARITY.md'
      - '.github/workflows/eurjpy-parity-currency-readback.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/eurjpy-parity-currency-readback.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m py_compile research/eurjpy_parity_currency_readback.py
  protected-original-source-readback:
    needs: verify
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' && github.run_attempt == '1' &&
      startsWith(github.event.head_commit.message, 'OWNER_EURJPY_CURRENCY_READBACK_ONCE')
    environment: mxm-r3-custody-v1
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: eurjpy-quote-parity-encrypted
          run-id: 43440166826
          github-token: ${{ github.token }}
          path: original-parity
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: eurjpy-quote-parity-public
          run-id: 43440166826
          github-token: ${{ github.token }}
          path: original-parity-public
      - name: Correct JPY monetary attribution on sealed source
        run: python -m research.eurjpy_parity_currency_readback
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eurjpy-parity-corrected
          path: eurjpy-parity-corrected.json
          if-no-files-found: error
          retention-days: 90
