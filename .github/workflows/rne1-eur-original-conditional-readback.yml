name: RNE1 original USD-EUR conditional money and quote-path readback
on:
  pull_request:
    paths:
      - 'research/rne1_eur_protected_exact_reconciliation.py'
      - 'research/test_rne1_eur_protected_exact_reconciliation.py'
      - '.github/workflows/rne1-eur-original-conditional-readback.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rne1-eur-original-conditional-readback.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/rne1_eur_protected_exact_reconciliation.py research/test_rne1_eur_protected_exact_reconciliation.py
      - run: python -m unittest research.test_rne1_eur_protected_exact_reconciliation -v
  original-protected-money-readback:
    needs: verify
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' && github.run_attempt == '1' &&
      startsWith(github.event.head_commit.message, 'OWNER_RNE1_EUR_READBACK_ONCE')
    environment: mxm-r3-custody-v1
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rne1-original-encrypted-source
          run-id: 43468457518
          github-token: ${{ github.token }}
          path: original-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rne1-original-public-economic
          run-id: 43468457518
          github-token: ${{ github.token }}
          path: original-public
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rne1-eur-original-encrypted-quotes
          run-id: 43472594458
          github-token: ${{ github.token }}
          path: dense-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rne1-eur-original-source-coverage
          run-id: 43472594458
          github-token: ${{ github.token }}
          path: dense-public
      - name: Verify BOTH original custodial tapes; only then compute EUR
        run: python -m research.rne1_eur_protected_exact_reconciliation
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rne1-original-eur-conditional-money-readback
          path: rne1-original-eur-conditional-readback.json
          if-no-files-found: error
          retention-days: 90
