name: OWNER causal recency competition economic development
on:
  pull_request:
    paths:
      - 'research/causal_recency_competition_1.json'
      - 'research/owner_causal_recency_competition.py'
      - '.github/workflows/owner-causal-recency-competition.yml'
      - 'src/Mxm.Replay/**'
  push:
    branches: [main]
    paths: ['research/causal_recency_competition_1.json']
permissions:
  contents: read
  actions: read
jobs:
  technical:
    runs-on: ubuntu-24.04
    outputs:
      new_study: ${{ steps.scope.outputs.new_study }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = push ] && git diff --diff-filter=A --name-only "$BEFORE" "$GITHUB_SHA" | grep -Fxq research/causal_recency_competition_1.json; then
            echo "new_study=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_study=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m research.owner_causal_recency_competition check
      - run: dotnet build src/Mxm.Replay -c Release
      - run: dotnet run --project tests/Mxm.Checks -c Release
  evaluate:
    needs: technical
    if: github.event_name == 'push' && needs.technical.outputs.new_study == 'true'
    strategy:
      fail-fast: false
      matrix:
        scope: [earlier, recent]
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-public-receipt
          path: original-source-history
          run-id: 45396314675
          github-token: ${{ github.token }}
      - run: python -m research.owner_causal_recency_competition prepare --scope ${{ matrix.scope }} --work "$RUNNER_TEMP/net-private"
        env:
          GH_TOKEN: ${{ github.token }}
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - run: python -m research.owner_causal_recency_competition evaluate --work "$RUNNER_TEMP/net-private"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: causal-recency-${{ matrix.scope }}-economic
          path: causal-recency-report/
          retention-days: 90
          if-no-files-found: warn
      - if: always()
        run: python -m research.owner_causal_recency_competition conserve
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: causal-recency-${{ matrix.scope }}-sealed-books
          path: causal-recency-sealed-books/
          retention-days: 90
          if-no-files-found: warn
