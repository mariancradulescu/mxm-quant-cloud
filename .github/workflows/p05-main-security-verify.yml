name: P05 protected LIVE read-only collector proof - no network
on:
  push:
    branches: [security/p05-live-readonly-main-20261123]
    paths:
      - 'research/p05_safe_transport.py'
      - 'research/test_p05_readonly_wire.py'
      - 'research/p05_live_source.py'
      - 'research/test_p05_live_source.py'
      - 'research/p05_source_economic_gate.py'
      - 'research/test_p05_source_economic_gate.py'
      - '.github/workflows/p05-live-readonly-source.yml'
      - '.github/workflows/p05-main-security-verify.yml'
  pull_request:
    paths:
      - 'research/p05_safe_transport.py'
      - 'research/test_p05_readonly_wire.py'
      - 'research/p05_live_source.py'
      - 'research/test_p05_live_source.py'
      - 'research/p05_source_economic_gate.py'
      - 'research/test_p05_source_economic_gate.py'
      - '.github/workflows/p05-live-readonly-source.yml'
      - '.github/workflows/p05-main-security-verify.yml'
permissions:
  contents: read
jobs:
  read-only-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m unittest research.test_p05_readonly_wire research.test_p05_live_source research.test_p05_source_economic_gate -v
      - run: python -m py_compile research/p05_safe_transport.py research/p05_live_source.py research/p05_source_economic_gate.py
