name: GCR1 original A1 Pepperstone EUR (one-shot OWNER-only read-only)

on:
  pull_request:
    paths:
      - 'research/GCR1_OWNER_PRESOURCE_ADDENDUM_A1.md'
      - 'research/gcr1_original_eur.py'
      - 'research/gcr1_eur_model.py'
      - 'research/test_gcr1_eur_model.py'
      - 'research/gcr1_macro_signal.py'
      - '.github/workflows/gcr1-original-eur.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gcr1-original-eur.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/gcr1_macro_signal.py research/gcr1_eur_model.py research/gcr1_original_eur.py research/test_gcr1_eur_model.py
      - run: python -m unittest research.test_gcr1_macro_signal research.test_gcr1_eur_model -v

  custody-recipient:
    needs: verify
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' && github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'OWNER_GCR1_ORIGINAL_ONCE')
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gcr1-a1-one-time-custody-recipient
          path: new-recipient-output/
          retention-days: 30
          if-no-files-found: error

  original-pepperstone-readonly:
    needs: custody-recipient
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-existing-oauth-read-only
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gcr1-a1-one-time-custody-recipient
          path: new-recipient-output
      - name: Preserve all fixed GCR1 original M5 and BID/ASK source before EUR scoring
        run: python -m research.gcr1_original_eur
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gcr1-a1-original-encrypted-source
          path: gcr1-original-protected.v2.enc
          retention-days: 90
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gcr1-a1-original-public-eur
          path: gcr1-original-public-eur.json
          retention-days: 90
          if-no-files-found: error
