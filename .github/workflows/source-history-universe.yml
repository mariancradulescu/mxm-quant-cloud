name: OWNER source-only history and universe inventory
on:
  push:
    branches: [main]
    paths:
      - 'ops/source-history-universe-once.txt'
  pull_request:
    paths:
      - 'research/source_history_universe.py'
      - 'research/test_source_history_universe.py'
      - '.github/workflows/source-history-universe.yml'
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      authorized: ${{ steps.history_gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Prove no order, cancel, amend, close, or raw envelope can reach socket
        run: |
          python -m unittest research.test_p05_readonly_wire research.test_p05_live_source research.test_funding_provenance_point_source research.test_source_history_universe -v
          python -m py_compile research/p05_live_source.py research/p05_safe_transport.py research/funding_provenance_point_source.py research/source_history_universe.py
      - name: Authorize new historical source inventory only, never an economic evaluation
        shell: bash
        id: history_gate
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          marker=ops/source-history-universe-once.txt
          subject=OWNER_SOURCE_HISTORY_UNIVERSE_20261124
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$(git log -1 --format=%s)" == "$subject" &&
                "$(git diff-tree --no-commit-id --name-status -r HEAD)" == $'A\t'"$marker" &&
                -z "$(git log -1 --format=%H HEAD^ -- "$marker")" &&
                -f "$marker" ]] &&
              cmp -s "$marker" <(printf '%s\n' "$subject"); then
            echo 'authorized=true' >> "$GITHUB_OUTPUT"
          fi
  recipient:
    needs: preflight
    if: ${{ needs.preflight.outputs.authorized == 'true' }}
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Derive public source recipient from existing installed custody key
        run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p05-new-source-recipient-public
          path: new-recipient-output/
          retention-days: 2
          if-no-files-found: error
  source:
    needs: [preflight,recipient]
    if: ${{ needs.preflight.outputs.authorized == 'true' }}
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-existing-oauth-read-only
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p05-new-source-recipient-public
          path: new-source-recipient
      - name: Capture historical deals, current full roster and bounded timeframe tranche
        run: python -m research.source_history_universe
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-history-original-sealed
          path: source-history-universe/original.sealed
          retention-days: 90
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-history-public-receipt
          path: source-history-universe/receipt.json
          retention-days: 90
          if-no-files-found: error

  readback:
    needs: [preflight,source]
    if: ${{ needs.preflight.outputs.authorized == 'true' && needs.source.result == 'success' }}
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-original-sealed
          path: source-history-universe
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-public-receipt
          path: source-history-universe
      - name: Protected raw packet readback, no broker access
        run: python -m research.source_history_universe --readback
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-history-protected-readback
          path: source-history-readback.json
          retention-days: 90
          if-no-files-found: error
