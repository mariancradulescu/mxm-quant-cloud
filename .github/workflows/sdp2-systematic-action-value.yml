name: SDP2 systematic chronological action-value discovery ORIGINAL
on:
  pull_request:
    paths:
      - 'research/SDP2_SYSTEMATIC_ACTION_VALUE_PROTOCOL_20261117.md'
      - 'research/sdp2_systematic_action_value.py'
      - 'research/test_sdp2_systematic_action_value.py'
      - 'src/Mxm.Replay/Sdp2ActionValueResearch.cs'
      - 'src/Mxm.Replay/Program.cs'
      - '.github/workflows/sdp2-systematic-action-value.yml'
  push:
    branches: [main]
    paths:
      - 'ops/sdp2-f1-original-once.txt'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      owner_once: ${{ steps.owner.outputs.owner_once }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt numpy==2.3.5 scikit-learn==1.8.0
      - name: Preserve ex-ante protocol identity
        run: |
          git merge-base --is-ancestor c7891655084de2f87dbf9af41f841cf6f1d0a41a HEAD
          git show c7891655084de2f87dbf9af41f841cf6f1d0a41a:research/SDP2_SYSTEMATIC_ACTION_VALUE_PROTOCOL_20261117.md > /tmp/sdp2-frozen.md
          cmp /tmp/sdp2-frozen.md research/SDP2_SYSTEMATIC_ACTION_VALUE_PROTOCOL_20261117.md
      - run: dotnet build src/Mxm.Replay -c Release
      - run: python -m unittest research.test_sdp2_systematic_action_value -v
        env:
          SDP2_DOTNET: dotnet
      - run: dotnet run --project tests/Mxm.Checks -c Release
      - name: Exact one-time OWNER research intent
        id: owner
        shell: bash
        run: |
          echo 'owner_once=false' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF" == 'refs/heads/main' && "$GITHUB_ACTOR" == 'mariancradulescu' && "$GITHUB_RUN_ATTEMPT" == '1' && "$(git log -1 --format=%s)" == 'OWNER_SDP2_F1_SOURCE_PRICE_UNITS_ONCE' && "$(git diff-tree --no-commit-id --name-only -r HEAD)" == 'ops/sdp2-f1-original-once.txt' && "$(cat ops/sdp2-f1-original-once.txt)" == 'OWNER_SDP2_F1_CORRECT_100000_SOURCE_UNITS_NO_MODEL_RETUNE_ONCE' ]]; then
            echo 'owner_once=true' >> "$GITHUB_OUTPUT"
          fi
  original:
    needs: verify
    if: ${{ needs.verify.outputs.owner_once == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: mxm-r3-custody-v1
    concurrency:
      group: mxm-sdp2-original-once
      cancel-in-progress: false
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt numpy==2.3.5 scikit-learn==1.8.0
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          run-id: 41724643418
          github-token: ${{ github.token }}
          path: bdp-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          run-id: 41735441128
          github-token: ${{ github.token }}
          path: aip-source
      - name: Authenticate original sources and execute frozen SDP2 once
        run: python -m research.sdp2_systematic_action_value
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - name: Preserve original public results, including completed stages on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdp2-original-predictive-native-eur300
          path: sdp2-original-*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve encrypted original native inputs for technical recovery only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdp2-encrypted-original-native-inputs
          path: sdp2-native-input-*.enc
          if-no-files-found: warn
          retention-days: 90
      - if: success()
        run: sha256sum research/SDP2_SYSTEMATIC_ACTION_VALUE_PROTOCOL_20261117.md research/sdp2_systematic_action_value.py src/Mxm.Replay/Sdp2ActionValueResearch.cs sdp2-original-*.json
