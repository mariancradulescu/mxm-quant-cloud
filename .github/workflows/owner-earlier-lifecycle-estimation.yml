name: OWNER earlier 13-week lifecycle estimator comparison
on:
  pull_request:
    paths:
      - 'research/owner_earlier_lifecycle_estimation.py'
      - 'research/verified_research_cache.py'
      - 'research/test_causal_management_choice.py'
      - '.github/workflows/owner-earlier-lifecycle-estimation.yml'
      - 'src/Mxm.Core/**'
      - 'src/Mxm.Replay/**'
      - 'tests/Mxm.Checks/**'
  push:
    branches: [main]
    paths: ['research/owner_earlier_lifecycle_estimation.py']
permissions:
  contents: read
  actions: read
jobs:
  technical:
    runs-on: ubuntu-24.04
    outputs:
      new_study: ${{ steps.scope.outputs.new_study }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = push ] && git diff --diff-filter=A --name-only "$BEFORE" "$GITHUB_SHA" | grep -Fxq research/owner_earlier_lifecycle_estimation.py; then
            echo "new_study=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_study=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m research.owner_earlier_lifecycle_estimation check
      - run: dotnet build src/Mxm.Replay -c Release
      - run: dotnet build src/Mxm.Cloud -c Release
      - run: dotnet build research/NativeFundingSettlement -c Release
      - run: dotnet run --project tests/Mxm.Checks -c Release
      - run: python -m unittest research.test_causal_management_choice research.test_pav1_market_time research.test_funding_latest_prefix
  evaluate:
    needs: technical
    if: github.event_name == 'push' && needs.technical.outputs.new_study == 'true'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-public-receipt
          path: original-source-history
          run-id: 45396314675
          github-token: ${{ github.token }}
      - name: Materialize previously verified earlier 13-week source once
        run: python -m research.owner_earlier_lifecycle_estimation prepare --work "$RUNNER_TEMP/earlier-private"
        env:
          GH_TOKEN: ${{ github.token }}
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - name: Seal reusable earlier normalized source before evaluation
        run: python -m research.owner_earlier_lifecycle_estimation cache --work "$RUNNER_TEMP/earlier-private"
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: earlier-lifecycle-estimation-normalized-source
          path: earlier-normalized-source/
          retention-days: 90
          if-no-files-found: error
      - name: Execute eighteen new common-book evaluations
        run: python -m research.owner_earlier_lifecycle_estimation evaluate --work "$RUNNER_TEMP/earlier-private"
      - name: Publish economic results and progress
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: earlier-lifecycle-estimation-1-economic
          path: earlier-report/
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve only the new book and observer checkpoints
        if: always()
        run: python -m research.owner_earlier_lifecycle_estimation conserve
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: earlier-lifecycle-estimation-1-sealed-books
          path: earlier-sealed-books/
          retention-days: 90
          if-no-files-found: warn
