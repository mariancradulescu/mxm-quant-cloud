name: CAC1 original cash-close ETF price-pressure matched EUR economics
on:
  pull_request:
    paths:
      - 'research/CAC1_US_CASH_CLOSE_FLOW.md'
      - 'research/cac1_us_cash_close.py'
      - 'research/test_cac1_us_cash_close.py'
      - '.github/workflows/cac1-us-cash-close-eur.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cac1-us-cash-close-eur.yml'
      - 'ops/cac1-once-intent.txt'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/cac1_us_cash_close.py research/test_cac1_us_cash_close.py
      - run: python -m unittest research.test_cac1_us_cash_close -v
  custody-recipient:
    needs: verify
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' && github.run_attempt == '1' &&
      startsWith(github.event.head_commit.message, 'OWNER_CAC1_CASH_CLOSE_ORIGINAL_ONCE')
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cac1-once-recipient
          path: new-recipient-output/
          if-no-files-found: error
          retention-days: 30
  original-pepperstone-readonly-economic-study:
    needs: custody-recipient
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-existing-oauth-read-only
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cac1-once-recipient
          path: new-recipient-output
      - name: Capture original broker M5 and signed ETF/FX quotes; encrypt before scoring matched EUR
        run: python -m research.cac1_us_cash_close
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cac1-original-encrypted-source
          path: cac1-original-protected.v2.enc
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cac1-original-public-eur-economic
          path: cac1-original-public-economic.json
          if-no-files-found: error
          retention-days: 90
