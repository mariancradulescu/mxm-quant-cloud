name: IVP1 original VIX equity-risk source-only 50-clock feasibility pilot
on:
  pull_request:
    paths:
      - 'research/ivp1_original_presignal_pilot.py'
      - 'research/test_ivp1_presignal_pilot.py'
      - '.github/workflows/ivp1-original-source-only.yml'
  push:
    branches: [main]
    paths:
      - 'ops/ivp1-original-pilot-once.txt'
      - '.github/workflows/ivp1-original-source-only.yml'
permissions:
  contents: read
  actions: read
jobs:
  validate-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      authorized: ${{ steps.owner.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/ivp1_original_presignal_pilot.py research/test_ivp1_presignal_pilot.py
      - run: python -m unittest research.test_ivp1_presignal_pilot -v
      - name: Exact owner first-attempt main marker gate for new read-only VIX pilot
        id: owner
        shell: bash
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_IVP1_OPTIONS_VOL_US500_SOURCE_PILOT_ONCE" &&
                "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/ivp1-original-pilot-once.txt" &&
                "$(cat ops/ivp1-original-pilot-once.txt)" == "OWNER_IVP1_50_CONTEXT_SOURCE_FEASIBILITY_NO_FORWARD_NET" ]]; then
              echo 'authorized=true' >> "$GITHUB_OUTPUT"
          fi
  recipient-from-existing-custody:
    needs: validate-source-only
    if: ${{ needs.validate-source-only.outputs.authorized == 'true' }}
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ivp1-original-pilot-recipient
          path: new-recipient-output/
          retention-days: 5
          if-no-files-found: error
  original-vix-broker-source-no-economic-outcome:
    needs: [validate-source-only, recipient-from-existing-custody]
    if: ${{ needs.validate-source-only.outputs.authorized == 'true' }}
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-ivp1-original-vix-source-feasibility-exact-once
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ivp1-original-pilot-recipient
          path: new-recipient-output
      - name: Authenticate original VIX predecision endpoint and sealed future QUOTE availability, never a future payoff
        run: python -m research.ivp1_original_presignal_pilot
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ivp1-original-vix-scope-view-encrypted
          path: ivp1-original-pilot-source.v2.enc
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ivp1-original-preoutcome-support-public
          path: ivp1-original-pilot-public.json
          retention-days: 90
          if-no-files-found: error
