name: GCR1 pre-source causal classifier checks
on:
  pull_request:
    paths:
      - 'research/GCR1_COPPER_GOLD_AUD_MACRO_DIFFUSION.md'
      - 'research/gcr1_macro_signal.py'
      - 'research/test_gcr1_macro_signal.py'
      - '.github/workflows/gcr1-macro-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m py_compile research/gcr1_macro_signal.py research/test_gcr1_macro_signal.py
      - run: python -m unittest research.test_gcr1_macro_signal -v
