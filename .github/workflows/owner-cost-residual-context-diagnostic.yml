name: OWNER causal cost residual diagnostic on verified contextual labels
on:
  pull_request:
    paths: ['research/owner_cost_residual_context_diagnostic.py', '.github/workflows/owner-cost-residual-context-diagnostic.yml']
  push:
    branches: [main]
    paths: ['research/owner_cost_residual_context_diagnostic.py']
permissions:
  contents: read
  actions: read
jobs:
  technical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.owner_cost_residual_context_diagnostic check
  evaluate:
    needs: technical
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Restore only mature contextual labels and compare cost repricing
        run: python -m research.owner_cost_residual_context_diagnostic evaluate
        env:
          GH_TOKEN: ${{ github.token }}
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cost-residual-context-diagnostic
          path: residual-context-report/
          retention-days: 90
          if-no-files-found: error
