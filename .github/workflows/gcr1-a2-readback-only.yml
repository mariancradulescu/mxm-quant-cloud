name: GCR1 A2 original bounded custody readback recovery F1 (NO BROKER)
on:
  pull_request:
    paths:
      - 'research/gcr1_reused_source_readback.py'
      - 'research/test_gcr1_a2_readback_recovery.py'
      - 'docs/GCR1_A2_POSTSOURCE_TECHNICAL_READBACK_RECOVERY_20261115.md'
      - '.github/workflows/gcr1-a2-readback-only.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gcr1-a2-readback-only.yml'
      - 'research/gcr1_reused_source_readback.py'
      - 'docs/GCR1_A2_READBACK_TECHNICAL_F2_20261115.md'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/gcr1_reused_source_readback.py research/test_gcr1_a2_readback_recovery.py
      - run: python -m unittest research.test_gcr1_macro_signal research.test_gcr1_eur_model research.test_gcr1_a2_readback_recovery -v

  recover-original-without-broker:
    needs: verify
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' && github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'OWNER_GCR1_A2_READBACK_ONLY')
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          run-id: 41724643418
          github-token: ${{ github.token }}
          path: bdp1-original-sealed
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gcr1-a2-original-encrypted-source
          run-id: 43723906148
          github-token: ${{ github.token }}
          path: gcr1-a2-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gcr1-a2-original-source-public
          run-id: 43723906148
          github-token: ${{ github.token }}
          path: gcr1-a2-public
      - name: Independently verify original sources and exact parser-only F1, seal composite, then score EUR
        run: python -m research.gcr1_reused_source_readback
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gcr1-original-sources-composite-after-bounded-readback
          path: gcr1-a2-composite-source.v2.enc
          retention-days: 90
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gcr1-original-financial-result-f1
          path: gcr1-original-public-eur.json
          retention-days: 90
          if-no-files-found: error
