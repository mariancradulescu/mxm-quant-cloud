name: VIA1 original impulse absorption prospectively frozen
on:
  pull_request:
    paths:
      - 'research/VIA1_IMPULSE_ABSORPTION.md'
      - 'research/via1_impulse_absorption.py'
      - 'research/test_via1_impulse_absorption.py'
      - '.github/workflows/via1-impulse-absorption.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/via1-impulse-absorption.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m py_compile research/via1_impulse_absorption.py research/test_via1_impulse_absorption.py
      - run: python -m unittest research.test_via1_impulse_absorption
  preserved-nxe1-readonly-replay:
    needs: verify
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' && github.run_attempt == '1' &&
      startsWith(github.event.head_commit.message, 'OWNER_VIA1_IMPULSE_ABSORPTION_ONCE')
    environment: mxm-r3-custody-v1
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nxe1-original-pepperstone-encrypted-source
          run-id: 43377275493
          github-token: ${{ github.token }}
          path: original-nxe1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nxe1-original-pepperstone-public-economic-receipt
          run-id: 43377275493
          github-token: ${{ github.token }}
          path: original-nxe1-public
      - name: Reuse sealed source for new causal VIA1 policy (no broker access)
        run: python -m research.via1_impulse_absorption
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: via1-original-exposed-public
          path: via1-impulse-absorption-public.json
          if-no-files-found: error
          retention-days: 90
