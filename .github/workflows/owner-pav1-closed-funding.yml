name: OWNER immutable PAV1 closed funding recovery
on:
  pull_request:
    paths: ['research/pav1_closed_funding_recovery_1.json', 'research/owner_pav1_closed_funding.py', 'research/test_pav1_closed_funding.py', 'research/NativePav1FundingRecovery/**', '.github/workflows/owner-pav1-closed-funding.yml']
  push:
    branches: [main]
    paths: ['research/pav1_closed_funding_recovery_1.json']
permissions:
  contents: read
  actions: read
jobs:
  technical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build research/NativePav1FundingRecovery -c Release
      - run: python -m unittest research.test_pav1_closed_funding
  prepare:
    needs: technical
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'mariancradulescu' && github.run_attempt == 1
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recent-source-metadata
          path: recent-metadata
          run-id: 45716198383
          github-token: ${{ github.token }}
      - run: python -m research.owner_pav1_closed_funding prepare
        env:
          GH_TOKEN: ${{ github.token }}
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - run: python -m research.custody_new
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pav1-closed-funding-input
          path: |
            pav1-funding-plan.json
            new-recipient-output/
          if-no-files-found: error
          retention-days: 90
  capture:
    needs: prepare
    environment: mxm-r3-pepperstone-v1
    concurrency:
      group: mxm-existing-oauth-read-only
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pav1-closed-funding-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-public-receipt
          path: original-source-history
          run-id: 45396314675
          github-token: ${{ github.token }}
      - run: python -m research.owner_pav1_closed_funding capture
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pav1-closed-funding-original-protected
          path: pav1-funding-protected/
          if-no-files-found: error
          retention-days: 90
  verify:
    needs: capture
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pav1-closed-funding-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pav1-closed-funding-original-protected
          path: pav1-funding-protected
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-public-receipt
          path: original-source-history
          run-id: 45396314675
          github-token: ${{ github.token }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build research/NativePav1FundingRecovery -c Release
      - run: python -m research.owner_pav1_closed_funding verify
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - run: dotnet research/NativePav1FundingRecovery/bin/Release/net8.0/NativePav1FundingRecovery.dll pav1-funding-native-input.json pav1-funding-native-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pav1-closed-funding-recovery-1-verified
          path: |
            pav1-funding-native-result.json
            pav1-funding-native-input.json
          if-no-files-found: error
          retention-days: 90
