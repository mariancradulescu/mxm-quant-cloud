name: MVE1 original BDP1 AIP1 multivariate event predictive EUR once
on:
  pull_request:
    paths:
      - 'research/mve1_protocol.json'
      - 'research/mve1_event_interaction.py'
      - 'research/mve1_multitarget_model.py'
      - 'research/mve1_authentic_eur.py'
      - 'research/test_mve1_event_interaction.py'
      - '.github/workflows/mve1-original-events.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mve1-original-events.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt numpy==2.2.6
      - run: python -m py_compile research/mve1_event_interaction.py research/mve1_multitarget_model.py research/mve1_authentic_eur.py research/test_mve1_event_interaction.py
      - run: python -m unittest research.test_mve1_event_interaction -v

  protected-original-event-multivariate-economics:
    needs: verify
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' && github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'OWNER_MVE1_ORIGINAL_EVENT_ONCE')
    environment: mxm-r3-custody-v1
    concurrency:
      group: mxm-mve1-original-source-one-shot
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt numpy==2.2.6
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          run-id: 41724643418
          github-token: ${{ github.token }}
          path: bdp-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          run-id: 41735441128
          github-token: ${{ github.token }}
          path: aip-source
      - name: Exact sealed original BDP1 AIP1 audit, event predictive holdout, current-term euro economics
        run: python -m research.mve1_authentic_eur
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
          OPENBLAS_NUM_THREADS: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mve1-original-12assets-ohlcv-continuous-interaction-multitarget-eur
          path: mve1-original-12asset-multivariate-predictive-economic.json
          retention-days: 90
          if-no-files-found: error
