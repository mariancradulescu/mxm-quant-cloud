name: DLR1 cold reuse authenticated 52-week USD FX gold original source gross economics
on:
  pull_request:
    paths:
      - 'research/DLR1_USD_FUNDING_COHERENT_OPEN.md'
      - 'research/dlr1_bdp1_original_usd_macro_reuse.py'
      - 'research/test_dlr1_bdp1_original_usd_macro_reuse.py'
      - '.github/workflows/dlr1-existing-original-bdp1-gross.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dlr1-existing-original-bdp1-gross.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m py_compile research/dlr1_bdp1_original_usd_macro_reuse.py research/test_dlr1_bdp1_original_usd_macro_reuse.py
      - run: python -m unittest research.test_dlr1_bdp1_original_usd_macro_reuse -v
  protected-bdp1-cold-original-economic-research:
    needs: verify
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' && github.run_attempt == '1' &&
      startsWith(github.event.head_commit.message, 'OWNER_DLR1_REUSE_BDP1_ONCE')
    environment: mxm-r3-custody-v1
    permissions:
      contents: read
      actions: read
    concurrency:
      group: mxm-dlr1-original-bdp1-52weeks-once
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          run-id: 41724643418
          github-token: ${{ github.token }}
          path: bdp1-original
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: integrated-discovery-program-public-only
          run-id: 41724643418
          github-token: ${{ github.token }}
          path: bdp1-public
      - name: Original BDP1 custody verified then new DLR1 causal USD-gold research on original 52 week M5 only
        run: python -m research.dlr1_bdp1_original_usd_macro_reuse
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlr1-authentic-original-bdp1-52week-gross-economic-verdict
          path: dlr1-original-authenticated-52week-gross.json
          if-no-files-found: error
          retention-days: 90
