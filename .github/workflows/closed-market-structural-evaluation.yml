name: Closed market structural opportunities - native common portfolio
on:
  pull_request:
    paths:
      - '.github/workflows/closed-market-structural-evaluation.yml'
      - 'research/CLOSED_MARKET_OPPORTUNITIES_20261120.md'
      - 'research/closed_market_structural_evaluation.py'
      - 'src/Mxm.Core/NativeStructural*.cs'
  push:
    branches: [main]
    paths:
      - 'ops/closed-market-structural-evaluation-once.txt'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.intent.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: |
            8.0.x
            6.0.x
      - run: dotnet run --project tests/Mxm.Checks -c Release
      - run: dotnet build src/Mxm.Replay -c Release
      - run: dotnet build src/Mxm.Cloud -c Release
      - name: Verify frozen structural protocol and source-code ordering
        run: |
          echo '77806dc13f0fdb6514698c698f3b63e8d27d5ac1fb33beb5269ed8fac2e68332  research/CLOSED_MARKET_OPPORTUNITIES_20261120.md' | sha256sum -c
          git merge-base --is-ancestor 26f74f4807356cd783658812f7cf8b2e56bb2ae8 HEAD
          git diff --exit-code 26f74f4807356cd783658812f7cf8b2e56bb2ae8 HEAD -- research/CLOSED_MARKET_OPPORTUNITIES_20261120.md
          python3 -m py_compile research/closed_market_bar_source.py research/closed_market_context_readback.py research/closed_market_structural_evaluation.py
      - name: Verify exact original-evaluation intent
        id: intent
        shell: bash
        run: |
          marker=ops/closed-market-structural-evaluation-once.txt
          subject=OWNER_CLOSED_MARKET_STRUCTURAL_EVALUATION_ONCE
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" && "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "$subject" &&
                "$(git diff-tree --no-commit-id --name-status -r HEAD)" == $'A\t'"$marker" &&
                -z "$(git log -1 --format=%H HEAD^ -- "$marker")" && "$(cat "$marker")" == "$subject" ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          fi
  evaluate:
    needs: verify
    if: needs.verify.outputs.authorized == 'true'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: mxm-closed-market-original-structural-evaluation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: closed-market-original-ciphertext
          path: closed-market-source
          run-id: 44733062339
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: closed-market-original-source-public
          path: closed-market-source
          run-id: 44733062339
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hxc1-original-historical-encrypted-source
          path: hxc1-original
          run-id: 43817213663
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: integrated-full-session-custody
          path: integrated-sealed-source
          run-id: 44687919474
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: integrated-full-session-source-public
          path: integrated-source-public
          run-id: 44687919474
          github-token: ${{ github.token }}
      - run: python -m research.closed_market_structural_evaluation
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: closed-market-structural-original-public
          path: closed-market-structural-public/
          if-no-files-found: warn
          retention-days: 90
