name: PVE3 ORIGINAL multiscale distributional economic research and native scorecard
on:
  pull_request:
    paths:
      - 'research/PVE3_FROZEN_DISTRIBUTIONAL_DECISION_PROTOCOL_20261117.md'
      - 'research/PVE3_PRESOURCE_CARDINALITY_AND_ACCOUNTING_NOTE_20261117.md'
      - 'research/pve3_multiscale_distributional_decision.py'
      - 'research/test_pve3_multiscale_distributional_decision.py'
      - 'src/Mxm.Core/NativePerformanceScorecard.cs'
      - 'src/Mxm.Core/NativePve3FeatureMath.cs'
      - 'src/Mxm.Replay/Pve3NativeActionResearch.cs'
      - 'src/Mxm.Replay/Program.cs'
      - '.github/workflows/pve3-original-native-scorecard.yml'
  push:
    branches: [main]
    paths:
      - 'ops/pve3-original-once.txt'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      authorized: ${{ steps.owner.outputs.authorized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt numpy==2.3.5
      - name: PVE3 original protocol immutable and committed BEFORE implementation
        run: |
          git merge-base --is-ancestor 7161003f71f34dc4d28fb9aeb56f2ea83ed2f78a HEAD
          git show 7161003f71f34dc4d28fb9aeb56f2ea83ed2f78a:research/PVE3_FROZEN_DISTRIBUTIONAL_DECISION_PROTOCOL_20261117.md > /tmp/pve3-frozen.md
          cmp /tmp/pve3-frozen.md research/PVE3_FROZEN_DISTRIBUTIONAL_DECISION_PROTOCOL_20261117.md
      - run: python -m unittest research.test_pve3_multiscale_distributional_decision -v
      - run: dotnet build src/Mxm.Replay -c Release
      - run: dotnet run --project tests/Mxm.Checks -c Release
      - run: python -m research.verify_owner_policy
      - name: OWNER original exact research source-readback intent
        id: owner
        shell: bash
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_PVE3_ORIGINAL_ONCE" &&
                "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/pve3-original-once.txt" &&
                "$(cat ops/pve3-original-once.txt)" == "OWNER_PVE3_NEW_MULTISCALE_DISTRIBUTIONAL_EUR300_ONCE" ]]; then
            echo 'authorized=true' >> "$GITHUB_OUTPUT"
          fi
  protected-original:
    needs: verify
    if: ${{ needs.verify.outputs.authorized == 'true' }}
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: mxm-pve3-original-once
      cancel-in-progress: false
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt numpy==2.3.5
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          run-id: 41724643418
          github-token: ${{ github.token }}
          path: bdp-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sealed-source
          run-id: 41735441128
          github-token: ${{ github.token }}
          path: aip-source
      - name: Authenticate original immutable source, new multiscale model and native scorecard
        run: python -m research.pve3_multiscale_distributional_decision
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
          PVE3_DOTNET: dotnet
      - name: Preserve all resulting receipts even on original error
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pve3-original-new-predictive-and-native-financial
          path: pve3-original-*.json
          if-no-files-found: warn
          retention-days: 90
      - if: success()
        run: sha256sum research/PVE3_FROZEN_DISTRIBUTIONAL_DECISION_PROTOCOL_20261117.md research/pve3_multiscale_distributional_decision.py src/Mxm.Core/NativePerformanceScorecard.cs src/Mxm.Replay/Pve3NativeActionResearch.cs pve3-original-*.json
