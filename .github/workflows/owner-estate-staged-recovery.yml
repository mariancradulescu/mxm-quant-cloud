name: OWNER staged full-estate technical recovery
on:
  pull_request:
    paths: ['research/estate_staged_resume_2.json','research/owner_earlier_lifecycle_digest_recovery.py','research/owner_causal_ridge_common_book.py','research/estate_staged_technical_recovery_1.json','research/owner_estate_staged_recovery.py','research/bounded_exact_json.py','research/test_bounded_estate_recovery.py','research/owner_estate_recovery.py','src/Mxm.Replay/IntegratedEconomicReplay.CompetitiveFamilies.cs','.github/workflows/owner-estate-staged-recovery.yml']
  push:
    branches: [main]
    paths: ['research/estate_staged_technical_recovery_1.json','research/estate_staged_resume_2.json']
permissions:
  contents: read
  actions: read
jobs:
  technical:
    runs-on: ubuntu-24.04
    outputs:
      repair: ${{ steps.scope.outputs.repair }}
      resume: ${{ steps.scope.outputs.resume }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = push ] && git diff --diff-filter=A --name-only "$BEFORE" "$GITHUB_SHA" | grep -Fxq research/estate_staged_technical_recovery_1.json; then
            echo 'repair=true' >> "$GITHUB_OUTPUT"
          else
            echo 'repair=false' >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT_NAME" = push ] && git diff --diff-filter=A --name-only "$BEFORE" "$GITHUB_SHA" | grep -Fxq research/estate_staged_resume_2.json; then
            echo 'resume=true' >> "$GITHUB_OUTPUT"
          else
            echo 'resume=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.owner_estate_staged_recovery check
      - run: python -m compileall -q research/owner_earlier_lifecycle_digest_recovery.py research/owner_causal_ridge_common_book.py research/owner_estate_staged_recovery.py research/bounded_exact_json.py research/owner_estate_recovery.py
      - run: dotnet build src/Mxm.PathResearch -c Release
      - run: dotnet build src/Mxm.Replay -c Release
      - run: dotnet build src/Mxm.Cloud -c Release
      - run: dotnet run --project tests/Mxm.Checks -c Release
      - run: python -m unittest research.test_bounded_estate_recovery research.test_estate_monetary_competition research.test_estate_recovery research.test_causal_ridge_common_book -v
  fragments:
    needs: technical
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'mariancradulescu' && needs.technical.outputs.repair == 'true' && needs.technical.outputs.resume != 'true'
    strategy:
      fail-fast: false
      matrix:
        part: [base,T4,T5,T6,T7,T8,T9,T10,T11,legacy]
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.owner_estate_staged_recovery fragment --part '${{ matrix.part }}' --work "$RUNNER_TEMP/estate-fragment"
        env:
          GH_TOKEN: ${{ github.token }}
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: estate-fragment-${{ matrix.part }}-sealed-attempt${{ github.run_attempt }}
          path: estate-fragment-sealed/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: estate-fragment-${{ matrix.part }}-public-attempt${{ github.run_attempt }}
          path: estate-fragment-public/
          retention-days: 90
          if-no-files-found: warn
  prepare:
    needs: [technical,fragments]
    if: always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'mariancradulescu' && needs.technical.result == 'success' && ((needs.technical.outputs.resume == 'true' && needs.fragments.result == 'skipped') || (needs.technical.outputs.repair == 'true' && needs.fragments.result == 'success'))
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: |
          if [ "$REUSE_FRAGMENTS" = true ]; then
            python -m research.owner_estate_staged_recovery assemble --reuse-fragments --work "$RUNNER_TEMP/estate-prepared"
          else
            python -m research.owner_estate_staged_recovery assemble --work "$RUNNER_TEMP/estate-prepared"
          fi
        env:
          REUSE_FRAGMENTS: ${{ needs.technical.outputs.resume }}
          GH_TOKEN: ${{ github.token }}
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-estate-prepared-public-attempt${{ github.run_attempt }}
          path: estate-monetary-report/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-estate-monetary-reusable-source-attempt${{ github.run_attempt }}
          path: estate-monetary-source-sealed/
          retention-days: 90
          if-no-files-found: warn
  information:
    needs: prepare
    if: always() && !cancelled() && needs.prepare.result == 'success'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.PathResearch -c Release
      - run: python -m research.owner_estate_staged_recovery information --work "$RUNNER_TEMP/estate-information"
        env:
          GH_TOKEN: ${{ github.token }}
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-estate-information-public-attempt${{ github.run_attempt }}
          path: estate-monetary-report/
          retention-days: 90
          if-no-files-found: warn
  cost:
    needs: prepare
    if: always() && !cancelled() && needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        stress: [0,1,2]
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - run: python -m research.owner_estate_staged_recovery evaluate --cost '${{ matrix.stress }}' --work "$RUNNER_TEMP/estate-cost"
        env:
          GH_TOKEN: ${{ github.token }}
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - run: python -m research.owner_estate_staged_recovery conserve
        if: always()
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-estate-cost-S${{ matrix.stress }}-public-attempt${{ github.run_attempt }}
          path: estate-monetary-report/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-estate-cost-S${{ matrix.stress }}-sealed-books-attempt${{ github.run_attempt }}
          path: estate-monetary-books-sealed/
          retention-days: 90
          if-no-files-found: warn
  economic:
    needs: [cost,information]
    if: always() && !cancelled() && needs.cost.result == 'success' && needs.information.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m research.owner_estate_staged_recovery finalize --work "$RUNNER_TEMP/estate-final"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-estate-monetary-public-attempt${{ github.run_attempt }}
          path: estate-monetary-report/
          retention-days: 90
          if-no-files-found: warn
  ridge:
    needs: [technical,economic]
    if: always() && !cancelled() && needs.technical.outputs.resume == 'true' && needs.economic.result == 'success'
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.PathResearch -c Release && dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-history-public-receipt
          path: original-source-history
          run-id: 45396314675
          github-token: ${{ github.token }}
      - run: python -m research.owner_causal_ridge_common_book prepare --work "$RUNNER_TEMP/ridge-private"
        env:
          MXM_RIDGE_STAGED_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ridge-staged-forecast-source-attempt${{ github.run_attempt }}
          path: ridge-monetary-source-sealed/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ridge-staged-forecast-public-attempt${{ github.run_attempt }}
          path: ridge-monetary-report/
          retention-days: 90
          if-no-files-found: error
      - run: python -m research.owner_causal_ridge_common_book evaluate --prepared --work "$RUNNER_TEMP/ridge-private"
        env:
          GH_TOKEN: ${{ github.token }}
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - run: python -m research.owner_causal_ridge_common_book conserve
        if: always()
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ridge-common-book-monetary-public-attempt${{ github.run_attempt }}
          path: ridge-monetary-report/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ridge-common-book-sealed-books-attempt${{ github.run_attempt }}
          path: ridge-monetary-books-sealed/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ridge-common-book-reusable-source-attempt${{ github.run_attempt }}
          path: ridge-monetary-source-sealed/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ridge-common-book-corrected-source-attempt${{ github.run_attempt }}
          path: ridge-monetary-corrected-source-sealed/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ridge-common-book-corrected-books-attempt${{ github.run_attempt }}
          path: ridge-monetary-corrected-books-sealed/
          retention-days: 90
          if-no-files-found: warn
