name: MEF1 explicitly justified read-only technical diagnostic
on:
  workflow_dispatch:
    inputs:
      diagnostic_intent:
        description: 'Type MEF1_TECHNICAL_DIAGNOSTIC_NO_PROMOTION'
        required: true
        type: string
      diagnostic_reason:
        description: 'Concrete reason for a technical source recheck (not economic promotion)'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "ops/mef1-diagnostic-intent.txt"
permissions:
  contents: read
  actions: read
jobs:
  mef1-authenticated-diagnostic-only:
    if: >-
      github.actor == 'mariancradulescu' &&
      ((github.event_name == 'workflow_dispatch' &&
        inputs.diagnostic_intent == 'MEF1_TECHNICAL_DIAGNOSTIC_NO_PROMOTION' &&
        inputs.diagnostic_reason != '') ||
       (github.event_name == 'push' &&
        github.event.head_commit.message == 'MEF1_EXPLICIT_TECHNICAL_DIAGNOSTIC_READONLY_ONCE'))
    environment: mxm-r3-pepperstone-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Prove that only a documented diagnostic-intent file changed
        if: github.event_name == 'push'
        shell: bash
        run: |
          test "$(git log -1 --format=%s)" = 'MEF1_EXPLICIT_TECHNICAL_DIAGNOSTIC_READONLY_ONCE'
          test "$(git diff --name-only HEAD^ HEAD)" = 'ops/mef1-diagnostic-intent.txt'
          test "$(head -n 1 ops/mef1-diagnostic-intent.txt)" = 'MEF1_TECHNICAL_DIAGNOSTIC_NO_PROMOTION'
          test "$(sed -n '2p' ops/mef1-diagnostic-intent.txt | wc -c)" -gt 32
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - name: Original account bounded READ-ONLY source diagnostics, never acceptance
        run: python -m research.mef1
        env:
          R3_CTRADER_CLIENT_ID: ${{ secrets.R3_CTRADER_CLIENT_ID }}
          R3_CTRADER_CLIENT_SECRET: ${{ secrets.R3_CTRADER_CLIENT_SECRET }}
          R3_CTRADER_ACCESS_TOKEN: ${{ secrets.R3_CTRADER_ACCESS_TOKEN }}
      - name: Attach separate diagnostic provenance; never replace original
        shell: bash
        env:
          REASON: ${{ inputs.diagnostic_reason }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source=Path("mef1-public.json").read_bytes()
          reason=os.getenv("REASON") or Path("ops/mef1-diagnostic-intent.txt").read_text().splitlines()[1]
          record={
              "classification":"POSTCLOSURE_TECHNICAL_DIAGNOSTIC_NOT_ECONOMIC_CONFIRMATION",
              "originalAuthorizedRunId":42889124457,
              "originalAuthorizedArtifactId":13796774195,
              "diagnosticRunId":os.environ["GITHUB_RUN_ID"],
              "diagnosticHeadSha":os.environ["GITHUB_SHA"],
              "reason":reason,
              "technicalSourceReceiptSha256":hashlib.sha256(source).hexdigest(),
              "orderPermission":False,
              "economicPromotion":False,
              "fundedNetEur":None,
              "independentConfirmation":False
          }
          Path("mef1-diagnostic-provenance.json").write_text(json.dumps(record,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mef1-postclosure-technical-diagnostic-not-acceptance
          path: |
            mef1-public.json
            mef1-diagnostic-provenance.json
          if-no-files-found: error
          retention-days: 90
