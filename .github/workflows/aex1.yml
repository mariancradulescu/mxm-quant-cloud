name: AEX1 adaptive native shared portfolio original custody
on:
  pull_request:
    paths:
      - 'research/AEX1.md'
      - 'research/aex1.py'
      - 'src/Mxm.Core/NativeAdaptiveExitResearch.cs'
      - 'src/Mxm.Replay/NativeAdaptiveExitExperiment.cs'
      - '.github/workflows/aex1.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aex1.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m py_compile research/aex1.py
      - run: dotnet build src/Mxm.Replay -c Release
  original-custody-development:
    needs: verify
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mariancradulescu' &&
      github.run_attempt == '1' &&
      startsWith(github.event.head_commit.message, 'AEX1_CUSTODY_READONLY_ONE_TIME')
    environment: mxm-r3-custody-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fce1-original-pepperstone-encrypted-source
          run-id: 43036474843
          github-token: ${{ github.token }}
          path: original-source
      - name: Evaluate new AEX1 policy on unchanged authenticated tape
        run: python -m research.aex1
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aex1-original-custody-public-receipt
          path: aex1-public.json
          if-no-files-found: error
          retention-days: 90
