name: CDH1 ORIGINAL Pepperstone causal competing-risk directional CSharp study
on:
  pull_request:
    paths:
      - 'research/CDH1_FROZEN_CAUSAL_COMPETING_DIRECTIONAL_20261118.md'
      - 'research/cdh1_original_native.py'
      - 'src/Mxm.Core/Cdh1NativeResearch.cs'
      - 'src/Mxm.Replay/Cdh1NativeStudy.cs'
      - 'src/Mxm.Replay/Program.cs'
      - '.github/workflows/cdh1-original-competing-directional.yml'
  push:
    branches: [main]
    paths:
      - 'ops/cdh1-original-competing-once.txt'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      original_once: ${{ steps.owner.outputs.original_once }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Ensure CDH1 protocol was frozen in a separate earlier ancestor
        run: |
          git merge-base --is-ancestor b1196ab736f1f95f4476af20dcf8fd1a9944b7fd HEAD
          git show b1196ab736f1f95f4476af20dcf8fd1a9944b7fd:research/CDH1_FROZEN_CAUSAL_COMPETING_DIRECTIONAL_20261118.md >/tmp/cdh1-protocol
          cmp /tmp/cdh1-protocol research/CDH1_FROZEN_CAUSAL_COMPETING_DIRECTIONAL_20261118.md
      - name: Compile authoritative Core+Replay
        run: dotnet build src/Mxm.Replay -c Release
      - name: Compile Cloud link to same Core WITHOUT activation
        run: dotnet build src/Mxm.Cloud -c Release
      - name: Ex-ante admission, censorship and ambiguous competing hazard SYNTHETIC controls
        run: |
          dotnet run --no-build --project src/Mxm.Replay -c Release -- ignored /tmp/cdh1-selftest.json --cdh1-selftest
          python3 -c 'import json; x=json.load(open("/tmp/cdh1-selftest.json")); assert x["Source"]=="SYNTHETIC_CONTROLS_ONLY" and x["OriginalBrokerMarketScores"] == 0 and x["FutureCensorStillInPopulation"] and x["AmbiguousDualTouchRemainsUnknown"] and x["SoftmaxTrulyLearned"] and x["Orders"]==0 and x["NetEur"] is None'
      - name: Python custody syntax and CSharp authority boundary
        run: |
          python3 -m py_compile research/cdh1_original_native.py
          python3 -m research.verify_native_csharp_authority
      - name: Admit one exact OWNER main intent; PR cannot read original source secrets
        id: owner
        shell: bash
        run: |
          echo 'original_once=false' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" &&
                "$GITHUB_REF" == "refs/heads/main" &&
                "$GITHUB_ACTOR" == "mariancradulescu" &&
                "$GITHUB_RUN_ATTEMPT" == "1" &&
                "$(git log -1 --format=%s)" == "OWNER_CDH1_ORIGINAL_HXC1_COMPETING_DIRECTIONAL_ONCE" &&
                "$(git diff-tree --no-commit-id --name-only -r HEAD)" == "ops/cdh1-original-competing-once.txt" &&
                "$(cat ops/cdh1-original-competing-once.txt)" == "OWNER_CDH1_ORIGINAL_H1_M15_CAUSAL_HAZARD_CORE_ONCE" ]]; then
            echo 'original_once=true' >> "$GITHUB_OUTPUT"
          fi
  original-protected-custody-native:
    needs: verify
    if: ${{ needs.verify.outputs.original_once == 'true' }
    environment: mxm-r3-custody-v1
    concurrency:
      group: mxm-cdh1-original-custody-native-once
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt
      - run: dotnet build src/Mxm.Replay -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hxc1-original-historical-encrypted-source
          run-id: 43817213663
          github-token: ${{ github.token }
          path: cdh1-hxc1-source
      - name: One ORIGINAL readback/score on genuine broker historical bars in CSharp Core
        run: python -m research.cdh1_original_native
        env:
          R3_CUSTODY_PRIVATE_KEY_PEM: ${{ secrets.R3_CUSTODY_PRIVATE_KEY_PEM }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cdh1-authentic-competing-directional-native-original-public
          path: cdh1-public/
          retention-days: 90
          if-no-files-found: warn
      - name: Print ONLY SHA256 of PUBLIC aggregate original evidence
        if: success()
        run: sha256sum cdh1-public/*.json
